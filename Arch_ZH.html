<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEA-C01 架構圖</title><style>
*{box-sizing:border-box}
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1d1f;--sub:#666;--line:#d5d7dd;--ok:#1a7f37;--okbg:#e6f6ea;--ng:#c62828;--ngbg:#fdecea;
--acc:#ff9900;--accbg:#ffe8c2;--edge:#9aa0aa;
--l0:#eef0f3;--l1:#e5effb;--l2:#e4f4e8;--l3:#f1e9fa;--l4:#fdeee2;--l5:#e1f3f3;--l6:#fbe8ef;--lt:#fff6dc;--lb:#fdeaea}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--fg:#eee;--sub:#9a9a9a;--line:#3a3a3e;--ok:#4cc26a;--okbg:#14301c;--ng:#ff6b6b;--ngbg:#3a1616;
--accbg:#4a3207;--edge:#6b707a;
--l0:#24262b;--l1:#1b2633;--l2:#1a2b20;--l3:#2a2233;--l4:#33261b;--l5:#183030;--l6:#33202a;--lt:#332c14;--lb:#341d1d}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:15px;margin-right:auto}
header a{font-size:13px;color:var(--acc);white-space:nowrap}
#stage{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
#map{height:44vh;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;touch-action:pan-x pan-y}
#map svg{display:block}
#zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px}
#zoom button,#bar button,#bar select{font-size:14px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
#bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--card)}
#flt{flex:1;min-width:0}
#pos{font-size:13px;color:var(--sub);white-space:nowrap}
#side{padding:8px 6px 40px}
#info{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
#info .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:4px}
.tag{border-radius:4px;padding:0 6px;font-size:12px;background:var(--line);color:var(--fg)}
.tag.m{background:var(--acc);color:#000}
.tag.s{background:none;border:1px solid var(--line);color:var(--sub)}
.tag.w{background:var(--ngbg);color:var(--ng)}
#info .q{margin:0 0 6px}
#info .a{display:flex;gap:6px;padding:5px 6px;border-radius:6px;border:1px solid var(--ok);background:var(--okbg);color:var(--ok);margin-top:5px;font-weight:600}
#info .a i{font-style:normal;flex:none}
#info .y{margin:8px 0 0;font-size:15px}
#info .p{margin-top:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
#info .p span{border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg);white-space:nowrap}
#info .p span.k{border-color:var(--acc);background:var(--accbg);font-weight:600}
#info .p i{font-style:normal;color:var(--sub);margin:0 2px}
#info .n{margin-top:6px;font-size:13px;color:var(--sub)}
#info .lg{font-size:13px;color:var(--sub);margin:6px 0 0}
#chips{display:flex;gap:5px;overflow-x:auto;padding:6px 8px;background:var(--card);border-top:1px solid var(--line);scrollbar-width:thin}
#chips button{flex:none;min-width:44px;font-size:13px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
#chips button.d{border-style:dashed}
#chips button.cur{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.nd{cursor:pointer;transition:opacity .2s}
.nd rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.nd text{fill:var(--fg);font-family:inherit}
.nd .lb{font-size:14px;font-weight:600}
.nd .sb{font-size:11px;fill:var(--sub)}
.lane{fill:var(--sub);font-size:13px;font-weight:600}
.band{stroke:none}
.be{fill:none;stroke:var(--edge);stroke-opacity:.45;transition:stroke-opacity .2s}
.mk-b{fill:var(--edge)}
.mk-a{fill:var(--acc)}
.he{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:8 5;animation:flow 1s linear infinite}
.ne{fill:none;stroke:var(--acc);stroke-opacity:.7}
@keyframes flow{to{stroke-dashoffset:-13}}
@media(prefers-reduced-motion:reduce){.he{animation:none;stroke-dasharray:none}}
svg.sel .nd{opacity:.2}
svg.sel .nd.on,svg.sel .nd.al{opacity:1}
svg.sel .be{stroke-opacity:.07}
.nd.on rect{stroke:var(--acc);stroke-width:2.5}
.nd.key rect{fill:var(--accbg);stroke-width:3.5}
.nd.al rect{stroke:var(--acc);stroke-dasharray:5 4;stroke-width:2}
.st rect{fill:var(--acc)}
.st text{fill:#000;font-size:12px;font-weight:700;text-anchor:middle}
@media(min-width:960px){
#layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
#stage{top:0;height:calc(100vh - 41px);display:flex;flex-direction:column;border-bottom:none;border-right:1px solid var(--line)}
#map{height:auto;flex:1}
#side{max-height:calc(100vh - 41px);overflow:auto;position:sticky;top:0}}
</style></head><body>

g id="base"></g><g class="nd l0" data-id="src_db"><title>地端／外部 DB：來源資料庫：Oracle、SQL Server、MySQL、PostgreSQL、Teradata、SAP 等</title><rect x="20" y="176" width="150" height="56" rx="8"/><text class="lb" x="95.0" y="201.0" text-anchor="middle">地端／外部 DB</text><text class="sb" x="95.0" y="218.0" text-anchor="middle">Oracle・SQL Server・MySQL</text></g><g class="nd l0" data-id="src_file"><title>地端檔案：地端檔案系統、NAS、SFTP 用戶端、地端 Hadoop 檔案</title><rect x="20" y="248" width="150" height="56" rx="8"/><text class="lb" x="95.0" y="273.0" text-anchor="middle">地端檔案</text><text class="sb" x="95.0" y="290.0" text-anchor="middle">NAS・檔案伺服器・SFTP</text></g><g class="nd l0" data-id="src_saas"><title>SaaS／第三方：Salesforce 等 SaaS 應用、第三方資料集</title><rect x="20" y="320" width="150" height="56" rx="8"/><text class="lb" x="95.0" y="345.0" text-anchor="middle">SaaS／第三方</text><text class="sb" x="95.0" y="362.0" text-anchor="middle">Salesforce・第三方資料</text></g><g class="nd l0" data-id="src_stream"><title>串流來源：IoT 感測器、網站點擊流、App 與遊戲事件、應用程式日誌</title><rect x="20" y="392" width="150" height="56" rx="8"/><text class="lb" x="95.0" y="417.0" text-anchor="middle">串流來源</text><text class="sb" x="95.0" y="434.0" text-anchor="middle">IoT・點擊流・App 事件</text></g><g class="nd l1" data-id="dms"><title>AWS DMS：資料庫遷移與 CDC 持續複寫，搭配 SCT 轉換 schema</title><rect x="206" y="176" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="201.0" text-anchor="middle">AWS DMS</text><text class="sb" x="281.0" y="218.0" text-anchor="middle">full load・CDC・SCT</text></g><g class="nd l1" data-id="datasync"><title>DataSync／傳輸：DataSync 排程同步檔案、Transfer Family（SFTP）、Storage Gateway</title><rect x="206" y="248" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="273.0" text-anchor="middle">DataSync／傳輸</text><text class="sb" x="281.0" y="290.0" text-anchor="middle">Transfer Family・Gateway</text></g><g class="nd l1" data-id="appflow"><title>AppFlow：AppFlow 免寫程式整合 SaaS；AWS Data Exchange 訂閱第三方資料</title><rect x="206" y="320" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="345.0" text-anchor="middle">AppFlow</text><text class="sb" x="281.0" y="362.0" text-anchor="middle">SaaS 整合・Data Exchange</text></g><g class="nd l1" data-id="kds"><title>Kinesis Data Streams：即時串流：partition key、shard、KPL/KCL、enhanced fan-out</title><rect x="206" y="392" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="417.0" text-anchor="middle">Kinesis Data Streams</text><text class="sb" x="281.0" y="434.0" text-anchor="middle">KPL・KCL・shard</text></g><g class="nd l1" data-id="msk"><title>Amazon MSK：託管 Kafka：MSK Serverless、Replicator、broker storage</title><rect x="206" y="464" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="489.0" text-anchor="middle">Amazon MSK</text><text class="sb" x="281.0" y="506.0" text-anchor="middle">Kafka・Serverless</text></g><g class="nd l1" data-id="firehose"><title>Data Firehose：全託管投遞到 S3／Redshift／OpenSearch／Splunk，可轉 Parquet、呼叫 Lambda</title><rect x="206" y="536" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="561.0" text-anchor="middle">Data Firehose</text><text class="sb" x="281.0" y="578.0" text-anchor="middle">投遞・格式轉換</text></g><g class="nd l2" data-id="s3_tier"><title>S3 Lifecycle／保護：儲存類別（Standard-IA、Glacier、Intelligent-Tiering）、Lifecycle、Object Lock、Backup</title><rect x="392" y="176" width="150" height="56" rx="8"/><text class="lb" x="467.0" y="201.0" text-anchor="middle">S3 Lifecycle／保護</text><text class="sb" x="467.0" y="218.0" text-anchor="middle">IA・Glacier・Object Lock</text></g><g class="nd l2" data-id="s3"><title>Amazon S3：資料湖主儲存：分區、Parquet、事件通知、S3 Select、Object Lambda、versioning</title><rect x="392" y="248" width="150" height="128" rx="8"/><text class="lb" x="467.0" y="309.0" text-anchor="middle">Amazon S3</text><text class="sb" x="467.0" y="326.0" text-anchor="middle">data lake・分區・事件</text></g><g class="nd l2" data-id="table_fmt"><title>Iceberg／Hudi：開放表格式：MERGE／upsert、ACID、compaction、copy-on-write</title><rect x="392" y="392" width="150" height="56" rx="8"/><text class="lb" x="467.0" y="417.0" text-anchor="middle">Iceberg／Hudi</text><text class="sb" x="467.0" y="434.0" text-anchor="middle">MERGE・compaction</text></g><g class="nd l3" data-id="crawler"><title>Glue Crawler：爬 S3／JDBC 推斷 schema、建表、更新分區</title><rect x="578" y="176" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="201.0" text-anchor="middle">Glue Crawler</text><text class="sb" x="653.0" y="218.0" text-anchor="middle">推斷 schema・加分區</text></g><g class="nd l3" data-id="catalog"><title>Glue Data Catalog：中央 metadata：表、分區、partition index／projection、Schema Registry</title><rect x="578" y="248" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="273.0" text-anchor="middle">Glue Data Catalog</text><text class="sb" x="653.0" y="290.0" text-anchor="middle">metadata・分區索引</text></g><g class="nd l3" data-id="lf"><title>Lake Formation：集中治理：列／欄級權限、data filter、LF-Tags、跨帳號共享、DataZone</title><rect x="578" y="320" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="345.0" text-anchor="middle">Lake Formation</text><text class="sb" x="653.0" y="362.0" text-anchor="middle">列欄權限・DataZone</text></g><g class="nd l3" data-id="gdq"><title>Glue Data Quality：DQDL 規則、ruleset、異常偵測、品質分數</title><rect x="578" y="392" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="417.0" text-anchor="middle">Glue Data Quality</text><text class="sb" x="653.0" y="434.0" text-anchor="middle">DQDL・異常偵測</text></g><g class="nd l3" data-id="databrew"><title>Glue DataBrew：視覺化 recipe 清理、profile job、PII 遮罩，幾乎不寫程式</title><rect x="578" y="464" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="489.0" text-anchor="middle">Glue DataBrew</text><text class="sb" x="653.0" y="506.0" text-anchor="middle">recipe・profile</text></g><g class="nd l4" data-id="glue"><title>Glue ETL job：serverless Spark／Python shell ETL：bookmark、Flex、DynamicFrame、FindMatches、Detect PII</title><rect x="764" y="176" width="150" height="56" rx="8"/><text class="lb" x="839.0" y="201.0" text-anchor="middle">Glue ETL job</text><text class="sb" x="839.0" y="218.0" text-anchor="middle">Spark・bookmark・Flex</text></g><g class="nd l4" data-id="emr"><title>Amazon EMR：Spark／Hive／Hadoop 叢集、EMR step、runtime role</title><rect x="764" y="248" width="150" height="56" rx="8"/><text class="lb" x="839.0" y="273.0" text-anchor="middle">Amazon EMR</text><text class="sb" x="839.0" y="290.0" text-anchor="middle">Spark・Hive・Hadoop</text></g><g class="nd l4" data-id="lambda"><title>AWS Lambda：事件驅動輕量運算：layer、concurrency、記憶體／CPU</title><rect x="764" y="320" width="150" height="56" rx="8"/><text class="lb" x="839.0" y="345.0" text-anchor="middle">AWS Lambda</text><text class="sb" x="839.0" y="362.0" text-anchor="middle">事件驅動・layer</text></g><g class="nd l4" data-id="flink"><title>Managed Flink：有狀態串流處理：時間視窗聚合、即時偵測</title><rect x="764" y="392" width="150" height="56" rx="8"/><text class="lb" x="839.0" y="417.0" text-anchor="middle">Managed Flink</text><text class="sb" x="839.0" y="434.0" text-anchor="middle">有狀態串流・視窗</text></g><g class="nd l5" data-id="athena"><title>Amazon Athena：serverless SQL 查 S3：分區裁剪、workgroup、federated query、結果重用</title><rect x="950" y="176" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="201.0" text-anchor="middle">Amazon Athena</text><text class="sb" x="1025.0" y="218.0" text-anchor="middle">SQL 查 S3・workgroup</text></g><g class="nd l5" data-id="redshift"><title>Amazon Redshift：資料倉儲：COPY／UNLOAD、Spectrum、data sharing、streaming ingestion、MV、分佈與排序鍵</title><rect x="950" y="248" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="273.0" text-anchor="middle">Amazon Redshift</text><text class="sb" x="1025.0" y="290.0" text-anchor="middle">Serverless・Spectrum・MV</text></g><g class="nd l5" data-id="rds"><title>RDS／Aurora：關聯式資料庫：RDS、Aurora、zero-ETL 來源</title><rect x="950" y="320" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="345.0" text-anchor="middle">RDS／Aurora</text><text class="sb" x="1025.0" y="362.0" text-anchor="middle">關聯式・zero-ETL</text></g><g class="nd l5" data-id="dynamodb"><title>DynamoDB：NoSQL：GSI、TTL、Streams、DAX、容量模式</title><rect x="950" y="392" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="417.0" text-anchor="middle">DynamoDB</text><text class="sb" x="1025.0" y="434.0" text-anchor="middle">毫秒讀寫・GSI・TTL</text></g><g class="nd l5" data-id="opensearch"><title>OpenSearch：搜尋與日誌分析、OpenSearch Dashboards</title><rect x="950" y="464" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="489.0" text-anchor="middle">OpenSearch</text><text class="sb" x="1025.0" y="506.0" text-anchor="middle">搜尋・日誌分析</text></g><g class="nd l5" data-id="neptune"><title>Neptune／Timestream：圖形資料庫（Gremlin／SPARQL）與時序資料庫</title><rect x="950" y="536" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="561.0" text-anchor="middle">Neptune／Timestream</text><text class="sb" x="1025.0" y="578.0" text-anchor="middle">圖形・時序資料庫</text></g><g class="nd l6" data-id="quicksight"><title>QuickSight：BI 儀表板：SPICE、calculated field、LAC、Amazon Q</title><rect x="1136" y="176" width="150" height="56" rx="8"/><text class="lb" x="1211.0" y="201.0" text-anchor="middle">QuickSight</text><text class="sb" x="1211.0" y="218.0" text-anchor="middle">儀表板・SPICE・Q</text></g><g class="nd l6" data-id="users"><title>使用者／團隊：分析師、部門、跨帳號 consumer 等存取者</title><rect x="1136" y="248" width="150" height="56" rx="8"/><text class="lb" x="1211.0" y="273.0" text-anchor="middle">使用者／團隊</text><text class="sb" x="1211.0" y="290.0" text-anchor="middle">分析師・部門・consumer</text></g><g class="nd l6" data-id="app"><title>應用程式／API：Web／行動 App、API Gateway、EKS／ECS 微服務、REST API</title><rect x="1136" y="320" width="150" height="56" rx="8"/><text class="lb" x="1211.0" y="345.0" text-anchor="middle">應用程式／API</text><text class="sb" x="1211.0" y="362.0" text-anchor="middle">Web App・API Gateway</text></g><g class="nd l6" data-id="ml"><title>SageMaker／AI：SageMaker、Bedrock、Comprehend、Redshift ML</title><rect x="1136" y="392" hor="middle">通知・佇列・DLQ</text></g><g class="nd lb" data-id="vpc"><title>VPC／網路：subnet、security group、route table、VPC endpoint、Direct Connect、VPN</title><rect x="20" y="648" width="150" height="56" rx="8"/><text class="lb" x="95.0" y="673.0" text-anchor="middle">VPC／網路</text><text class="sb" x="95.0" y="690.0" text-anchor="middle">endpoint・SG・Direct Connect</text></g><g class="nd lb" data-id="secrets"><title>Secrets Manager：集中保存資料庫憑證並自動輪換</title><rect x="206" y="648" width="150" height="56" rx="8"/><text class="lb" x="281.0" y="673.0" text-anchor="middle">Secrets Manager</text><text class="sb" x="281.0" y="690.0" text-anchor="middle">憑證・自動輪換</text></g><g class="nd lb" data-id="kms"><title>KMS／加密：SSE-KMS、DSSE、金鑰權限、傳輸加密與憑證</title><rect x="392" y="648" width="150" height="56" rx="8"/><text class="lb" x="467.0" y="673.0" text-anchor="middle">KMS／加密</text><text class="sb" x="467.0" y="690.0" text-anchor="middle">SSE-KMS・TLS</text></g><g class="nd lb" data-id="macie"><title>Macie：S3 敏感資料探索與分類，找出 PII</title><rect x="578" y="648" width="150" height="56" rx="8"/><text class="lb" x="653.0" y="673.0" text-anchor="middle">Macie</text><text class="sb" x="653.0" y="690.0" text-anchor="middle">S3 敏感資料探索</text></g><g class="nd lb" data-id="iam"><title>IAM：IAM role、policy、AssumeRole、IRSA、資料庫角色</title><rect x="764" y="648" width="150" height="56" rx="8"/><text class="lb" x="839.0" y="673.0" text-anchor="middle">IAM</text><text class="sb" x="839.0" y="690.0" text-anchor="middle">role・policy・RBAC</text></g><g class="nd lb" data-id="cloudtrail"><title>CloudTrail：記錄 API 與 S3 data events，做稽核</title><rect x="950" y="648" width="150" height="56" rx="8"/><text class="lb" x="1025.0" y="673.0" text-anchor="middle">CloudTrail</text><text class="sb" x="1025.0" y="690.0" text-anchor="middle">API・data events 稽核</text></g><g class="nd lb" data-id="cloudwatch"><title>CloudWatch：Logs、metrics、alarm、subscription filter、Logs 資料保護政策</title><rect x="1136" y="648" width="150" height="56" rx="8"/><text class= <script>const Q=[{"n":1,"q":"Glue job 讀 S3 時出現 S3 VPC 閘道端點錯誤，Glue 連線與 IAM 角色已設好，如何修正？","a":"D","t":[["D","確認 VPC 路由表含 S3 閘道端點路由"]],"s":"13.1","o":307,"w":"錯誤指向 S3 閘道端點，而閘道端點是靠 VPC route table 生效：Glue 所在 subnet 的路由表要有指向 S3 prefix list 的路由才連得到。SG、bucket policy、FQDN 都不是這個錯誤的原因。","p":["glue","vpc","s3"],"k":"vpc","x":[],"d":""},{"n":2,"q":"S3 客戶資料中心，分析師只能存取同國家客戶的資料，最少營運工作量？","a":"B","t":[["B","S3 註冊 Lake Formation+列級安全"]],"s":"12.1","o":260,"w":"要依分析師所在國家限制可見的客戶列。S3 註冊到 Lake Formation 後，用 row-level security 依 country 過濾，集中管理最省事；拆表、搬 Region、每國建 Redshift view 都要額外維護。","p":["s3","lf","users"],"k":"lf","x":[],"d":""},{"n":3,"q":"推薦系統要整合第三方資料集，希望最少工作量與時間，最低營運負擔？","a":"A","t":[["A","API 從 AWS Data Exchange 取資料"]],"s":"2.4","o":37,"w":"要用最少時間與工作量取得第三方資料集。AWS Data Exchange 就是第三方資料集的訂閱市集，訂閱後用 API 整合進現有分析平台；DataSync 是搬自家資料，CodeCommit、ECR 不是資料集來源。","p":["src_saas","appflow","app"],"k":"appflow","x":[],"d":""},{"n":4,"q":"建 data mesh，需集中治理、資料分析與存取控制，已用 Glue 做目錄與 ETL，選哪兩項？（選2）","a":"BE","t":[["B","S3 存資料，Athena 分析"],["E","Lake Formation 做集中治理與權限"]],"s":"12.2","o":270,"w":"Data mesh 要共享儲存、分析與集中治理：S3 當共用 data lake，Athena 用 serverless SQL 直接查（B）；Lake Formation 搭配 Glue Catalog 做集中治理與細粒度權限（E）。","p":["s3","lf","athena","users"],"k":"lf","x":["catalog"],"d":""},{"n":5,"q":"多個 Lambda 共用自訂 Python 腳本，改腳本就要逐一更新函式，如何減少手動？","a":"B","t":[["B","腳本打包成 Lambda layer 掛到各函式"]],"s":"7.7","o":160,"w":"共用腳本一改就要逐一更新每支 Lambda。打包成 Lambda layer 讓各函式引用，之後只要發布新 layer 版本即可集中更新；S3 指標、環境變數或 alias 都不是共用程式碼的機制。","p":["app","lambda"],"k":"lambda","x":[],"d":""},{"n":6,"q":"Glue ETL 管線需爬取 SQL Server 表、ETL 到 S3 並編排管線，最具成本效益？","a":"B","t":[["B","Glue workflows"]],"s":"7.1","o":128,"w":"整條 pipeline 都在 Glue 內：crawler 爬 SQL Server、Glue job 做 ETL 寫到 S3。Glue workflows 用 trigger 串起 crawler 與 job，不必另養編排服務，比 Step Functions 或 MWAA 省錢。","p":["glue_wf","crawler","glue","s3"],"k":"glue_wf","x":[],"d":""},{"n":7,"q":"Web 交易 App 要直接對 Redshift 財務資料即時查詢，最低營運負擔？","a":"B","t":[["B","使用 Redshift Data API"]],"s":"9.1","o":199,"w":"要在 Web 交易 App 內直接對 Redshift 下 SQL 且維運最低。Redshift Data API 走 HTTPS 呼叫，不必管理 JDBC driver 或 WebSocket 長連線；S3 Select 查的是 S3，不是 Redshift。","p":["app","redshift"],"k":"redshift","x":[],"d":""},{"n":8,"q":"同一帳號內多種 Athena 用途，需依使用者/團隊/App 隔離查詢與查詢歷史的權限？","a":"B","t":[["B","每用途一個 workgroup+標籤 IAM"]],"s":"8.5","o":184,"w":"要在同帳號內隔離各用途的查詢與查詢歷史。Athena workgroup 本身就隔離查詢設定與 history，每個 use case 建一個，再用 tag-based IAM policy 控權；bucket policy 管不到查詢歷史。","p":["users","iam","athena"],"k":"athena","x":[],"d":""},{"n":9,"q":"每天跑一組 Glue job，不要求特定時間開始或完成，最具成本效益？","a":"A","t":[["A","Glue job 選 FLEX 執行類別"]],"s":"6.6","o":125,"w":"Glue job 不必準時開始或完成，正是 FLEX execution class 的情境：用閒置資源執行，成本比 STANDARD 低，代價是啟動與執行時間不固定。Glue 沒有 Spot 選項，升級版本也不保證省錢。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":10,"q":"只有上傳 .csv 到 S3 時才觸發 Lambda 轉 Parquet，最低營運負擔？","a":"A","t":[["A","ObjectCreated:*+後綴.csv→Lambda"]],"s":"7.5","o":150,"w":"只在上傳 .csv 時觸發：事件型別選 s3:ObjectCreated:* 涵蓋各種上傳，加 suffix .csv 篩選，目的地直接設 Lambda ARN，不經 SNS 最省維運。s3:* 連刪除都會觸發，tagging 事件也不對。","p":["s3","lambda"],"k":"s3","x":[],"d":""},{"n":11,"q":"Athena 查詢未壓縮 .csv，多數查詢只選特定欄位，哪個做法最能加速？","a":"C","t":[["C","改 Parquet+Snappy 壓縮"]],"s":"8.2","o":170,"w":"查詢多半只選特定欄位，但 CSV 是 row-based 又未壓縮，每次都得掃整列。改成欄式的 Parquet 只讀需要的欄位，加 Snappy 壓縮再減少掃描量；只壓縮 CSV 或改 JSON 仍要讀整列。","p":["s3","athena"],"k":"s3","x":[],"d":""},{"n":12,"q":"感測器資料經 KDS→Firehose→S3，需在工廠大螢幕顯示即時營運效率，最低延遲？","a":"A","t":[["A","Flink→連接器寫 Timestream→Grafana"]],"s":"3.5","o":59,"w":"要最低延遲，就不能等 Firehose 把資料落到 S3 才處理。Managed Flink 直接消費 Kinesis Data Streams 即時運算，用 Flink connector 寫入時序資料庫 Timestream，再由 Grafana 即時呈現。","p":["src_stream","kds","flink","neptune","app"],"k":"flink","x":[],"d":""},{"n":13,"q":"Glue crawler 爬 S3 的每日 .csv，需讓資料每天可在 Glue Data Catalog 存取？","a":"B","t":[["B","GlueServiceRole，每日排程，輸出 DB"]],"s":"4.2","o":70,"w":"crawler 用含 AWSGlueServiceRole 的 role，指定 S3 路徑並設每日排程，輸出指定 database 才會在 Data Catalog 建表。AmazonS3FullAccess 沒有 Glue 權限，輸出到 S3 也進不了 Catalog。","p":["s3","crawler","catalog"],"k":"crawler","x":["iam"],"d":""},{"n":14,"q":"Redshift 每日載入後，要觸發 Lambda 把各表載入狀態寫入 DynamoDB，如何呼叫 Lambda？","a":"B","t":[["B","Data API 發事件→EventBridge→Lambda"]],"s":"14.2","o":323,"w":"Redshift Data API 可把 SQL 執行狀態事件送到 EventBridge，再由 rule 呼叫 Lambda 寫入 DynamoDB，事件驅動又低耦合；另用一支 Lambda 監聽 CloudTrail 是多繞一層。","p":["redshift","eventbridge","lambda","dynamodb"],"k":"eventbridge","x":[],"d":""},{"n":15,"q":"地端 5TB 多格式檔案安全傳到 S3，每天約 5% 變動，需自動排程定期同步，最具營運效率？","a":"A","t":[["A","AWS DataSync"]],"s":"2.1","o":26,"w":"5TB 檔案每天約 5% 變動，要定期自動同步到 S3。DataSync 用 agent 連地端，task 可排程、只傳變動檔案並加密驗證，維運最省；Direct Connect 只是線路，Transfer Acceleration 不會排程。","p":["src_file","datasync","s3"],"k":"datasync","x":[],"d":""},{"n":16,"q":"每月把地端 SQL Server 交易資料遷到 RDS，成本上升，需具成本效益且停機最少？","a":"B","t":[["B","AWS DMS"]],"s":"2.2","o":28,"w":"每月把地端 SQL Server 搬到 RDS，要省成本又停機最少。DMS 先 full load 再用 CDC 持續複寫，切換只需短暫停機；DataSync 搬檔案、Direct Connect 只是網路，都不做 DB 複寫。","p":["src_db","dms","rds"],"k":"dms","x":[],"d":""},{"n":17,"q":"Glue ETL 處理 RDS 與 MongoDB 資料並載入 Redshift，每小時更新，最低營運負擔？（選2）","a":"AD","t":[["A","Glue trigger 每小時執行 ETL"],["D","Glue connection 連來源與 Redshift"]],"s":"7.1","o":129,"w":"每小時跑 Glue ETL 且維運最低：Glue trigger 內建排程，不必另用 Lambda 定時啟動（A）；Glue connection 封裝 RDS、MongoDB、Redshift 的網路與憑證設定，job 直接引用即可連線（D）。","p":["rds","glue","redshift"],"k":"glue_wf","x":["glue_wf","vpc"],"d":""},{"n":18,"q":"RA3 節點的 Redshift 叢集要擴充讀寫容量，如何開啟 concurrency scaling？","a":"B","t":[["B","在叢集 WLM 佇列層級開啟"]],"s":"9.6","o":220,"w":"RA3 是 provisioned 叢集，Concurrency Scaling 要在 WLM queue 層級開啟：哪個 queue 壓力大就對它開，自動加臨時容量。Serverless workgroup、建叢集設定、usage quota 都不是這個開關。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":19,"q":"每天編排一系列 Athena 查詢，每個可能跑超過 15 分鐘，最具成本效益？（選2）","a":"AB","t":[["A","Lambda 呼叫 start_query_execution"],["B","Step Functions Wait 狀態輪詢完成"]],"s":"7.2","o":133,"w":"每段查詢可能跑超過 Lambda 15 分鐘上限，Lambda 只負責 start_query_execution 送出（A）；Step Functions 用 Wait state 定期以 get_query_execution 檢查，完成再接下一段（B）。","p":["sfn","lambda","athena"],"k":"sfn","x":[],"d":"⚠ 社群對是否需 Step Functions 有分歧"},{"n":20,"q":"地端用 Pig、Oozie、Spark、HBase、Flink 秒級處理 PB 資料，遷 AWS 需維持效能並降營運負擔，選哪個？","a":"B","t":[["B","Amazon EMR"]],"s":"6.1","o":114,"w":"Pig、Oozie、Spark、HBase、Flink 是整套 Hadoop 生態系，要維持效能又少維運。EMR 是託管的 Hadoop/Spark 平台，這些元件可直接上叢集並彈性擴展；Glue 只是 serverless ETL，撐不起整套。","p":["src_file","emr"],"k":"emr","x":[],"d":""},{"n":21,"q":"資料集含 PII，匯入 S3 資料湖時需剖析並模糊化 PII，最低營運工作量？","a":"B","t":[["B","Glue Detect PII 遮蔽+Step Functions"]],"s":"12.7","o":294,"w":"匯入 S3 前要剖析並遮蔽 PII。Glue Studio 內建 Detect PII transform 能自動偵測並遮蔽，再用 Step Functions 編排匯入 data lake；Firehose 加 Lambda、DynamoDB 方案都要自寫偵測程式。","p":["sfn","glue","s3"],"k":"glue","x":[],"d":"⚠ 社群對是否需 Glue Data Quality/Step Functions 有爭議"},{"n":22,"q":"多個 ETL 流程用 Glue 與 EMR 寫入 S3 資料湖，需自動編排且最低營運負擔？","a":"B","t":[["B","Step Functions tasks"]],"s":"7.2","o":134,"w":"ETL 同時用到 Glue 與 EMR，需要跨服務編排。Step Functions 的 task state 能直接啟動 Glue job 與 EMR step，並處理相依、重試與錯誤；Glue workflows 只管 Glue，MWAA 要養 Airflow。","p":["sfn","glue","emr","s3"],"k":"sfn","x":[],"d":""},{"n":23,"q":"S3 Standard 資料：前6個月每天多次存取，6個月~2年每月1-2次，2年後每年1-2次；需維持高可用，最省成本？","a":"C","t":[["C","6M→Standard-IA，2Y→Deep Archive"]],"s":"1.2","o":2,"w":"存取頻率隨時間下降且要維持高可用：6 個月後每月讀 1～2 次，轉多 AZ 的 Standard-IA（One Zone-IA 只有單一 AZ）；2 年後每年只讀 1～2 次，轉 Glacier Deep Archive 成本最低。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":"⚠ 社群多選 B"},{"n":24,"q":"業務 BI 叢集需每週 join ETL Redshift 叢集資料，不可干擾關鍵分析，且最少用 ETL 叢集運算？","a":"A","t":[["A","data sharing，BI 叢集為 consumer"]],"s":"9.9","o":234,"w":"BI 叢集要 join ETL 叢集資料且不能干擾 ETL。Redshift data sharing 讓 BI 叢集當 consumer 直接讀同一份資料，運算由 consumer 負擔；直連 ETL 叢集或每週 UNLOAD 都吃 ETL 資源。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":25,"q":"一次性分析需 join DynamoDB、RDS、Redshift、S3 的資料，最具成本效益？","a":"C","t":[["C","Athena Federated Query 直接 join"]],"s":"8.1","o":165,"w":"一次性 join DynamoDB、RDS、Redshift、S3，不值得建叢集或搬資料。Athena Federated Query 靠 connector 一個 SQL 跨來源 join，serverless 按用量付費；開 EMR 叢集或先搬到 S3 都更花錢。","p":["dynamodb","lambda","athena"],"k":"athena","x":["rds","redshift","s3"],"d":""},{"n":26,"q":"長期運行的 EMR Spark 叢集，需高可靠、維持效能且最具成本效益，選哪兩項？（選2）","a":"BD","t":[["B","用 S3 作持久資料儲存"],["D","core/task 節點用 Graviton"]],"s":"6.3","o":118,"w":"長跑 Spark 要高可靠又省錢：資料放 S3 當持久儲存，叢集故障或重建資料都還在（B）；core 與 task 節點用 Graviton，維持效能且成本更低（D）。HDFS 綁叢集，primary 用 Spot 有中斷風險。","p":["emr","ec2","s3"],"k":"s3","x":[],"d":""},{"n":27,"q":"KDS 每秒數 GB 串流要進 Redshift，需近即時供現有 BI 工具使用，最低營運負擔？","a":"C","t":[["C","外部 schema 對應 KDS，MV 自動刷新"]],"s":"9.3","o":206,"w":"Redshift streaming ingestion 正對題：external schema 對應 Kinesis stream，materialized view 直接讀串流並 auto refresh，不經 S3 暫存，BI 即可近即時查；先落 S3 再 COPY 延遲高。","p":["kds","redshift","users"],"k":"redshift","x":[],"d":"⚠ 社群答案有分歧"},{"n":28,"q":"QS 儀表板變慢，主因是 Glue job 執行太久；資料存單一 S3 bucket 且每日新增，如何改善 Glue 效能？（選2）","a":"AB","t":[["A","S3 資料依年/月/日分區"],["B","提升 Glue worker type 規格"]],"s":"6.6","o":126,"w":"瓶頸是 Glue job 跑太久，資料每天堆在同一處。依年/月/日分區後 Glue 只處理相關日期，掃描量大減（A）；升級 worker type 給更多 CPU 與記憶體加速（B）。減少排程或改 IAM 無助效能。","p":["s3","glue","quicksight"],"k":"s3","x":[],"d":""},{"n":29,"q":"Step Functions 要平行處理大量資料檔，對每個檔案套用相同轉換，用哪種 state？","a":"C","t":[["C","Map state"]],"s":"7.3","o":140,"w":"對大量檔案逐一套用同一段轉換並平行處理，就是對清單迭代。Map state 對輸入陣列每一項各跑一次相同流程，可設定並行數；Parallel state 是同時跑不同分支，Choice、Wait 是判斷與等待。","p":["s3","sfn","lambda"],"k":"sfn","x":[],"d":""},{"n":30,"q":"舊系統資料遷入 S3 資料湖，含重複資料需識別並移除，最低營運負擔？","a":"B","t":[["B","Glue ETL 用 FindMatches ML 轉換"]],"s":"5.4","o":96,"w":"要識別並移除重複資料且維運最低。Glue ETL 內建 FindMatches ML transform，能自動比對相似或重複的紀錄，不必自寫去重規則；Pandas drop_duplicates 或 dedupe 程式庫都得自建並維護。","p":["src_db","glue","s3"],"k":"glue","x":[],"d":""},{"n":31,"q":"用 Redshift Spectrum 查詢 S3 資料湖，哪些做法查詢最快？（選2）","a":"BC","t":[["B","使用欄式儲存格式"],["C","依最常用查詢條件分區"]],"s":"9.4","o":211,"w":"Spectrum 速度取決於掃多少 S3 資料。欄式格式（如 Parquet）只讀用到的欄位（B）；依最常用的 WHERE 條件分區可跳過無關分區（C），兩者一起大減掃描量。小檔或不可分割格式反而更慢。","p":["s3","redshift"],"k":"s3","x":[],"d":""},{"n":32,"q":"預設設定的 Lambda 需私有連線到私有子網中的 RDS，不走公網，最低營運負擔？（選2）","a":"CD","t":[["C","Lambda 設在 DB 相同子網執行"],["D","兩者同 SG，自我參照規則開 DB 埠"]],"s":"13.2","o":310,"w":"預設 Lambda 不在 VPC 內，連不到私有子網的 RDS。讓 Lambda 跑在 DB 的同一 subnet（C）；兩者掛同一個 SG，以自我參照規則開放 DB port，免維護 IP（D）。public access 會走公網。","p":["lambda","vpc","rds"],"k":"vpc","x":[],"d":""},{"n":33,"q":"API Gateway 偶爾呼叫 Python 腳本並需回傳結果，最低營運負擔？","a":"B","t":[["B","Lambda Python 函式+佈建並行"]],"s":"7.7","o":161,"w":"API Gateway 偶爾呼叫並回傳結果，Lambda 是維運最低的 serverless 做法；provisioned concurrency 讓環境保持預熱，免冷啟動。ECS、EKS 要管叢集，EventBridge 定時假呼叫保溫是土法煉鋼。","p":["app","lambda"],"k":"lambda","x":[],"d":""},{"n":34,"q":"生產帳號 CW Logs 的安全日誌需經 KDS 送到安全帳號，如何設定？","a":"D","t":[["D","KDS 在安全帳號，訂閱篩選器在生產帳號"]],"s":"14.3","o":328,"w":"集中分析在安全帳號，Kinesis stream 就建在那裡，並以 IAM role 與 trust policy 允許 CloudWatch Logs 寫入；subscription filter 則要建在產生日誌的生產帳號，建在安全帳號是建錯邊。","p":["cloudwatch","kds","users"],"k":"cloudwatch","x":["iam"],"d":""},{"n":35,"q":"S3 交易型資料湖有小檔也有數十 TB 檔，來源每天送完整 JSON 快照，需做 CDC 擷取變更，最具成本效益？","a":"C","t":[["C","開源湖格式(Iceberg)做 MERGE"]],"s":"1.6","o":20,"w":"每天收到全量 JSON snapshot，CDC 就是比對後 upsert。Iceberg 等開源 table format 用 MERGE 直接插入新資料、更新舊資料，大檔也能處理；Lambda 撐不住數十 TB，繞 RDS 跑 DMS 更貴。","p":["src_file","table_fmt","s3"],"k":"table_fmt","x":[],"d":""},{"n":36,"q":"Athena 用 Glue Data Catalog，S3 分區過多造成查詢規劃瓶頸，如何縮短規劃時間？（選2）","a":"AC","t":[["A","建 Glue partition index+分區過濾"],["C","Athena partition projection"]],"s":"8.4","o":181,"w":"規劃慢在於要從 Catalog 撈大量分區 metadata。Glue partition index 搭 partition filtering 加快分區查找（A）；partition projection 依 S3 prefix 規則推算分區，免查 Catalog（C）。","p":["athena","catalog"],"k":"catalog","x":[],"d":""},{"n":37,"q":"即時串流需做最長 30 分鐘的時間視窗聚合分析，需高容錯，最低營運負擔？","a":"D","t":[["D","Flink 多種聚合做 30 分鐘時間視窗"]],"s":"3.5","o":60,"w":"30 分鐘視窗聚合是 stateful 串流處理，要保存狀態與 checkpoint 才能高容錯。Managed Flink 原生支援時間視窗聚合，容錯與擴展由 AWS 託管；Lambda 的 tumbling window 最多 15 分鐘。","p":["src_stream","flink"],"k":"flink","x":[],"d":""},{"n":38,"q":"EBS gp2 升級為 gp3，遷移中不可讓 EC2 中斷導致資料遺失，最低營運負擔？","a":"C","t":[["C","直接修改現有 volume 類型為 gp3"]],"s":"1.1","o":0,"w":"gp2 升 gp3 可直接修改現有 volume 的類型，同時設定 size、IOPS、throughput，屬於原地變更，EC2 不必停機也不用搬資料；snapshot 重建、逐步搬移或 DataSync 都多出切換步驟與風險。","p":["app","ec2"],"k":"ec2","x":[],"d":""},{"n":39,"q":"EC2 上 SQL Server 遷移至 RDS 期間，每日需匯出多表 JOIN 結果為 Parquet 存 S3。最具營運效率？","a":"A","t":[["A","View＋Glue job 直讀轉 Parquet"]],"s":"5.1","o":82,"w":"每天要把多表 JOIN 結果以 Parquet 存 S3 且最省維運：SQL Server 建 view 固化 join，Glue job 直接讀 view、轉 Parquet 寫 S3 並每日排程。自寫 Lambda 或 SQL Agent 較費工。","p":["src_db","glue","s3"],"k":"glue","x":[],"d":"⚠ 社群多選 C"},{"n":40,"q":"Redshift 要在查詢最佳化器偵測到可能造成效能問題的條件時記錄異常，應使用哪個系統表？","a":"B","t":[["B","STL_ALERT_EVENT_LOG"]],"s":"14.1","o":320,"w":"要在 query optimizer 偵測到可能影響效能的條件時記錄異常，正是 STL_ALERT_EVENT_LOG 的用途，還附建議解法。STL_QUERY_METRICS 記查詢指標，STL_PLAN_INFO 記執行計畫。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":41,"q":"15 欄 csv 匯入 S3 資料湖，分析師用 Athena 多只查 1~2 欄。最具成本效益？","a":"D","t":[["D","Glue ETL 存成 Parquet"]],"s":"8.2","o":171,"w":"Athena 依掃描量計費，分析師只查 15 欄中的 1～2 欄。Glue ETL 轉成欄式 Parquet 後只讀需要的欄位且有壓縮，掃描量大降最省；留 CSV 或轉 Avro（列式）都要掃整列。","p":["src_file","glue","s3","athena","users"],"k":"glue","x":[],"d":""},{"n":42,"q":"5 區域 HR 各有 IAM 角色，S3 資料湖員工記錄需限制只能看自己區域。最少營運負擔？（選2）","a":"BD","t":[["B","將 S3 路徑註冊為 Lake Formation 位置"],["D","啟用 LF 細粒度存取＋各區 data filter"]],"s":"12.1","o":261,"w":"各區 HR 只能看自己區域的記錄：B 把 S3 路徑註冊為 Lake Formation location；D 啟用細粒度存取控制，每個 Region 建 data filter 授權給對應 role。拆 bucket 或改 IAM 都較費工。","p":["s3","lf","users"],"k":"lf","x":["iam"],"d":""},{"n":43,"q":"Step Functions 手動建置，EMR 叢集在 VPC 內，狀態機無法執行 EMR job。如何找出原因？（選2）","a":"BD","t":[["B","查狀態機 IAM 權限(EMR/S3)"],["D","查 VPC Flow Logs 與 SG 連線"]],"s":"13.5","o":317,"w":"狀態機跑不動 EMR job，從權限與網路排查：B 檢查狀態機有沒有執行 EMR job 與存取 S3 的 IAM 權限；D 查 VPC flow logs 與 security group，確認 EMR 連得到資料來源。","p":["sfn","emr","vpc","s3"],"k":"iam","x":["iam"],"d":""},{"n":44,"q":"從 AMI 啟動新 EC2，應用資料需在執行個體終止後仍保留。哪個方案可行？","a":"C","t":[["C","instance store AMI＋另掛 EBS 存資料"]],"s":"1.1","o":1,"w":"instance store 是暫存，執行個體終止資料就消失；要保留資料應放在另掛的 EBS volume，非 root EBS 預設不隨終止刪除。root EBS 預設 DeleteOnTermination，會一起被刪。","p":["app","ec2"],"k":"ec2","x":[],"d":"⚠ 社群多選 B"},{"n":45,"q":"公司用 Athena CTAS 做 ETL，需改用 Apache Spark 產生分析。哪個方案可讓 Spark 存取 Athena？","a":"B","t":[["B","Athena workgroup"]],"s":"8.5","o":185,"w":"Athena 要跑 Apache Spark，得建立以 Spark 為引擎的 workgroup，notebook 與 session 都在 workgroup 內執行。query settings、data source、query editor 只跟 SQL 查詢有關。","p":["athena","catalog","s3"],"k":"athena","x":[],"d":""},{"n":46,"q":"S3 依 year/month/day 分區，新增分區時 Glue Data Catalog 需同步。延遲最低？","a":"C","t":[["C","寫 S3 的程式呼叫 create_partition"]],"s":"4.4","o":76,"w":"要新分區最快同步到 Glue Data Catalog：寫 S3 的程式寫完就呼叫 Boto3 create_partition，分區立即可查。排程 crawler、定時手動跑 API 或 MSCK REPAIR TABLE 都得等下一次執行。","p":["app","s3","catalog"],"k":"catalog","x":[],"d":""},{"n":47,"q":"從 SaaS 應用收集資料存入 S3，再用 Redshift 分析。最少營運負擔的服務？","a":"B","t":[["B","AppFlow"]],"s":"2.4","o":38,"w":"SaaS 資料要搬進 S3 給 Redshift 分析且維運最少：AppFlow 是全託管 SaaS 整合服務，內建連接器，設好來源與目的地就能傳輸。MSK、Kinesis 是串流服務，Data Catalog 只管 metadata。","p":["src_saas","appflow","s3","redshift"],"k":"appflow","x":[],"d":""},{"n":48,"q":"Athena 查詢 SELECT product_name,sum(sales_amount) … WHERE year=2023 GROUP BY 未回傳所有產品。如何修改？","a":"B","t":[["B","改 WHERE extract(year FROM …)=2023"]],"s":"8.6","o":189,"w":"WHERE year = 2023 沒篩對 2023 年資料，部分產品沒被計入；應從日期欄取出年份比對，改成 extract(year FROM …) = 2023。改 count(*)、加 HAVING 或去掉 GROUP BY 都沒修到篩選。","p":["s3","athena"],"k":"athena","x":[],"d":""},{"n":49,"q":"一次性任務：讀 S3 上 Parquet 物件，只查詢一欄。最少營運負擔？","a":"B","t":[["B","S3 Select 用 SQL 取該欄"]],"s":"8.7","o":196,"w":"一次性任務且只要一欄：S3 Select 直接對 S3 上的 Parquet 物件下 SQL SELECT 取出該欄，不用部署任何資源。Lambda＋pandas 要寫程式，DataBrew 或 crawler＋Athena 要先建設定。","p":["s3","users"],"k":"s3","x":[],"d":""},{"n":50,"q":"需自動排程重新整理 Redshift 具體化檢視（MV）。最省力？","a":"C","t":[["C","Query Editor v2 排程重新整理"]],"s":"9.7","o":223,"w":"要排程 refresh Redshift materialized view 且最省力：query editor v2 內建排程查詢，直接排定 REFRESH MATERIALIZED VIEW 即可。Airflow、Lambda UDF、Glue workflow 都要另建。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":51,"q":"編排 1 個 Lambda 與 1 個 Glue job 的管線，需整合 AWS 服務。最少管理負擔？","a":"A","t":[["A","Step Functions 先 Lambda 後 Glue"]],"s":"7.2","o":135,"w":"依序跑一個 Lambda 和一個 Glue job：Step Functions 是無伺服器編排，state machine 可先呼叫 Lambda 再跑 Glue job。Airflow 放 EC2/EKS 要自管，Glue workflow 不能跑 Lambda。","p":["sfn","lambda","glue"],"k":"sfn","x":[],"d":""},{"n":52,"q":"RDS、Redshift 與 S3 JSON/XML 需統一資料目錄，定期更新並偵測中繼資料變更。最少營運負擔？","a":"B","t":[["B","Glue Catalog＋Crawler 定期爬所有來源"]],"s":"4.1","o":67,"w":"要集中 RDS、Redshift、S3 JSON/XML 的 metadata 並定期偵測變更：Glue Data Catalog 當中央目錄，crawler 連多種來源推斷 schema 並排程更新。Aurora、DynamoDB＋Lambda 要自己寫。","p":["s3","crawler","catalog"],"k":"crawler","x":["rds","redshift"],"d":""},{"n":53,"q":"DynamoDB 預置容量，負載可預測：週一清晨暴增、週末很低。需尖峰效能穩定，最具成本效益？","a":"C","t":[["C","Auto Scaling 排程尖峰調高離峰調低"]],"s":"10.3","o":244,"w":"負載可預測：週一清晨暴增、週末很低。用 Application Auto Scaling 排程在尖峰調高、離峰調低 provisioned capacity，穩又省。一直開最大量太貴，on-demand 對可預測負載不划算。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":54,"q":"地端 Hadoop 遷移至 EMR，Hive metastore 目錄需遷到持久儲存，要求無伺服器。最具成本效益？","a":"B","t":[["B","EMR metastore＋Glue Catalog 外部"]],"s":"4.1","o":68,"w":"Hive metastore 要搬到持久且 serverless 的目錄：遷入 EMR 後以 Glue Data Catalog 當 external catalog，由 AWS 託管免管 DB。Aurora MySQL 要管 DB，EMR 本機 metastore 不持久。","p":["src_file","catalog","emr"],"k":"catalog","x":[],"d":""},{"n":55,"q":"Redshift 5 節點 KEY 分佈，其中 1 節點 CPU>90%、其他<15%。不增節點要平衡負載？","a":"B","t":[["B","distribution key 改基數最大欄"]],"s":"9.5","o":215,"w":"某節點 CPU 90%、其他不到 15%，是 distribution key 選錯造成 data skew。改用基數最大（值最分散）的欄位當 dist key，資料才會平均分到各節點。改 sort key、PK 或升級都解不了。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":56,"q":"S3 中 IoT JSON 資料結構會隨裝置升級改變，需建資料目錄供分析部門索引。最具成本效益？","a":"A","t":[["A","Glue Catalog＋Registry＋Glue 匯入"]],"s":"4.3","o":74,"w":"IoT JSON 結構會變，需管 schema 演進：Schema Registry 管版本、Data Catalog 供索引，再由 Glue workload 匯入 Redshift Serverless，全由 Glue 託管；改用 Lambda UDF 較繁瑣。","p":["s3","catalog","glue","redshift"],"k":"catalog","x":[],"d":""},{"n":57,"q":"需將 S3 bucket 的所有寫入記錄到同區域另一個 S3 bucket。最少營運工作？","a":"D","t":[["D","CloudTrail 資料事件 trail，只寫入"]],"s":"14.4","o":333,"w":"S3 物件的寫入屬於 CloudTrail data events，非 management events。建 data events trail、prefix 留空、只收 write-only，寫到 log bucket 即可。S3 事件＋Lambda 要自寫程式。","p":["s3","cloudtrail"],"k":"cloudtrail","x":[],"d":""},{"n":58,"q":"需建中央中繼資料庫供 EMR 與 Athena 查詢，並從 Hive 匯入中繼資料。最少開發工作？","a":"C","t":[["C","Glue Data Catalog"]],"s":"4.1","o":69,"w":"要給 EMR 與 Athena 共用、可匯入 Hive metadata 的中央目錄：Glue Data Catalog 相容 Hive metastore，Athena、EMR 都原生整合，開發最少。自建 Hive 或 RDS metastore 要自行維護。","p":["src_file","catalog","athena"],"k":"catalog","x":["emr"],"d":""},{"n":59,"q":"建資料湖，需對特定團隊提供列級與欄級權限，透過 Athena、Redshift Spectrum、EMR Hive 存取。最少營運負擔？","a":"D","t":[["D","S3＋Lake Formation 列/欄級權限"]],"s":"12.1","o":262,"w":"要列/欄級權限並給 Athena、Spectrum、EMR Hive 共用：Lake Formation 可集中授權 row/column 權限並整合三者，維運最少。S3 policy 做不到列欄級，自管 Ranger 維運重。","p":["s3","lf","athena","users"],"k":"lf","x":["redshift","emr"],"d":""},{"n":60,"q":"S3 中依日期分區的 csv 用 Athena 查詢，資料量增加需最佳化儲存以提升查詢效能？（選2）","a":"CE","t":[["C","S3 bucket 與 Athena 同區域"],["E","csv 預處理轉 Parquet"]],"s":"8.2","o":172,"w":"提升 Athena 效能：C 讓 S3 bucket 與 Athena 同一 Region，避免跨區延遲與傳輸成本；E 把 CSV 預先轉成欄式 Parquet，只讀需要的欄位與資料區塊，掃描量大降。轉 JSON 沒這效果。","p":["s3","athena"],"k":"s3","x":[],"d":""},{"n":61,"q":"RDS MySQL 以寫入為主、讀取少，CPU 使用率過高拖慢應用，需降低 CPU？（選2）","a":"AD","t":[["A","Performance Insights 找出並優化查詢"],["D","升級較大執行個體"]],"s":"10.5","o":250,"w":"寫入為主的 RDS MySQL CPU 過高：A 用 Performance Insights 找出最吃 CPU 的查詢並優化，從根源降負載；D 升級較大的執行個體，立即增加 CPU 餘裕。快取主要救讀取，對寫入幫助小。","p":["app","rds"],"k":"rds","x":[],"d":"⚠ 社群答案有分歧"},{"n":62,"q":"Redshift Orders 表每週更新刪除，用交錯排序鍵（Region 欄）。需回收磁碟空間並分析排序鍵欄？","a":"C","t":[["C","VACUUM REINDEX Orders"]],"s":"9.7","o":224,"w":"interleaved sort key 又常更新刪除，要回收空間並分析 sort key：VACUUM REINDEX 先分析交錯鍵值分佈再完整 VACUUM。FULL 不 reindex，DELETE ONLY 不排序，SORT ONLY 不回收空間。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":63,"q":"感測器資料需近即時擷取，持久儲存為巢狀 JSON，查詢延遲<10 毫秒。最少營運負擔？","a":"C","t":[["C","KDS 擷取＋存 DynamoDB 查詢"]],"s":"3.1","o":45,"w":"要近即時擷取、持久存巢狀 JSON、查詢低於 10 毫秒：Kinesis Data Streams 託管串流擷取，DynamoDB 能存巢狀 JSON 並提供個位數毫秒查詢。S3 查詢達不到毫秒級，自架 Kafka 維運重。","p":["src_stream","kds","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":64,"q":"S3 資料湖含 PII，多個使用者群組需存取原始資料但只能看所需 PII。最省力？","a":"A","t":[["A","Athena＋LF data filter 綁 IAM 角色"]],"s":"12.1","o":263,"w":"各群組只能看所需的 PII：用 Lake Formation data filter 設定列/欄範圍並綁到不同 IAM role，使用者指派到對應 role，用 Athena 查詢即受控。自建查詢介面或逐一寫 policy 較費工。","p":["s3","lf","athena","users"],"k":"lf","x":["iam"],"d":""},{"n":65,"q":"10 個來源每 15 分鐘送 csv/JSON/Parquet（10MB~20GB）到 S3，載入 Redshift 10 表，schema 變更仍需正常運作？（選2）","a":"BD","t":[["B","EventBridge 跑 workflow：爬→job"],["D","S3 到檔 Lambda 觸發 Glue workflow"]],"s":"7.1","o":130,"w":"schema 會變，先用 crawler 更新 Data Catalog 再跑 job 載入 Redshift，Glue workflow 串成「crawler 成功才跑 job」。B 用 EventBridge 每 15 分鐘、D 用 S3 到檔 Lambda 觸發。","p":["eventbridge","glue_wf","crawler","glue","redshift"],"k":"glue_wf","x":["lambda"],"d":"⚠ 社群答案有分歧"},{"n":66,"q":"Athena 查 PB 級資料供 BI，資料每天更新一次，BI 每小時刷新。不增基礎設施成本下省 Athena 費用，最少營運負擔？","a":"B","t":[["B","啟用 Athena 查詢結果重用"]],"s":"8.5","o":186,"w":"資料每天更新一次，BI 每小時重跑相同查詢：Athena query result reuse 直接回用先前結果、不重掃 S3，省錢又不加基礎設施。ElastiCache 要多養叢集，轉 Parquet 要改寫 PB 級資料。","p":["glue","s3","athena","quicksight"],"k":"athena","x":[],"d":""},{"n":67,"q":"Redshift 預算限制無法擴叢集，表皆用 EVEN 分佈，有數百 GB 大表與<10MB 小表。如何最佳化查詢？","a":"C","t":[["C","少更新小表改 ALL，設 PK/FK"]],"s":"9.5","o":216,"w":"不能擴叢集就調整分佈：很少更新的小表改用 ALL distribution，每個節點都有完整副本，與大表 join 時不必重分佈；再設 PK/FK 幫 optimizer 規劃 join。大表用 ALL 會浪費空間。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":68,"q":"csv 含 Door_No、Street_Name、City、Zip_Code 欄，需合併成單一 key-value 欄。最少程式碼？","a":"B","t":[["B","DataBrew NEST_TO_MAP"]],"s":"5.2","o":89,"w":"要把四個地址欄合成單一 key-value 欄且最少寫程式：DataBrew 的 NEST_TO_MAP 會把選定欄位轉成 map，欄名當 key、值當 value。NEST_TO_ARRAY 只留值的陣列，PIVOT 是轉置。","p":["s3","databrew"],"k":"databrew","x":[],"d":""},{"n":69,"q":"S3 通話紀錄含敏感資訊需加密，且金鑰只限特定員工存取。最省力？","a":"C","t":[["C","SSE-KMS＋IAM 限制 KMS 金鑰存取"]],"s":"12.5","o":285,"w":"要加密且金鑰只限特定員工：SSE-KMS 由 S3 搭配 KMS 加密，再用 IAM policy 限制誰能用該 KMS key，解密就被管住。SSE-S3 無法控管金鑰存取對象，CloudHSM、SSE-C 要自己管金鑰。","p":["s3","kms","users"],"k":"kms","x":["iam"],"d":""},{"n":70,"q":"PB 級資料在數千個 S3 Standard bucket，存取模式不可預測，部分數月不用但需毫秒取回。最少營運負擔省成本？","a":"D","t":[["D","Intelligent-Tiering 預設層級"]],"s":"1.2","o":3,"w":"存取模式不可預測又要毫秒取回：Intelligent-Tiering 預設層級依存取自動搬層，各層皆毫秒存取、免管規則。Deep Archive Access 取回要數小時，Storage Lens＋Lifecycle 要自己分析。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":71,"q":"Glue job 腳本中硬編碼 Redshift 憑證，需修補並安全儲存憑證？（選2）","a":"DE","t":[["D","憑證存 Secrets Manager"],["E","授權 Glue job IAM 角色讀取憑證"]],"s":"12.6","o":291,"w":"移除硬編碼的 Redshift 憑證：D 把憑證存進 Secrets Manager，可加密、輪替與稽核；E 授權 Glue job 的 IAM role 讀取該 secret 再取用。job parameters 或 S3 設定檔仍是明文。","p":["secrets","glue","redshift"],"k":"secrets","x":["iam"],"d":""},{"n":72,"q":"每月建 Redshift 預置叢集跑高負載分析，完成後卸載備份至 S3 並刪除。需免手動管理基礎設施，最少營運負擔？","a":"B","t":[["B","Redshift Serverless 自動處理"]],"s":"9.1","o":200,"w":"每月跑一次重量級分析卻要手動建、刪 provisioned cluster：改用 Redshift Serverless 自動配置與擴縮容量、依用量計費，免管基礎設施。暫停叢集、CLI、CloudFormation 仍要管叢集。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":73,"q":"每日 2GB .xls 客戶檔存 S3，串接姓與名後需算不重複客戶數。最少營運工作？","a":"D","t":[["D","DataBrew 用 COUNT_DISTINCT 配方"]],"s":"5.2","o":90,"w":"每日 2 GB .xls，串接姓名後算不重複客戶數：DataBrew 可直接讀 Excel，在 recipe 串接欄位再用 COUNT_DISTINCT 聚合，免寫程式免管叢集。Spark job 要寫程式，Athena 不支援 .xls。","p":["s3","databrew"],"k":"databrew","x":[],"d":""},{"n":74,"q":"KDS 串流醫療即時資料，需存入 Redshift Serverless，支援近即時分析串流與前一天資料。最少營運負擔？","a":"B","t":[["B","Redshift 串流擷取功能"]],"s":"9.3","o":207,"w":"KDS 資料要近即時進 Redshift Serverless：streaming ingestion 直接讀入 materialized view，免 Firehose 與 S3 中繼，可和前一天資料同查。COPY 是批次，zero-ETL 不接 Kinesis。","p":["src_stream","kds","redshift"],"k":"redshift","x":[],"d":""},{"n":75,"q":"QS 儀表板基於 Athena 查詢 S3 資料，連線時出現權限不足錯誤，可能原因？（選2）","a":"CD","t":[["C","QS 無權存取 S3 bucket"],["D","QS 無權解密 S3 資料"]],"s":"12.8","o":302,"w":"QuickSight 透過 Athena 查 S3，讀檔用的是 QuickSight 的權限：C 沒被授權存取 S3 bucket 就會權限不足；D 資料以 KMS 加密而 QuickSight 沒有 kms:Decrypt，也會報權限錯誤。","p":["quicksight","athena","s3"],"k":"iam","x":["iam","kms"],"d":""},{"n":76,"q":"S3 JSON/csv、RDS SQL Server、DynamoDB、Redshift，需讓資料科學家用類 SQL 語法查詢全部來源。最少營運負擔？","a":"A","t":[["A","Glue 爬取＋Athena，JSON 用 PartiQL"]],"s":"8.1","o":166,"w":"要用類 SQL 查 S3、RDS、DynamoDB、Redshift：Glue crawler 把 metadata 收進 Data Catalog，Athena 查詢時結構化用 SQL、JSON 用 PartiQL，維運最少。Spectrum 只查 S3。","p":["s3","crawler","catalog","athena","users"],"k":"athena","x":["rds","dynamodb","redshift"],"d":""},{"n":77,"q":"SageMaker Studio 使用 Glue 互動式工作階段準備ML資料時出現存取拒絕，應如何修正？","a":"B","t":[["B","加 sts:AssumeRole(Glue+SM 信任)"]],"s":"12.3","o":275,"w":"存取拒絕出在呼叫端：trust policy 只決定 role 信任誰，IAM user 本身也要有 sts:AssumeRole 權限，role 則要信任 Glue 與 SageMaker principal，兩邊缺一不可。只加 managed policy 不夠。","p":["users","ml","iam","glue"],"k":"iam","x":[],"d":""},{"n":78,"q":"每日約1TB，來源含SAP HANA、SQL Server、MongoDB、Kafka、DynamoDB，schema未定義或會變；須偵測schema並ETL至S3，15分鐘內載入，最少營運負擔？","a":"B","t":[["B","Glue 偵測 schema+Spark ETL"]],"s":"5.1","o":83,"w":"來源 schema 未定義或會變，要自動偵測再 ETL 到 S3。Glue crawler 可推斷 schema，ETL 本體是 serverless 的 managed Spark，免管叢集維運最低；EMR 要自管叢集，Lambda 跑 PySpark 不實際。","p":["src_db","crawler","glue","s3"],"k":"crawler","x":[],"d":""},{"n":79,"q":"S3資料集含PII，各應用程式需求不同，需依存取的應用動態遮蔽PII，最少營運負擔？","a":"B","t":[["B","S3 Object Lambda 讀取時動態遮蔽"]],"s":"12.7","o":295,"w":"同一份資料要依存取的應用動態遮蔽。S3 Object Lambda 在 GET 時呼叫 Lambda 即時 redact PII，不必為每個應用複製並同步多份 dataset，也不用自建 API Gateway 層，維運最省。","p":["app","s3","lambda"],"k":"s3","x":[],"d":""},{"n":80,"q":"每日處理使用者上傳至S3的.csv，每個物件<100MB，最具成本效益的ETL？","a":"D","t":[["D","Glue Python shell job+pandas"]],"s":"5.1","o":84,"w":"每個檔案小於 100 MB，用不到分散式 Spark。Glue Python shell job 以小容量跑 pandas，serverless 按用量計費最便宜；Glue PySpark、EMR、EKS 都要較大運算資源，成本不划算。","p":["s3","glue","s3"],"k":"glue","x":[],"d":""},{"n":81,"q":"Glue crawler 建的 Orders 表要新增2個 order_date 分割區，不可掃描整個表位置，Athena 該用哪個DDL？","a":"A","t":[["A","ALTER TABLE ADD PARTITION+LOCATION"]],"s":"4.4","o":77,"w":"要註冊新分區又不能掃描整個表位置。ALTER TABLE ADD PARTITION 搭配 LOCATION 直接把指定路徑寫進 Catalog，是純 metadata 操作；MSCK REPAIR TABLE 會掃描所有 S3 目錄，不符題意。","p":["s3","athena","catalog"],"k":"catalog","x":[],"d":""},{"n":82,"q":"S3有10~15TB未壓縮csv，用Athena查詢，要轉換以最佳化查詢時間與儲存成本，選哪種格式+壓縮？","a":"C","t":[["C","Parquet + Snappy"]],"s":"8.2","o":173,"w":"Athena 依掃描量計費，要兼顧查詢速度與儲存成本。Parquet 是欄式格式，只讀需要的欄位且壓縮率高，Snappy 解壓快適合查詢；CSV、JSON、Avro 都是列式格式，查詢仍要讀整列。","p":["s3","athena"],"k":"s3","x":[],"d":""},{"n":83,"q":"地端用 Airflow 編排管線並執行SQL資料品質檢查，要遷到AWS託管服務，最少重構？","a":"C","t":[["C","遷到 MWAA，用 SQL task 檢查品質"]],"s":"7.4","o":144,"w":"要遷到託管服務且最少重構。MWAA 就是託管的 Airflow，既有 DAG 與 SQL 資料品質檢查 task 幾乎可直接搬；改寫成 Step Functions 加 Lambda 要重做流程，自架 EC2 或 Outposts 也不算託管。","p":["src_file","mwaa","gdq"],"k":"mwaa","x":[],"d":""},{"n":84,"q":"EMR 做多來源ETL管線，需編排管線並最大化效能，最具成本效益的服務？","a":"C","t":[["C","Step Functions"]],"s":"7.2","o":136,"w":"要低成本編排 EMR 多步驟 ETL。Step Functions 是 serverless 狀態機，原生整合 EMR，支援平行、重試與分支，按用量計費；MWAA 要常駐 Airflow 環境，EventBridge 只負責觸發，不是完整編排。","p":["sfn","emr","s3"],"k":"sfn","x":[],"d":""},{"n":85,"q":"Athena 查S3上ALB存取日誌，表未分割，資料增加後查詢變慢，要提升效能且最少營運工作？","a":"B","t":[["B","Glue crawler+分類器寫分割區"]],"s":"4.2","o":71,"w":"表未分區，每次查詢都全掃。Glue crawler 加 classifier 自動辨識 ALB log schema，並把 partition 寫進 Data Catalog，讓 Athena 做 partition pruning；Glue job 或 Lambda 要自寫程式。","p":["s3","crawler","catalog","athena"],"k":"crawler","x":[],"d":""},{"n":86,"q":"S3 File Gateway 將地端檔案傳至S3，每次傳輸成功後要自動啟動 Glue workflow，最少營運負擔？","a":"B","t":[["B","EventBridge 接傳輸成功事件觸發"]],"s":"7.5","o":151,"w":"要在每次傳輸成功後自動觸發且元件最少。File Gateway 傳輸完成會發出事件，EventBridge rule 直接啟動 Glue workflow 即可；Lambda 方案多一個要維護的函式，依時間排程則無法保證檔案已到。","p":["src_file","datasync","eventbridge","glue_wf","glue"],"k":"eventbridge","x":[],"d":""},{"n":87,"q":"Aurora PostgreSQL 存即時交易，Redshift 僅留近15個月、舊資料歸檔，需合併查詢即時、目前與歷史資料並降成本？（選2）","a":"AC","t":[["A","Redshift Federated Query 查 PG"],["C","UNLOAD 舊資料到 S3+Spectrum"]],"s":"9.4","o":212,"w":"Federated Query 讓 Redshift 直接查 Aurora 的即時資料；超過 15 個月的舊資料 UNLOAD 到 S3 後刪除，用 Spectrum 查詢以降低叢集成本。Spectrum 查不了 PostgreSQL，Glacier 也讀不到。","p":["rds","redshift","s3","redshift"],"k":"redshift","x":[],"d":""},{"n":88,"q":"KDS 以設施ID當分割鍵，出現大量 WriteThroughputExceeded，部分分片過熱、其他閒置，如何解決？","a":"A","t":[["A","分割鍵改為隨機產生"]],"s":"3.3","o":52,"w":"facility ID 分布不均，同一 key 一律進同一 shard，造成熱 shard 而其他閒置。改用隨機產生的 partition key 能把寫入平均打散；只加 shard 不會改變 key 的分布，熱點依舊。","p":["src_stream","kds"],"k":"kds","x":[],"d":""},{"n":89,"q":"Athena 要看某SQL的執行計畫，並看每個運算的計算成本，該執行哪個陳述式？","a":"C","t":[["C","EXPLAIN ANALYZE SELECT * FROM sales"]],"s":"8.6","o":190,"w":"要看執行計畫，還要看每個運算的計算成本。EXPLAIN ANALYZE 會實際執行查詢，回傳各 stage 與 operator 的統計與成本；EXPLAIN 只給靜態計畫，少了 SELECT 的寫法則語法不成立。","p":["users","athena"],"k":"athena","x":[],"d":""},{"n":90,"q":"VPC flow logs 已送 CW Logs，需近即時傳送至 Splunk 分析，最少營運負擔？","a":"B","t":[["B","Firehose 目的地 Splunk+訂閱篩選"]],"s":"14.3","o":329,"w":"subscription filter 是 CloudWatch Logs 原生的串流出口，Firehose 可直接以 Splunk 為目的地，全託管近即時投遞。Kinesis Data Streams 不能直接送 Splunk，多寫 Lambda 轉送則增加維運。","p":["vpc","cloudwatch","firehose"],"k":"firehose","x":[],"d":""},{"n":91,"q":"S3資料湖+Glue Data Catalog，用Athena查詢，需依使用者角色做細粒度欄位層級存取控制？","a":"A","t":[["A","Lake Formation 依 IAM role 設規則"]],"s":"12.1","o":264,"w":"要依使用者角色對 Athena 做欄位層級控管。Lake Formation 是 data lake 權限中心，可依 IAM role 對 table、column 授權並與 Athena 整合；IAM 或 Glue policy 只能控到 table 層級。","p":["s3","catalog","lf","athena","users"],"k":"lf","x":["iam"],"d":""},{"n":92,"q":"Glue ETL 用 DynamicFrame 讀S3，每日批次載入RDS MySQL，要只處理每日增量，最少寫程式？","a":"B","t":[["B","啟用 job bookmarks 追蹤已處理"]],"s":"5.3","o":92,"w":"要只處理每日增量且最少寫程式。Glue job bookmarks 會在每次執行後記錄已處理的 S3 物件，下次只讀新檔，只要開啟設定；自己用 DynamoDB 記狀態要寫程式，刪除已處理物件則有風險。","p":["s3","glue","rds"],"k":"glue","x":[],"d":""},{"n":93,"q":"要收集 VPC flow logs 並分析網路流量，最具成本效益？","a":"D","t":[["D","送 S3 Parquet 格式+Athena"]],"s":"14.3","o":330,"w":"要收集並分析 flow logs 且最省錢。直接發佈到 S3 並選 Parquet 格式，儲存便宜，Athena 按掃描量計費、欄式格式掃得更少；送 CloudWatch Logs 擷取費較高，OpenSearch 叢集則是持續成本。","p":["vpc","s3","athena"],"k":"s3","x":[],"d":""},{"n":94,"q":"Redshift 4節點，三表皆EVEN分佈；門市表幾年才更新，查詢常被廣播到所有節點，最具成本效益減少廣播？","a":"A","t":[["A","門市表改為 ALL 分佈"]],"s":"9.5","o":217,"w":"門市表小又幾乎不更新，卻在每次 join 時被廣播到所有節點。改成 DISTSTYLE ALL 讓每個節點存一份完整副本，join 不必再搬資料，很少更新也代表複製成本可接受；升級節點則會加錢。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":95,"q":"Redshift Sales 表要找 city_name 以「San」或「El」開頭的列，哪個SQL正確？","a":"B","t":[["B","where city_name ~ '^(San|El)*'"]],"s":"9.8","o":228,"w":"要找以 San 或 El 開頭的 city_name。~ 是 POSIX 正則比對，^ 錨定字串開頭，(San|El) 表示兩個前綴擇一；$ 是錨定結尾，& 也不是正則的 OR，所以其他寫法都不對。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":96,"q":"DMS 持續複寫地端 PostgreSQL 至 Redshift，CDC 延遲高，懷疑來源DB造成，如何確認？","a":"D","t":[["D","CW 看 CDCLatencySource 指標"]],"s":"14.1","o":321,"w":"要確認 CDC 延遲是否來自來源資料庫。CDCLatencySource 量測來源端變更到 DMS 讀取之間的延遲，數值高就代表瓶頸在 source；CDCIncomingChanges 只是待套用的變更數，判斷不出延遲來源。","p":["src_db","dms","redshift"],"k":"cloudwatch","x":["cloudwatch"],"d":""},{"n":97,"q":"IoT 感測器每10秒送100KB，下游每30秒從S3讀取，哪個方案送達S3延遲最低？","a":"C","t":[["C","KDS+KCL 應用程式5秒緩衝"]],"s":"3.1","o":46,"w":"要以最低延遲把資料送到 S3。Firehose 有 buffer 緩衝，會多一段等待；用 KCL 自寫 consumer 從 Kinesis Data Streams 讀取，以 5 秒緩衝直接寫 S3 延遲最低，而 KDS 本身無法直接寫入 S3。","p":["src_stream","kds","s3"],"k":"kds","x":[],"d":""},{"n":98,"q":"S3資料湖：每日300GB多格式資料需排程轉換，另有數TB歸檔資料一次性轉換，用MWAA編排，最具成本效益？（選2）","a":"AD","t":[["A","每日資料用 Glue crawler 識別 schema"],["D","每日+歸檔皆用 EMR 轉換"]],"s":"6.1","o":115,"w":"每日資料格式多樣，用 Glue crawler 自動辨識並登錄 schema 最省事；轉換則每日 300 GB 與 TB 級歸檔都交給 EMR，大批次運算最划算。Athena 不負責辨識 schema，SageMaker 也不是 ETL 工具。","p":["mwaa","crawler","emr","s3"],"k":"emr","x":[],"d":""},{"n":99,"q":"Glue ETL 處理訂單資料，要實施特定驗證規則以確保準確性與一致性？","a":"B","t":[["B","自訂 Glue Data Quality 規則集"]],"s":"5.5","o":100,"w":"要套用自訂的驗證規則確保準確與一致。Glue Data Quality 自訂 ruleset 可用 DQDL 宣告具體檢核並在 ETL 中執行；內建 transform 只涵蓋標準檢查，bookmarks 與 Data Catalog 都不做資料驗證。","p":["glue","gdq"],"k":"gdq","x":[],"d":""},{"n":100,"q":"gzip 壓縮的交易資料，只偶爾稽核查詢，最具成本效益？","a":"A","t":[["A","Glacier Flexible+Glacier Select"]],"s":"8.7","o":197,"w":"資料已 gzip 壓縮且只供偶爾稽核，重點是長期儲存成本。Glacier Flexible Retrieval 儲存費遠低於 S3 Standard，需要時用 Glacier Select 直接查封存資料；S3 加 Athena 方便但長期較貴。","p":["s3","s3_tier","users"],"k":"s3_tier","x":[],"d":""},{"n":101,"q":"已測試的 Redshift 預存程序（非關鍵），要每日自動執行，最具成本效益？","a":"C","t":[["C","Query editor v2 排程執行"]],"s":"9.7","o":225,"w":"stored procedure 已在 Redshift 內，只需每日排程。Query editor v2 內建排程查詢，可直接定時 CALL 預存程序，不用額外養 Lambda、EC2 Spot 或 Glue job，元件最少也最省錢。","p":["users","redshift"],"k":"redshift","x":[],"d":"⚠ 社群多選 A"},{"n":102,"q":"點擊流經 Firehose 存S3，數百名跨部門使用者用QS儀表板，需可擴展、每日更新，最具成本效益？（選2）","a":"BE","t":[["B","Athena 查詢點擊流"],["E","QS SPICE+每日重新整理"]],"s":"11.1","o":251,"w":"資料已由 Firehose 落在 S3，Athena 可 serverless 直接查，不必另建 Redshift。SPICE 把結果載入記憶體供數百名使用者共用，設每日 refresh 即可，比 direct query 每次打 Athena 省又快。","p":["src_stream","firehose","s3","athena","quicksight","users"],"k":"quicksight","x":[],"d":""},{"n":103,"q":"混合架構（地端+雲端）資料編排，優先可攜性與開源，兩邊都用哪個服務？","a":"C","t":[["C","MWAA (Apache Airflow)"]],"s":"7.4","o":145,"w":"混合雲編排要兼顧可攜性與開源。Apache Airflow 是開源工具，地端自架 Airflow、雲端用 MWAA 託管，兩邊沿用同一套 DAG；Glue、SWF、Data Exchange 都是 AWS 專有服務，搬不回地端。","p":["src_file","mwaa"],"k":"mwaa","x":[],"d":""},{"n":104,"q":"NoSQL 客戶資料遷AWS，需全託管、高OLTP、個位數毫秒、全球高可用，最少營運負擔？","a":"C","t":[["C","DynamoDB"]],"s":"10.1","o":238,"w":"需求是全託管 NoSQL、高 OLTP、個位數毫秒延遲與全球高可用。DynamoDB 是 serverless NoSQL，讀寫為個位數毫秒，搭配 Global Tables 多區域複寫即可全球高可用；Timestream 是時序資料庫。","p":["src_db","dynamodb","app"],"k":"dynamodb","x":[],"d":""},{"n":105,"q":"EventBridge 事件呼叫 Lambda 時出現 AccessDeniedException，如何解決？","a":"B","t":[["B","EventBridge 角色+Lambda 資源政策授權"]],"s":"12.3","o":276,"w":"AccessDeniedException 是權限問題。EventBridge 的 IAM 權限與 Lambda 的 resource-based policy 都要允許 invoke；執行角色的 trust policy 是給 Lambda 自己用，subnet、schema 也無關。","p":["eventbridge","iam","lambda"],"k":"iam","x":[],"d":""},{"n":106,"q":"S3資料湖依法規須對上傳檔案套用兩層伺服器端加密，用 Lambda 套用，怎麼做？","a":"B","t":[["B","DSSE-KMS 雙層伺服器端加密"]],"s":"12.5","o":286,"w":"法規要求兩層伺服器端加密。DSSE-KMS 是 S3 內建的雙層伺服器端加密，Lambda 寫入時指定即可；SSE-KMS 與 SSE-C 都只有一層，S3 Encryption Client 屬於用戶端加密，不算伺服器端。","p":["lambda","kms","s3"],"k":"kms","x":[],"d":""},{"n":107,"q":"Athena 查詢執行前在佇列中等待，如何避免排隊？","a":"B","t":[["B","為 workgroup 設定佈建容量"]],"s":"8.5","o":187,"w":"排隊代表 on-demand 共享容量不足。替 workgroup 設定 provisioned capacity 可保留專屬 DPU，查詢不必等共享資源；調結果上限、federated query 或把使用者加入 workgroup 都不增加容量。","p":["users","athena"],"k":"athena","x":[],"d":""},{"n":108,"q":"Glue job 讀S3寫Redshift，已啟用 bookmark、最大並行度1，但舊檔每次都被重新處理，可能原因？","a":"D","t":[["D","缺少 job.commit() 陳述式"]],"s":"5.3","o":93,"w":"bookmark 已啟用、並行度 1 也正確，舊檔卻一直重跑，代表 bookmark 狀態沒被保存。Glue script 結尾必須呼叫 job.commit()，進度才會寫回；少了 commit，下次執行仍會重讀舊檔。","p":["s3","glue","redshift"],"k":"glue","x":[],"d":""},{"n":109,"q":"地端用第三方工具編排資料擷取，要遷AWS：免管伺服器、可編排Python與Bash、不可重構，最少營運負擔？","a":"B","t":[["B","MWAA"]],"s":"7.4","o":146,"w":"要免管伺服器、能編排 Python 與 Bash 腳本且不重構。MWAA 是託管 Airflow，用 PythonOperator、BashOperator 就能直接呼叫既有腳本；Step Functions、Lambda、Glue 都要改寫工作內容。","p":["src_file","mwaa"],"k":"mwaa","x":[],"d":""},{"n":110,"q":"地端 MySQL 頻繁更新，需近即時匯入 Redshift 整合分析，已有 Direct Connect，最少開發工作？","a":"B","t":[["B","DMS 全量載入+CDC 至 Redshift"]],"s":"2.2","o":29,"w":"要把頻繁更新的地端 MySQL 近即時同步到 Redshift。DMS full load 加 CDC 先搬全量、再持續擷取變更，只需設定不寫程式；Glue 排程不夠即時，AppFlow 要自建 connector，DataSync 只同步檔案。","p":["src_db","vpc","dms","redshift"],"k":"dms","x":[],"d":""},{"n":111,"q":"S3點擊流每日用SQL JOIN跨bucket查詢，需無伺服器、可依分割查詢、維持ACID，最具成本效益？","a":"C","t":[["C","Athena"]],"s":"8.7","o":198,"w":"要 serverless、依分區查 S3、跨 bucket JOIN 且維持 ACID。Athena 直接用 SQL JOIN 查 S3 分區資料，搭配 Iceberg 表提供 ACID；Spectrum 要有 Redshift，EMR 要管叢集，S3 Select 不能 JOIN。","p":["s3","table_fmt","athena","users"],"k":"athena","x":[],"d":""},{"n":112,"q":"Account_A eu-east-1 的 RDS PostgreSQL 遷至 Account_B eu-west-1 的 Redshift，DMS 複寫執行個體該建在哪？","a":"A","t":[["A","Account_B 的 eu-west-1"]],"s":"2.2","o":30,"w":"DMS 以 Redshift 為 target 時，replication instance 必須和 Redshift cluster 在同一個帳號與區域，也就是 Account_B 的 eu-west-1；來源端的 RDS 再透過跨帳號、跨區網路連線讀取。","p":["rds","dms","redshift"],"k":"dms","x":["vpc"],"d":""},{"n":113,"q":"Redshift 多節點叢集，每個來源位置各下一個COPY載入同一表，太慢；要加速且不增加成本？","a":"D","t":[["D","用 manifest 檔列位置，單一 COPY"]],"s":"9.2","o":203,"w":"每個位置各下一次 COPY，無法善用多節點平行。把所有檔案位置寫進 manifest file，用單一 COPY 載入，Redshift 會把檔案分給各 slice 平行處理，既加速又不需 EMR、Glue 等額外費用。","p":["s3","redshift"],"k":"redshift","x":[],"d":""},{"n":114,"q":"Firehose 將2MB .csv 存至S3，需轉成JSON並以Parquet格式儲存，最少開發工作？","a":"D","t":[["D","Lambda 轉 JSON，Firehose 轉 Parquet"]],"s":"3.4","o":56,"w":"Firehose 的 record format conversion 能輸出 Parquet，但輸入須為 JSON。所以由 Firehose 呼叫 Lambda 把 CSV 轉 JSON，再由 Firehose 轉 Parquet 寫入 S3，自寫的只有轉 JSON 這段。","p":["firehose","lambda","firehose","s3"],"k":"lambda","x":[],"d":""},{"n":115,"q":"公司用 Transfer Family 從地端遷移資料至 AWS，政策要求傳輸中加密須用 TLS 1.2 以上。哪個方案符合？","a":"C","t":[["C","改 Transfer 安全政策最低 TLS 1.2"]],"s":"13.4","o":315,"w":"政策要求傳輸中加密至少 TLS 1.2，Transfer Family server 的 security policy 正是控制 TLS 版本與 cipher suite 的設定，指定最低 TLS 1.2 即可強制落實；網路規則管不到協定版本。","p":["src_file","datasync"],"k":"kms","x":["kms"],"d":""},{"n":116,"q":"地端 Kafka 接收 Oracle 增量更新，要以 replatform（非 refactor）遷移至 AWS，管理負擔最低？","a":"D","t":[["D","MSK Serverless"]],"s":"3.6","o":64,"w":"要把既有 Kafka 以 replatform 搬上 AWS，須保留 Kafka 相容性；MSK Serverless 免管 broker、容量與擴縮，管理負擔最低。Provisioned MSK 仍要規劃容量，改用 Kinesis 則算 refactor。","p":["src_db","msk","app"],"k":"msk","x":[],"d":""},{"n":117,"q":"Glue ETL 匯入 S3 壓縮檔，管線須支援增量處理，該用哪個 Glue 功能？","a":"C","t":[["C","Job bookmarks"]],"s":"5.3","o":94,"w":"增量處理的關鍵是記住上次處理到哪裡；Glue job bookmarks 會追蹤已處理過的 S3 檔案，下次 job run 只處理新進檔案，不必自己寫狀態管理邏輯。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":118,"q":"銀行用 PutRecord 寫入 KDS，特定時段網路中斷，要整條管線 exactly-once 遞送，怎麼做？","a":"A","t":[["A","來源嵌入唯一 ID，處理時去重"]],"s":"3.3","o":53,"w":"網路中斷時 producer 重試 PutRecord 會重複送同一筆，Kinesis Data Streams 只保證 at-least-once。要整條 pipeline exactly-once，須在來源為每筆嵌入唯一 ID，由處理端依 ID 去重。","p":["src_stream","kds","app"],"k":"src_stream","x":[],"d":""},{"n":119,"q":"S3 日誌檔被誤刪，要防止未來誤刪，營運負擔最低？","a":"B","t":[["B","啟用 S3 Versioning"]],"s":"1.3","o":9,"w":"開啟 S3 Versioning 後，刪除物件只會加上 delete marker，舊版本仍保留，誤刪時移除 marker 或取回舊版即可復原。只需在 bucket 開一個設定，是營運負擔最低的防誤刪方案。","p":["app","s3"],"k":"s3","x":[],"d":""},{"n":120,"q":"每秒數千筆網路用量即時處理後存 Aurora，需偵測用量驟降以立即處置，延遲最低？","a":"B","t":[["B","改寫入 KDS，用 Flink 偵測驟降"]],"s":"3.5","o":61,"w":"每秒數千筆又要立即發現用量驟降，屬於串流即時分析：資料改送 Kinesis Data Streams，由 Managed Service for Apache Flink 持續偵測。定期查 Aurora 有 polling 延遲，不是最低延遲。","p":["src_stream","kds","flink"],"k":"flink","x":[],"d":""},{"n":121,"q":"S3 數 TB 原始資料要清理後載入 Redshift 供複雜查詢，免複雜 ETL 與管理基礎設施，營運負擔最低？","a":"B","t":[["B","DataBrew清理/Glue載入/Redshift查"]],"s":"5.1","o":85,"w":"需求是不寫複雜 ETL、不管基礎設施：Glue DataBrew 以視覺化 recipe 清理準備資料，再用 Glue 載入 Redshift，分析師直接在 Redshift 跑複雜 SQL。全是託管服務，營運負擔最低。","p":["s3","databrew","glue","redshift"],"k":"databrew","x":[],"d":""},{"n":122,"q":"VPC 內的 Lambda 可連 SFTP，但上傳 S3 逾時，需安全解決且最具成本效益？","a":"B","t":[["B","建 S3 gateway endpoint 並導流"]],"s":"13.1","o":308,"w":"Lambda 連得到 SFTP、上傳 S3 卻逾時，代表 VPC 沒有通往 S3 的路徑。建立 S3 gateway endpoint 並由 route table 導流，流量走 AWS 私網，且 gateway endpoint 免費，比 NAT 省。","p":["lambda","vpc","s3"],"k":"vpc","x":[],"d":""},{"n":123,"q":"多個 RDS 客戶資料庫欄位名稱不一致，需跨庫連結客戶記錄，營運負擔最低？","a":"B","t":[["B","Glue crawler+FindMatches 並調校"]],"s":"5.4","o":97,"w":"欄位名稱不一致（place_id 對 location_id），exact match 連不起客戶。先用 Glue crawler 編目各 RDS，再以 ML 的 FindMatches 找出同一客戶的記錄，並依評估結果調校準確度。","p":["rds","crawler","glue"],"k":"glue","x":["catalog"],"d":""},{"n":124,"q":"第三方資料存 S3，Glue crawler 卻建出多張表，要確保只建一張表？（選2）","a":"AD","t":[["A","格式、壓縮、schema 全部一致"],["D","S3 物件 prefix 結構一致"]],"s":"4.3","o":75,"w":"Glue crawler 依格式、壓縮、schema 與 S3 prefix 結構判斷是否同一資料集。物件格式、壓縮、schema 一致（A），且 prefix 結構一致（D），crawler 才會歸成同一張表而不拆成多張。","p":["src_saas","s3","crawler","catalog"],"k":"s3","x":[],"d":""},{"n":125,"q":"SQS 消費端偶爾停機，訊息 1 天後過期被刪造成資料遺失，如何降到最低？（選2）","a":"AC","t":[["A","延長訊息保留期間"],["C","掛載 DLQ 死信佇列"]],"s":"7.6","o":157,"w":"消費端停機超過 1 天 retention，訊息就被刪；延長 message retention period（最長 14 天）讓訊息撐過停機（A），再掛 DLQ 接住多次處理失敗的訊息，可事後重處理而不遺失（C）。","p":["app","sns_sqs"],"k":"sns_sqs","x":[],"d":""},{"n":126,"q":"MSK 資料經管線寫入 Keyspaces、OpenSearch 及 S3 Avro，要近即時時序儀表板，延遲最低？","a":"A","t":[["A","用 OpenSearch Dashboards"]],"s":"11.3","o":255,"w":"資料管線已寫入 OpenSearch Service，直接用 OpenSearch Dashboards 視覺化即可近即時看到時序資料。改從 S3 的 Avro 物件經 Athena 或 QuickSight 查詢，多一層處理，延遲較高。","p":["msk","opensearch"],"k":"opensearch","x":[],"d":""},{"n":127,"q":"數 PB 資料在 S3 Standard，存取模式不可預測、部分數月未用但須毫秒取回，要降成本且營運負擔最低？","a":"C","t":[["C","Intelligent-Tiering啟用Deep Archive"]],"s":"1.2","o":4,"w":"存取模式不可預測又橫跨數千個 bucket，用 S3 Intelligent-Tiering 依存取自動搬層最省事，免維護 lifecycle rule；再啟用 Deep Archive Access tier，讓數月未用的資料更省成本。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":"⚠ 社群多選 D"},{"n":128,"q":"KDS 每日數百萬事件，需轉換後寫入 OpenSearch，營運負擔最低？","a":"A","t":[["A","Firehose+Lambda 轉換後寫入"]],"s":"3.4","o":57,"w":"Firehose 是全託管投遞服務，能以 Kinesis Data Streams 為來源直接投遞到 OpenSearch Service，並內建 Lambda 轉換，不用維護 consumer 程式，比 KCL 或 Logstash 自建省力。","p":["kds","firehose","lambda","opensearch"],"k":"firehose","x":[],"d":""},{"n":129,"q":"Lake Formation 客戶表須禁止使用者存取加拿大客戶的資料列，營運最省力？","a":"A","t":[["A","列級篩選排除 country=Canada"]],"s":"12.1","o":265,"w":"需求是擋掉特定資料列（country 為 Canada），Lake Formation 原生支援 row-level filter，在表上設定排除條件即可，使用者查詢時自動看不到加拿大客戶，不必另建表或改 ETL。","p":["s3","lf","users"],"k":"lf","x":[],"d":""},{"n":130,"q":"Redshift 查詢編輯器要用第三方 IdP 登入，資料工程師第一步該做什麼？","a":"B","t":[["B","在 Redshift 內註冊 IdP"]],"s":"12.4","o":282,"w":"要讓使用者用第三方 IdP 登入 Redshift query editor，身分聯邦的第一步是在 Amazon Redshift 內註冊該 IdP，指定要信任的外部身分來源；Secrets Manager、ACM 管的是密碼與憑證。","p":["users","iam","redshift"],"k":"redshift","x":[],"d":""},{"n":131,"q":"EMR 每日 Spark ETL 擴到 5 個 task 節點，CPU 滿載但記憶體 <30%，要最具成本效益地降成本？","a":"C","t":[["C","task 節點改運算最佳化"]],"s":"6.3","o":119,"w":"CPU 常滿載、記憶體不到 30%，是 CPU-bound 工作負載。task node 改用 compute optimized instance，同樣費用拿到更多 CPU，最具成本效益；加節點更貴，換 memory optimized 則方向錯。","p":["emr","ec2"],"k":"ec2","x":[],"d":""},{"n":132,"q":"Glue job 將 S3 CSV 寫入 Redshift，重跑會產生重複記錄，需更新且不重複？","a":"A","t":[["A","先寫 staging 表，再 SQL 更新"]],"s":"9.8","o":229,"w":"直接寫目標表，Glue job 重跑就會再插一次同批資料。先載入 Redshift staging table，再用 SQL 依 key 更新既有列、插入新列（upsert），重跑也不重複；dropDuplicates() 只管當批。","p":["s3","glue","redshift"],"k":"redshift","x":[],"d":""},{"n":133,"q":"數百個檔案載入 Redshift 事實表，要最大吞吐量並最佳利用叢集資源？","a":"D","t":[["D","用單一 COPY 指令載入"]],"s":"9.2","o":204,"w":"Redshift 載入大量檔案的最佳實務是單一 COPY 指令，它會把多個檔案平行分配到各 node 與 slice 同時載入，充分利用叢集資源。拆成多個 COPY 或用 INSERT 都會增加 overhead。","p":["s3","redshift"],"k":"redshift","x":[],"d":""},{"n":134,"q":"Glue ETL 寫入 S3 資料湖供 Athena 查詢，需在無共同唯一 ID 下找出相符記錄？","a":"D","t":[["D","訓練並用 FindMatches 轉換"]],"s":"5.4","o":98,"w":"記錄間沒有共同 unique identifier，無法用 key join 比對；FindMatches 以機器學習做模糊比對，訓練後放進 ETL job 就能找出代表同一實體的記錄。Macie 只偵測敏感資料，幫不上忙。","p":["glue","s3","athena"],"k":"glue","x":[],"d":""},{"n":135,"q":"S3 混放 csv 與 json，crawler 已排除 json 但 Athena 仍掃到 json，不影響 csv 存取，查詢最快？","a":"C","t":[["C","把 json 移到 S3 其他路徑"]],"s":"4.6","o":81,"w":"crawler 的 exclude pattern 只影響 Data Catalog，Athena 仍會掃描 table LOCATION 下的所有檔案。把 .json 移到別的 S3 路徑，Athena 就只掃 .csv，查詢最快，也不影響 .csv 存取。","p":["s3","catalog","athena"],"k":"s3","x":[],"d":"⚠ crawler exclude 只影響 Catalog，不影響 Athena 掃描"},{"n":136,"q":"Lambda 執行角色已可存取 S3，讀取 KMS 加密物件仍失敗，可能原因？","a":"D","t":[["D","執行角色缺 KMS 金鑰解密權限"]],"s":"12.5","o":287,"w":"S3 權限已具備仍讀不到，差在物件用 KMS 加密：讀取 SSE-KMS 物件時，Lambda execution role 還需要對該 KMS key 的 kms:Decrypt 權限，且 key policy 也要允許，缺了就會失敗。","p":["lambda","s3","kms"],"k":"kms","x":["iam"],"d":""},{"n":137,"q":"1,000 張 Data Catalog 表的資料品質規則需修改，營運負擔最低？","a":"B","t":[["B","Lambda 呼叫 Glue Data Quality API"]],"s":"5.5","o":101,"w":"要改 1,000 張表的資料品質規則，逐一用 Console 改太耗人力；用 Lambda 呼叫 Glue Data Quality API 批次更新最輕量。只是改規則設定，不必動用 EMR 或另建 Glue ETL pipeline。","p":["lambda","gdq","catalog"],"k":"lambda","x":[],"d":""},{"n":138,"q":"Branch A 已部署上線，Branch B 下週要合併到 master，發 PR 前 Branch B 應執行？","a":"C","t":[["C","git rebase master"]],"s":"14.6","o":341,"w":"Branch A 已上線，master 已有新 commit；Branch B 發 PR 前先執行 git rebase master，把自己的 commit 重放到最新 master 之後，提前解決衝突，合併時 history 也保持線性。","p":["users","app"],"k":"app","x":[],"d":""},{"n":139,"q":"Redshift 表以 Region ID、Department ID、Role ID 為複合排序鍵，哪些查詢最能加速？（選2）（NA=North America）","a":"AB","t":[["A","WHERE Region ID='NA'"],["B","WHERE Region ID='NA' AND Dept ID=20"]],"s":"9.6","o":221,"w":"compound sort key 依欄位順序排序，篩選含最左前綴欄位才能有效跳過資料區塊。A 只篩第一欄 Region ID，B 篩 Region ID 加第二欄 Department ID，都符合前綴；略過首欄則幫助有限。","p":["users","redshift"],"k":"redshift","x":[],"d":"⚠ compound sort key 看最左前綴"},{"n":140,"q":"數百萬個 1KB JSON 檔經 Glue 轉 Parquet 載入 Redshift，處理時間增加，最能縮短時間？","a":"B","t":[["B","Glue dynamic frame 檔案分組讀取"]],"s":"6.4","o":120,"w":"數百萬個 1 KB 小檔，瓶頸在逐檔讀取與 task overhead。Glue DynamicFrame 的 file grouping 把小檔併成較大群組、交給較少 task 處理，大幅縮短時間，其餘流程不變。","p":["s3","glue","redshift"],"k":"glue","x":[],"d":""},{"n":141,"q":"MWAA 工作流程執行失敗，要用 Airflow 日誌診斷原因，該看哪種日誌？","a":"D","t":[["D","YourEnvironmentName-Task"]],"s":"14.5","o":337,"w":"workflow 失敗要看 task 實際的錯誤訊息與 stack trace，MWAA 把它們寫進 CloudWatch Logs 的 YourEnvironmentName-Task log group；WebServer、Scheduler 等記錄的是元件運作。","p":["mwaa","cloudwatch"],"k":"cloudwatch","x":[],"d":""},{"n":142,"q":"Redshift Spectrum 存取共用 S3 的第三方資料，法規要求資料不可從公司 AWS 環境外存取？（選2）","a":"AC","t":[["A","Redshift 移私有子網+介面端點+NAT"],["C","啟用增強 VPC 路由+Direct Connect"]],"s":"13.5","o":318,"w":"A 把 Redshift 移到 private subnet、以 interface VPC endpoint 連線，叢集不對外公開；C 開 enhanced VPC routing 讓 S3 流量走 VPC，供應商以 Direct Connect 私有連入，不經公網。","p":["users","vpc","redshift","s3"],"k":"vpc","x":[],"d":""},{"n":143,"q":"多來源檔案定期進 S3，需在新檔到達時近即時匯入 Redshift？","a":"D","t":[["D","S3 事件通知觸發 Lambda 載入"]],"s":"7.5","o":152,"w":"要在新檔一到就近即時載入，事件驅動比排程更快：S3 Event Notifications 在物件建立時觸發 Lambda，由 Lambda 對新檔執行 Redshift COPY，不必定時輪詢，也不用維護排程服務。","p":["src_file","s3","lambda","redshift"],"k":"s3","x":[],"d":""},{"n":144,"q":"KDS 即時收集日誌，要在 Redshift 即時查詢並加值，匯入的營運負擔最低？","a":"D","t":[["D","Redshift 串流擷取 KDS 成具體化檢視"]],"s":"9.3","o":208,"w":"Redshift streaming ingestion 直接從 Kinesis Data Streams 讀取並以 materialized view 呈現，資料一進來就能用 SQL 查詢與加值，省去 Firehose、S3 暫存與排程 COPY 等中介元件。","p":["src_stream","kds","redshift"],"k":"redshift","x":[],"d":""},{"n":145,"q":"地端 Oracle 資料倉儲表（<50GB、有單調遞增欄位）需每日增量同步到 S3 資料湖，最具作業效率？","a":"B","t":[["B","Glue JDBC+遞增欄位 job bookmark"]],"s":"5.3","o":95,"w":"每張表都有單調遞增欄位，正好當 Glue job bookmark 的追蹤欄位：以 Glue JDBC connection 連 Oracle，每天只抓新增資料 append 到 S3 全量副本，不必每天全量重載覆寫。","p":["src_db","glue","s3"],"k":"glue","x":[],"d":"⚠ 社群多選 A；社群爭議選項為 DMS CDC"},{"n":146,"q":"地端 Oracle 70 張表（皆有主鍵、偶有異動），每天匯入 S3 Parquet 資料湖，最省工？","a":"C","t":[["C","DMS 持續複寫至 S3（Parquet）"]],"s":"2.2","o":31,"w":"70 張表都有主鍵、資料還會偶爾更新；DMS ongoing replication 以 CDC 捕捉 Oracle 變更，直接寫到 S3 並輸出 Parquet，省去自寫增量與合併邏輯，比 Glue bookmark 或 Sqoop 省工。","p":["src_db","dms","s3"],"k":"dms","x":[],"d":""},{"n":147,"q":"每秒 1 萬筆 10 bytes 定位記錄寫入 KDS，可容忍數分鐘延遲，需可靠且最大化 shard 吞吐效率？","a":"B","t":[["B","Kinesis Producer Library (KPL)"]],"s":"3.2","o":50,"w":"每筆僅約 10 bytes，逐筆寫入浪費 shard 的 record 配額；KPL 以 aggregation 與 batching 把多筆小記錄打包成一筆 Kinesis record 並自動重試。容許數分鐘延遲，正好接受打包緩衝。","p":["src_stream","kds"],"k":"kds","x":[],"d":""},{"n":148,"q":"持續成長的半結構化資料需去重，含有拼寫錯誤的重複記錄，營運負擔最低？","a":"A","t":[["A","Glue FindMatches 移除重複"]],"s":"5.4","o":99,"w":"拼寫錯誤造成的重複記錄不完全相同，exact match 抓不到。Glue FindMatches 以機器學習辨識代表同一實體的記錄並移除重複，免自寫演算法，比 Athena UDF 或 EMR 自建 ML 省力。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":149,"q":"KPL 寫入、KCL 消費 KDS（自動擴縮），補貨系統收到重複資料，可能原因？（選2）","a":"AC","t":[["A","Producer 遇網路逾時"],["C","shard 或 record processor 數變動"]],"s":"3.3","o":54,"w":"Kinesis 只保證 at-least-once：producer 網路逾時無法確認寫入就重試，同一筆寫兩次（A）；shard 或 record processor 數量變動時，KCL 重派與 checkpoint 交接會重複處理記錄（C）。","p":["src_stream","kds","app"],"k":"kds","x":[],"d":""},{"n":150,"q":"多個 AWS 營運系統各有 JDBC 關聯式資料庫，需每小時追蹤全流程訂單，開發負擔最低？","a":"A","t":[["A","Glue 匯入 Redshift，QS 儀表板"]],"s":"11.1","o":252,"w":"各系統都是 JDBC 相容關聯式資料庫，Glue 可直接透過 JDBC 建 ingestion pipeline 匯入 Redshift，集中後以 QuickSight 儀表板每小時追蹤全流程訂單，全用託管服務串接，開發負擔最低。","p":["rds","glue","redshift","quicksight"],"k":"glue","x":[],"d":"⚠ 社群爭議選項為 DMS+DynamoDB"},{"n":151,"q":"用 Amazon Neptune 開發圖形應用程式，應使用哪些語言？（選2）","a":"AD","t":[["A","Gremlin"],["D","SPARQL"]],"s":"10.1","o":239,"w":"Amazon Neptune 支援兩種圖形模型與查詢語言：property graph 用 Apache TinkerPop Gremlin（A），RDF 用 W3C 的 SPARQL（D），開發 Neptune 圖形應用程式就用這兩種語言。","p":["app","neptune"],"k":"neptune","x":[],"d":""},{"n":152,"q":"遊戲 App 送 20KB 記錄，需裝置端最佳吞吐，3 個內部消費者各需專用吞吐量？","a":"A","t":[["A","PutRecords 送 KDS+增強型扇出"]],"s":"3.2","o":51,"w":"裝置端要最佳吞吐，就用 PutRecords 批次送多筆到 Kinesis Data Streams；三個內部 consumer 各需專用吞吐，enhanced fan-out 讓每個 consumer 在每個 shard 獨享 2 MB/s 讀取。","p":["src_stream","kds","app"],"k":"kds","x":[],"d":""},{"n":153,"q":"Redshift 實體化檢視要刪除所有列以回收儲存空間，哪個指令能回收最多空間？","a":"B","t":[["B","TRUNCATE mv"]],"s":"9.7","o":226,"w":"要清空整個 materialized view 並回收最多空間，TRUNCATE 會直接移除所有列並立即釋放儲存空間。DELETE 只把列標記為刪除，要再跑 VACUUM 才回收；VACUUM 本身也不會刪資料。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":154,"q":"Redshift Spectrum 查詢 S3 單一路徑 CSV（100+欄、每日30+檔）效能變差，最少開發工作量改善？（選2）","a":"AC","t":[["A","第三方程式改輸出欄式格式"],["C","S3 資料依訂單日期分區"]],"s":"9.4","o":213,"w":"查詢只選部分欄位，但 100+ 欄的 CSV 全放同一路徑，Spectrum 每次都掃全部資料。改用 Parquet 等欄式格式只讀需要的欄，再依 order date 分區做 partition pruning，掃描量大減。","p":["app","s3","redshift"],"k":"s3","x":[],"d":""},{"n":155,"q":"S3 客戶記錄建立後7年內不可刪改，連 root 也不行，用 S3 Object Lock 怎麼設？","a":"B","t":[["B","Compliance 模式，預設保留7年"]],"s":"1.4","o":14,"w":"7 年內連 root 都不能刪改，就要 Compliance mode：保留期內物件版本不能覆寫或刪除，誰都無法 bypass。Governance 可被特殊權限繞過；default retention 讓新物件自動套 7 年。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":156,"q":"在 Athena 建立與 old_table 相同結構的空資料表，該用哪個 SQL？","a":"D","t":[["D","CTAS SELECT * FROM old WITH NO DATA"]],"s":"8.6","o":191,"w":"要建立與 old_table 同 schema 的空表：CTAS 依 SELECT 結果建新表，加上 WITH NO DATA 就只建結構、不寫入資料。沒加 WITH NO DATA 會連資料一起複製，INSERT INTO 則要目標表已存在。","p":["users","athena","catalog"],"k":"athena","x":[],"d":""},{"n":157,"q":"從 Athena 表 cities_world 取出美國城市放入新表 cities_us，該用哪個 SQL？","a":"A","t":[["A","INSERT INTO usa(city,state) SELECT…"]],"s":"8.6","o":192,"w":"把 cities_world 中 country='usa' 的子集合寫進目標表，用 INSERT INTO … SELECT … WHERE，並列出 city、state 欄位對應查詢結果。MOVE 不是 SQL 語法，UPDATE 是改既有列而非插入。","p":["users","athena","s3"],"k":"athena","x":[],"d":""},{"n":158,"q":"資料網格由治理帳號 Lake Formation 集中授權；Redshift Serverless 表要分給行銷與合規團隊各看不同欄位？（選2）","a":"BD","t":[["B","建立 Redshift data share 含這些表"],["D","data share 分享至治理帳號 LF 目錄"]],"s":"12.2","o":271,"w":"先建 Redshift data share 打包這些 Serverless 表，再分享到治理帳號的 Lake Formation catalog 納入集中治理，就能用 LF 欄位層級權限，讓行銷與合規團隊各看不同欄位。","p":["redshift","lf","users"],"k":"lf","x":["catalog"],"d":""},{"n":159,"q":"Glue Studio ETL 管線每次執行都要依預設閾值檢查資料品質，最少實作工作量？","a":"B","t":[["B","加 Evaluate Data Quality + DQDL"]],"s":"5.5","o":102,"w":"要每次 ETL 都依閾值檢查資料品質，Glue Studio 內建 Evaluate Data Quality transform，用 DQDL 宣告規則與門檻即可。SQL transform、PyDeequ、Great Expectations 都得自寫規則邏輯。","p":["glue","gdq"],"k":"gdq","x":[],"d":""},{"n":160,"q":"EKS 微服務需收集叢集日誌與應用追蹤，並關聯找出故障點，最少開發工作量？（選2）","a":"AD","t":[["A","FluentBit收日誌+OpenTelemetry收追蹤"],["D","OpenSearch 關聯日誌與追蹤"]],"s":"14.5","o":338,"w":"Fluent Bit 是 EKS 常用的輕量 log 收集器，OpenTelemetry 是收集 traces 的開放標準；再由 OpenSearch 關聯 logs 與 traces 找出故障點。Kinesis、MSK 不是 trace 收集工具。","p":["app","opensearch"],"k":"opensearch","x":[],"d":""},{"n":161,"q":"DynamoDB 遊戲資料需近即時同步到 OpenSearch，哪個方案？","a":"C","t":[["C","DynamoDB Streams + Lambda 更新"]],"s":"10.4","o":246,"w":"要近即時同步 DynamoDB 變更到 OpenSearch：DynamoDB Streams 捕捉 item 層級的增刪改，Lambda 消費 stream records 後更新 OpenSearch 索引。Step Functions 定期匯出是批次，不夠即時。","p":["dynamodb","lambda","opensearch"],"k":"dynamodb","x":[],"d":""},{"n":162,"q":"Redshift 去正規化大表持續成長、沒有適合的分佈鍵，最低維護負擔用哪種分佈？","a":"C","t":[["C","AUTO 分佈"]],"s":"9.5","o":218,"w":"表持續成長又找不到合適的 distribution key，手動 KEY 容易資料傾斜、ALL 不適合大表，都要人工調整。AUTO distribution 讓 Redshift 依表大小自動選擇並切換分佈方式，維護負擔最低。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":163,"q":"QuickSight 匯率需算到小數4位，且須預先計算並實體化到 SPICE，計算欄位建在哪？","a":"A","t":[["A","在 dataset 建計算欄位"]],"s":"11.2","o":253,"w":"要預先計算並物化到 SPICE，calculated field 須建在 dataset 層，匯入 SPICE 時就一併算好，四位小數邏輯也能統一。analysis、visual、dashboard 層的欄位在顯示時才計算，不會物化。","p":["quicksight","users"],"k":"quicksight","x":[],"d":""},{"n":164,"q":"整合 Redshift、Teradata、BigQuery，用各來源引擎轉換後 join 寫入 S3 Iceberg，最少營運負擔？","a":"B","t":[["B","Athena 聯合查詢，SQL join+MERGE"]],"s":"8.1","o":167,"w":"要用各來源引擎轉換再 join 寫入 Iceberg，Athena federated query connectors 可直接查三個來源，一段 SQL 完成 join 與 MERGE，全 serverless；Glue、EMR 要維護 Spark 管線。","p":["src_db","athena","table_fmt","s3"],"k":"athena","x":["redshift"],"d":"⚠ 社群可能選 Glue"},{"n":165,"q":"EKS 容器需安全存取 DynamoDB，且不可在容器內嵌入 AWS 憑證？","a":"B","t":[["B","IAM 角色搭配 IRSA 服務帳戶"]],"s":"12.3","o":277,"w":"不嵌入憑證又要存取 DynamoDB，就用 IRSA：把 IAM role 關聯到 Kubernetes service account，Pod 自動取得臨時憑證。access key 放 S3、環境變數或 K8s Secrets 都還是長期憑證。","p":["app","iam","dynamodb"],"k":"iam","x":[],"d":""},{"n":166,"q":"地端資料生產者遷移到 AWS，不可走公網，且各管線服務帳號憑證需安全保管？","a":"B","t":[["B","Direct Connect+Secrets Manager"]],"s":"13.4","o":316,"w":"不走公網就用 Direct Connect 專線連地端；各管線的 service account 憑證放 Secrets Manager 集中保管與輪替。再加 presigned URL 與需求無關，public subnet 方案則仍走網際網路。","p":["src_db","vpc"],"k":"vpc","x":["secrets"],"d":""},{"n":167,"q":"S3 事件已送到 SQS，Glue Data Catalog 需增量更新，最少營運負擔？（選2）","a":"AB","t":[["A","S3 事件型 Glue crawler 讀 SQS"],["B","定時排程執行 crawler 增量更新"]],"s":"4.5","o":80,"w":"S3 事件已進 SQS，event-based Glue crawler 直接消費這些事件、只爬有變動的路徑；再設 time-based 排程定期執行，增量更新 Data Catalog。Lambda、Step Functions 都要自寫程式。","p":["s3","sns_sqs","crawler","catalog"],"k":"crawler","x":[],"d":"⚠ 社群答案有分歧"},{"n":168,"q":"每日報表有時在 S3 資料未齊時就執行，需把不完整資料通知既有 SNS，最少營運負擔？","a":"C","t":[["C","Glue DQ 檢查→EventBridge→SNS"]],"s":"5.6","o":108,"w":"Glue Data Quality 檢查每日資料集的 completeness 與 consistency，不完整時由 data quality action 發事件到 EventBridge 再轉既有 SNS。Airflow、EMR、Lambda 都要另建並維護。","p":["s3","gdq","eventbridge","sns_sqs"],"k":"gdq","x":[],"d":""},{"n":169,"q":"Redshift 含 PII，行銷、理賠、分析三團隊需看到不同遮罩程度的資料，最少管理負擔？","a":"C","t":[["C","每團隊建 DB 角色+套用遮罩政策"]],"s":"12.8","o":303,"w":"三個團隊對同份 PII 要不同遮罩程度，Redshift 可為各團隊建 database role 並附加各自的 masking policy，查詢時依角色回傳原值或遮罩值。分 cluster 或建大量 view 都要重複維護。","p":["redshift","users"],"k":"redshift","x":["iam"],"d":""},{"n":170,"q":"MSK 新增 topic 數天後，CW 對 RootDiskUsed 指標發出告警，該如何處理？","a":"A","t":[["A","擴充 broker 儲存並設自動擴展"]],"s":"3.6","o":65,"w":"新增 topic 後資料持續累積，RootDiskUsed 告警代表 broker 磁碟快滿。擴充 MSK broker storage 並開自動擴展即可解決並防止再發；ZooKeeper 不存 topic 資料，換大 instance 也不加磁碟。","p":["src_stream","msk"],"k":"msk","x":["cloudwatch"],"d":""},{"n":171,"q":"以 S3 與 RDS 建企業資料目錄，需含資料儲存格式中繼資料，最少工作量？","a":"B","t":[["B","Glue crawler+classifier 辨識格式"]],"s":"4.2","o":72,"w":"Glue crawler 能掃描 S3 與 RDS 建立 Data Catalog，classifier 自動辨識 CSV、JSON、Parquet 等格式寫入 metadata，工作量最少。人工 data steward 或自寫腳本費工，Macie 是找敏感資料。","p":["s3","crawler","catalog"],"k":"crawler","x":["rds"],"d":""},{"n":172,"q":"DataBrew 掃描 PII，但公司自訂的 PII 類別不在標準規則中，需跨多個資料集掃描，最低營運負擔？","a":"B","t":[["B","DataBrew 自訂 DQ 規則套用至各資料集"]],"s":"12.7","o":296,"w":"已用 DataBrew 偵測 PII，只差自訂類別不在標準規則內，建 DataBrew custom data quality rules 套用到多個 datasets 即可沿用原流程。人工檢查、自寫 Python 或 regex 都要額外維護。","p":["s3","databrew"],"k":"databrew","x":[],"d":""},{"n":173,"q":"Glue ETL 每日輸出 Daily.csv，新檔為空或必填欄缺值時須保留前一天檔案，最少工作量？","a":"B","t":[["B","Glue DQ 以 DQDL 檢查空檔與缺值"]],"s":"5.6","o":109,"w":"新檔完整有效才能覆蓋前一天的 Daily.csv：在 Glue ETL 加 Glue Data Quality，用 DQDL 檢查必填欄缺值與空檔，不過就不覆寫。Lambda 或 Glue Studio 補值會改動資料，不符需求。","p":["src_saas","glue","gdq","s3"],"k":"gdq","x":[],"d":""},{"n":174,"q":"要收集 S3 中未完成 multipart upload 與舊版本物件資訊以優化成本，最低營運工作量？","a":"C","t":[["C","S3 Storage Lens 儀表板"]],"s":"1.5","o":17,"w":"要看未完成 multipart upload 與舊版本物件以優化成本，S3 Storage Lens dashboard 直接跨 bucket 提供這些指標，開箱即用。CLI 要自寫指令逐桶查，S3 Inventory 要設報表再另外分析。","p":["s3","users"],"k":"s3","x":[],"d":""},{"n":175,"q":"KDS→Firehose 以 JSON 存 S3 供 Athena 查詢，要降低 Athena 成本且不重建管線，最少管理工作？","a":"A","t":[["A","Firehose改Parquet+分區，舊檔Glue轉"]],"s":"3.4","o":58,"w":"Athena 依掃描量計費：Firehose 輸出改 Parquet、加 YYYYMMDD prefix 分區、加大 buffer 減少小檔，不必重建管線；既有 JSON 用 Glue 合併轉 Parquet 再 ADD PARTITION。","p":["kds","firehose","s3","athena"],"k":"firehose","x":["glue"],"d":""},{"n":176,"q":"DynamoDB 表需自動刪除1個月前的資料以控管成本，且不影響讀寫，最低持續維護？","a":"A","t":[["A","啟用 DynamoDB TTL 依時間戳過期"]],"s":"10.4","o":247,"w":"要一個月後自動刪資料又不影響讀寫，DynamoDB TTL 依 item 的 timestamp 屬性讓資料到期，背景自動刪除且不耗寫入容量。EventBridge 或 Streams 觸發 Lambda 掃描刪除都要寫程式又耗容量。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":177,"q":"Hub 帳號的 S3 以 KMS 加密，BI 帳號的 QS 需跨帳號存取；桶政策已授權 QS 角色，還要做？（選2）","a":"BE","t":[["B","將 S3 桶加入 QS 角色可存取資源"],["E","將 KMS 金鑰加入 QS 角色可存取資源"]],"s":"12.8","o":304,"w":"bucket policy 放行後，BI 帳號的 QuickSight 端也要授權：把 S3 bucket 加入 QuickSight service role 可存取的資源；資料以 KMS 加密，KMS key 也要一併加入，QuickSight 才能解密讀取。","p":["s3","quicksight","users"],"k":"quicksight","x":["kms","iam"],"d":"⚠ 社群答案有分歧"},{"n":178,"q":"每日上傳≤5KB壓縮檔到 S3，需上傳即處理、自動編排、儀表板及可擴展臨時查詢，最具成本效益？","a":"D","t":[["D","Glue+S3事件+Lambda+Athena+QS"]],"s":"7.5","o":153,"w":"要上傳即處理又最省錢：S3 事件搭 Lambda 觸發編排，Glue 處理，Athena 做可擴展的臨時查詢與報表，QuickSight 做儀表板，全 serverless 按用量計費；EMR、OpenSearch 有常駐成本。","p":["s3","lambda","glue","athena","quicksight"],"k":"lambda","x":[],"d":""},{"n":179,"q":"多區域各有 EFS，資料須留在資料科學團隊區域，用 Step Functions+Lambda 處理成單一資料集，最少工作量？","a":"D","t":[["D","DataSync 傳至團隊區 EFS 再掛載"]],"s":"2.1","o":27,"w":"資料要留在團隊 Region，Lambda 又只能掛載同 Region 的單一 EFS，所以用 DataSync 把各 Region 檔案集中到團隊 Region 的 EFS，再由當地 Lambda 掛載處理。跨 Region 直接掛載不可行。","p":["ec2","datasync","ec2","lambda"],"k":"datasync","x":["sfn"],"d":""},{"n":180,"q":"EC2 應用需 SSL/TLS 加密傳輸，憑證要自動產生、輪替與續約部署，最低營運負擔？","a":"B","t":[["B","AWS Certificate Manager (ACM)"]],"s":"12.6","o":292,"w":"要自動產生、輪替並續約部署 SSL/TLS 憑證，ACM 是 AWS 原生憑證管理服務，可自動續期並部署到整合的 AWS 服務，營運負擔最低。EC2 上自管憑證或在 Secrets Manager 寫腳本都得自己輪替。","p":["kms","ec2"],"k":"kms","x":[],"d":""},{"n":181,"q":"S3 以 SSE-KMS 加密且含 PII，分析前須遮罩，預處理階段部分使用者可安全存取，要低維護？（選2）","a":"AD","t":[["A","Glue DataBrew ETL 遮罩 PII"],["D","以 IAM 管理權限控管 PII 存取"]],"s":"12.7","o":297,"w":"DataBrew 以低程式碼 ETL 在分析前遮罩 PII；IAM 控管誰能在預處理階段存取原始 PII，做到最小權限。SSE-KMS 只是靜態加密不等於遮罩，Macie、GuardDuty 只偵測不遮罩。","p":["s3","databrew","users"],"k":"databrew","x":["iam","kms"],"d":""},{"n":182,"q":"EMR 叢集需靜態與傳輸中加密；S3 資料以 KMS 加密，另有 S3 上的 PEM 憑證檔，怎麼做？","a":"C","t":[["C","單一組態 KMS 靜態+PEM，建立時指定"]],"s":"12.5","o":288,"w":"用一個 EMR security configuration 同時設 KMS key（S3 at-rest）與 PEM 路徑（in-transit），建立 cluster 時指定。一個 cluster 只能用一個 security configuration，也無法事後附加。","p":["s3","emr"],"k":"emr","x":["kms"],"d":""},{"n":183,"q":"Redshift 支援即時庫存，SageMaker 即時端點已部署模型，需即時庫存建議並預測未來需求？（選2）","a":"AB","t":[["A","Redshift ML 產生庫存建議"],["B","用 SQL 呼叫遠端 SageMaker 端點預測"]],"s":"11.4","o":257,"w":"資料已在 Redshift，Redshift ML 可用 SQL 建模產生庫存建議；既有 SageMaker 即時 endpoint 也能從 Redshift 以 SQL 遠端呼叫，預測未來需求。排程匯出離線訓練則不夠即時。","p":["redshift","ml","users"],"k":"ml","x":[],"d":""},{"n":184,"q":"S3 CSV 需改欄名、刪欄、略過第2列、依首列建新欄、依數值篩選，最少開發工作量？","a":"D","t":[["D","Glue DataBrew recipe 轉換"]],"s":"5.1","o":86,"w":"改欄名、刪欄、略過列、依首列建新欄、依數值篩選，都是 DataBrew recipe 內建的轉換步驟，點選即可、幾乎不寫程式。Glue Python job 要自己寫碼，crawler 只建 Catalog 不做轉換。","p":["s3","databrew","s3"],"k":"databrew","x":[],"d":""},{"n":185,"q":"Redshift 部分表的壓縮編碼不適合資料，需改善編碼，怎麼做？","a":"B","t":[["B","ANALYZE COMPRESSION 後手動改編碼"]],"s":"9.7","o":227,"w":"ANALYZE COMPRESSION 會抽樣資料，建議各欄最佳 encoding 與預估節省比例，再依結果手動改編碼。ANALYZE 只更新統計資料，VACUUM REINDEX/RECLUSTER 是重整排序，都不會建議 encoding。","p":["users","redshift"],"k":"redshift","x":[],"d":""},{"n":186,"q":"S3 大量記錄前30天須能立即存取，30天後少用，最具成本效益？","a":"A","t":[["A","生命週期30天後轉 Standard-IA"]],"s":"1.2","o":5,"w":"前 30 天要立即存取，留在 S3 Standard；之後少用但仍需毫秒級讀取，lifecycle policy 30 天後轉 Standard-IA 最划算。Deep Archive 取回要數小時；全放 IA 則前 30 天常讀會多付取回費。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":187,"q":"QuickSight 要顯示區域總營收，且不受視覺下鑽層級影響，用什麼？","a":"C","t":[["C","LAC-A 層級感知聚合函數"]],"s":"11.2","o":254,"w":"要讓 Region 總營收不受下鑽影響，LAC-A 可固定在 Region 維度聚合，結果不隨 visual 分組改變。table calculation 與一般 calculated field 都依 visual 當下分組計算，下鑽就會變。","p":["quicksight","users"],"k":"quicksight","x":[],"d":""},{"n":188,"q":"S3 部分客戶資料含 PII，提供給合作夥伴前需判斷是否含 PII，最少人工介入？","a":"A","t":[["A","Macie 自動敏感資料探索"]],"s":"12.7","o":298,"w":"要少人工判斷 S3 資料是否含 PII，Macie 的 automated sensitive data discovery 會自動抽樣掃描並分類敏感資料。CloudTrail 只記錄 API 看不到內容，Lambda、Athena 都要自寫偵測邏輯。","p":["s3","macie","users"],"k":"macie","x":[],"d":""},{"n":189,"q":"Athena 現有表有1,000列，要建立它的空白副本，用哪個查詢？","a":"B","t":[["B","CTAS SELECT * FROM old WITH NO DATA"]],"s":"8.6","o":193,"w":"要建立現有表的空副本，CTAS 依 SELECT * 建出相同 schema 的新表，加上 WITH NO DATA 就只建結構、不複製那 1,000 列。沒有 WITH NO DATA 或用 WHERE 1=1 都會把資料一起複製進去。","p":["users","athena","catalog"],"k":"athena","x":[],"d":""},{"n":190,"q":"S3 中依年分區、Glue 編目的 CloudTrail 日誌，Athena 查詢沒有資料，該做哪些排查？（選2）","a":"AC","t":[["A","確認 Athena 指向正確 S3 位置"],["C","執行 MSCK REPAIR TABLE"]],"s":"4.4","o":78,"w":"Athena 查分區表沒資料，原因多是 table LOCATION 沒指到正確 S3 路徑，或新的 year partition 未註冊進 Catalog。確認 S3 位置並跑 MSCK REPAIR TABLE 載入分區；timeout、重啟無關。","p":["cloudtrail","s3","catalog","athena"],"k":"catalog","x":[],"d":""},{"n":191,"q":"要協調 ETL：EMR 跑 Spark、呼叫 Salesforce API、載入 Redshift，需自動處理失敗與重試，且必須用 Python 撰寫編排。用哪個服務？","a":"A","t":[["A","MWAA（Managed Airflow）"]],"s":"7.4","o":147,"w":"需求是用 Python 編排 ETL（EMR Spark、Salesforce API、Redshift）並自動處理失敗重試。MWAA 是託管的 Airflow，以 Python DAG 定義任務相依，內建 retry 與失敗處理，免自管 Airflow 環境。","p":["mwaa","emr","redshift"],"k":"mwaa","x":[],"d":""},{"n":192,"q":"多個 Lambda 共用自訂 Python 腳本，每次修改都要手動更新所有函式。要減少手動更新，怎麼做？","a":"B","t":[["B","腳本打包成 Lambda Layer 套用"]],"s":"7.7","o":162,"w":"痛點是共用腳本複製在每支 Lambda 裡，改一次就要逐支更新。把腳本打包成 Lambda Layer 讓多支函式共同引用，改版時只需發布新版 layer 並更新引用，不必逐支修改函式程式碼。","p":["app","lambda"],"k":"lambda","x":[],"d":""},{"n":193,"q":"S3 客戶資料供多團隊分析，須確保團隊看不到 PII。最少營運負擔？","a":"B","t":[["B","S3 Object Lambda＋Comprehend 去 PII"]],"s":"12.7","o":299,"w":"要讓多團隊讀同一份 S3 資料又看不到 PII，且維運最少。S3 Object Lambda 在 GET 時動態改寫回應，搭配 Comprehend 偵測並移除 PII，不必另外複製、維護一份去識別化資料。","p":["s3","lambda","ml","users"],"k":"s3","x":[],"d":""},{"n":194,"q":"S3 以 IAM 角色控管存取，使用者違反存取政策時要通知，且通知須含違規者使用者名稱。怎麼做？","a":"C","t":[["C","CloudTrail 物件事件→CW 告警"]],"s":"14.4","o":334,"w":"通知要含違規者 username。CloudTrail S3 data events 記錄物件層級 API 呼叫與 userIdentity，轉送 CloudWatch 後以 metric filter／alarm 發通知；CloudWatch metrics 只有次數沒有身分。","p":["s3","cloudtrail","cloudwatch","
