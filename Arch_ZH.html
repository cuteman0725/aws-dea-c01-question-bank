sns_sqs"],"k":"cloudtrail","x":["iam"],"d":""},{"n":195,"q":"第三方客戶資料要載入 Redshift，其中一欄是 JSON 格式。最省力的載入方式？","a":"A","t":[["A","Redshift 表用 SUPER 型別存"]],"s":"9.8","o":230,"w":"來源有一欄是 JSON，要用最少工夫載入 Redshift。SUPER 型別可直接存放半結構化 JSON，載入後即可與訂單、產品資料一起查詢，不必先用 Glue 或 Lambda 攤平（flatten）再載入。","p":["src_saas","redshift"],"k":"redshift","x":[],"d":""},{"n":196,"q":"MySQL 每日 2GB 銷售紀錄要與 Salesforce 100GB 銷售機會關聯，每晚跑一次。最少營運負擔？","a":"C","t":[["C","AppFlow＋Glue 關聯，SFN 編排"]],"s":"2.4","o":39,"w":"兩個來源各用最省事的託管工具：AppFlow 免寫程式從 Salesforce 拉 opportunities，Glue 從 MySQL 擷取銷售紀錄並做 join 關聯，再由 Step Functions 串成每晚執行的流程。","p":["sfn","appflow","glue"],"k":"appflow","x":[],"d":""},{"n":197,"q":"S3 伺服器日誌保留 1 年，之後自動刪除。最少營運負擔？","a":"A","t":[["A","S3 生命週期規則 1 年後刪除"]],"s":"1.3","o":10,"w":"需求只是保留 1 年後自動刪除。S3 Lifecycle 的 expiration 規則依物件年齡自動刪除，是 S3 原生功能、設定一次即可；用 Lambda 或排程腳本自己掃描刪除，都多了要維運的程式。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":198,"q":"Step Functions 流程需依傳入資料內容執行不同步驟，應用哪種狀態類型？","a":"B","t":[["B","Choice"]],"s":"7.3","o":141,"w":"「依傳入資料內容執行不同步驟」就是條件分支。Choice state 依 input JSON 的欄位值比對規則，導向對應分支；Parallel 是同時跑多條分支、Map 是逐筆迭代、Task 只執行單一工作。","p":["sfn","lambda","dynamodb"],"k":"sfn","x":[],"d":""},{"n":199,"q":"Athena 查 cloudtrail_logs，要列出 2024 年起有錯誤碼的錯誤，回傳前 10 筆。哪個查詢正確？","a":"A","t":[["A","errorcode非null＋依次數DESC＋limit10"]],"s":"8.6","o":194,"w":"要找出錯的事件，所以要 errorcode IS NOT NULL，加上 2024 年起的 eventtime 條件，依 TotalEvents 排序後 limit 10。沒過濾 errorcode 會混入正常事件，沒有 ORDER BY 則 10 筆無排序依據。","p":["cloudtrail","s3","athena"],"k":"athena","x":[],"d":"⚠ 題意「最近10筆」與答案「出現最多Top10」不符"},{"n":200,"q":"S3 中訂單摘要部分含 PII，需偵測 PII 以便塗銷。最少營運負擔？","a":"C","t":[["C","Macie"]],"s":"12.7","o":300,"w":"目標是在 S3 物件中偵測 PII 以便後續塗銷。Macie 是託管的敏感資料探索服務，自動掃描 S3 並產出 PII findings；Textract 偏 OCR 抽字、Storage Lens 看用量指標，都不是做 PII 偵測。","p":["s3","macie"],"k":"macie","x":[],"d":""},{"n":201,"q":"Redshift 每天 100+ 使用者以多種 IAM 角色存取，要依職務、權限、資料敏感度控管物件存取。怎麼做？","a":"A","t":[["A","Redshift RBAC 角色存取控制"]],"s":"12.4","o":283,"w":"100 多位使用者要依職務、權限與資料敏感度控管物件存取。Redshift RBAC 把權限授予 database role，再把 role 指派給使用者或其他 role，集中管理大量使用者權限，不必逐一 GRANT。","p":["users","redshift"],"k":"redshift","x":["iam"],"d":""},{"n":202,"q":"S3 資料湖用 Glue Data Catalog，要把 Glue Data Quality 分數發布到 DataZone 入口。怎麼做？","a":"C","t":[["C","DQDL 規則集排程＋DZ 用 Glue 來源"]],"s":"12.2","o":272,"w":"先對 Glue table 建立 DQDL ruleset 並每日排程，產生資料品質分數；再於 DataZone 專案設定 Glue data source 並啟用 data quality configuration，分數才會發布到 DataZone portal。","p":["s3","catalog","gdq","lf","users"],"k":"lf","x":[],"d":""},{"n":203,"q":"Redshift 為合規需記錄並儲存所有使用者活動與連線活動。怎麼做？","a":"A","t":[["A","啟用 Redshift 稽核日誌存到 S3"]],"s":"14.4","o":335,"w":"法規要求記錄並保存所有使用者活動與連線活動。Redshift audit logging 會產生 connection log、user log 與 user activity log，在 logging 設定指定 S3 bucket 即可集中長期保存。","p":["redshift","s3"],"k":"redshift","x":[],"d":""},{"n":204,"q":"資料倉儲從 Teradata 遷移到 Redshift，最少營運工作量？","a":"B","t":[["B","SCT 轉 schema＋DMS 搬資料"]],"s":"2.3","o":35,"w":"Teradata 到 Redshift 是異質遷移，schema 與資料要分開處理：AWS SCT 把 Teradata schema 轉成 Redshift 格式，AWS DMS 負責搬移資料；手動匯出、套用 schema 則太費工。","p":["src_db","dms","redshift"],"k":"dms","x":[],"d":""},{"n":205,"q":"多來源資料集中到資料倉儲，QS 直接查詢需快速回應；每天僅數小時查詢且尖峰不可預測。最少營運負擔？","a":"A","t":[["A","Redshift Serverless 載入 RMS"]],"s":"9.1","o":201,"w":"查詢集中在每天幾小時且尖峰難預測，又要快速回應與低維運。Redshift Serverless 依負載自動擴縮、免管理容量，資料載入 RMS 成為中央倉儲，供 QuickSight direct query 查詢。","p":["src_saas","redshift","quicksight","users"],"k":"redshift","x":[],"d":""},{"n":206,"q":"KDS 因熱分片收到過多資料而被節流（throttling），如何解決？","a":"A","t":[["A","改用隨機 partition key 分散"]],"s":"3.3","o":55,"w":"Kinesis 依 partition key 的 hash 決定 record 落在哪個 shard，key 分布不均就會產生 hot shard 而被節流。改用隨機（高基數）partition key 讓資料平均分散到各 shard，直接消除熱點。","p":["src_stream","kds"],"k":"kds","x":[],"d":""},{"n":207,"q":"數十步驟管線（S3、Lambda、Step Functions），任一步失敗或成功都要即時告警，監控整條管線。怎麼做？","a":"D","t":[["D","EventBridge 監狀態變更→SNS"]],"s":"14.2","o":324,"w":"要即時知道每次執行成功或失敗並監控整條管線。Step Functions 執行狀態變更會發出 EventBridge 事件，用 rule 比對 SUCCEEDED、FAILED 等狀態轉送 SNS，比在每個 Lambda 自寫通知省維運。","p":["sfn","eventbridge","sns_sqs","users"],"k":"eventbridge","x":[],"d":""},{"n":208,"q":"API 用的 Lambda 在其他 Lambda 呼叫量增加時常被節流，要不受其他函式影響。最具成本效益？","a":"C","t":[["C","Lambda 設定保留並行"]],"s":"7.7","o":163,"w":"同帳號 Lambda 共用區域 concurrency，其他函式暴增會吃光額度讓 API 函式被節流。Reserved concurrency 為它保留固定額度且不另收費；provisioned concurrency 針對 cold start 且要付費。","p":["app","lambda"],"k":"lambda","x":[],"d":""},{"n":209,"q":"JSON 檔含 PII 與非 PII；非 PII 全公司可查，PII 僅限特定群組。最少營運負擔？","a":"C","t":[["C","Lake Formation 編目＋LF 權限控管"]],"s":"12.1","o":266,"w":"同一份 JSON 要讓所有人查非 PII、只有少數人能看 PII，且維運最少。檔案放 S3、在 Lake Formation 編目後，用 LF 的欄位層級權限依使用者類型授權，不必拆檔或複製資料。","p":["s3","lf","users"],"k":"lf","x":["catalog"],"d":""},{"n":210,"q":"以 KMS 加密的 Redshift 叢集，要用 CLI 設定跨區域快照做 DR。哪些步驟？（選2）","a":"BD","t":[["B","來源區啟用複製，指定目的區 grant"],["D","目的區建 KMS key＋copy grant"]],"s":"12.5","o":289,"w":"KMS 加密叢集的快照複製到他區時要用目的區的 key 加密：D 在目的區建立 KMS key 並設定 snapshot copy grant，B 再於來源區啟用 snapshot copy 並指定該 grant 名稱。","p":["redshift","kms"],"k":"kms","x":[],"d":"⚠ 社群多選 AC；官方 B+D，社群常見 A+C"},{"n":211,"q":"多個 RDS 與地端 SQL Server 要把既有資料與後續變更複製到 S3 資料湖（Parquet）。最具成本效益？","a":"C","t":[["C","DMS 搬既有資料＋持續變更"]],"s":"2.2","o":32,"w":"要同時搬既有資料與後續變更，來源含多個 RDS 及地端 SQL Server。DMS 以 full load＋CDC 一次處理兩者、支援異質來源，S3 target 可直接輸出 Parquet，比自建多個 Glue job 更省。","p":["src_db","dms","s3"],"k":"dms","x":[],"d":""},{"n":212,"q":"訂單每日進 S3，每週依訂單日期多個區間查詢指標，資料量增加時效能不可下降。最具成本效益？","a":"A","t":[["A","依訂單日期分區＋Athena"]],"s":"8.3","o":176,"w":"查詢固定依訂單日期範圍篩選，且資料量持續成長。依 order date 分區後，Athena 透過 partition pruning 只掃描命中的日期分區，掃描量不隨總量膨脹，按掃描量計費也最省。","p":["s3","athena"],"k":"s3","x":[],"d":""},{"n":213,"q":"Glue DQ 要判斷 primary 的 city、state 值組是否完全存在於 reference 資料集。哪條 DQDL 規則？","a":"B","t":[["B","ReferentialIntegrity ... = 1.0"]],"s":"5.5","o":103,"w":"要確認 primary 的 city、state 值組合都能在 reference 找到完全相符的值。DQDL 的 ReferentialIntegrity 正是檢查欄位值是否存在於參照資料集，設 = 1.0 代表 100% 的列都要相符。","p":["catalog","gdq"],"k":"gdq","x":[],"d":""},{"n":214,"q":"地端 PostgreSQL 持續更新，已有 VPN，要遷到 Redshift 且資料要盡快同步。怎麼做？","a":"B","t":[["B","DMS 全量＋CDC，目標 Redshift"]],"s":"2.2","o":33,"w":"來源 PostgreSQL 持續更新，Redshift 要盡快同步。DMS full-load task 先搬既有資料，再啟用 CDC 持續擷取變更並套用到 Redshift target，透過既有 VPN 連線，比每日 dump 批次更即時。","p":["src_db","vpc","dms","redshift"],"k":"dms","x":[],"d":""},{"n":215,"q":"新的 CSV、JSON 資料集要讓分析師用 SQL 查詢。最具成本效益？","a":"C","t":[["C","S3＋Glue 爬蟲＋Athena 工作群組限額"]],"s":"8.1","o":168,"w":"CSV、JSON 檔要給分析師用 SQL 查且成本最低。放 S3 後用 Glue crawler 自動推斷 schema 建表，Athena 依掃描量計費，再以 workgroup 的 data usage threshold 控管查詢用量與成本。","p":["s3","crawler","catalog","athena","users"],"k":"athena","x":[],"d":""},{"n":216,"q":"Aurora Orders 表數十億列、每秒 10 萬交易，要低延遲與 Redshift Campaigns 聯結，不得影響 Aurora。最少工作量？","a":"B","t":[["B","Aurora zero-ETL＋具體化檢視"]],"s":"2.5","o":42,"w":"要低延遲報表並與 Redshift 的 Campaigns 聯結，且不能影響 Aurora。zero-ETL integration 近即時把 Orders 複製到 Redshift，join 都在 Redshift 跑；federated query 會直接壓到 Aurora。","p":["rds","redshift"],"k":"rds","x":[],"d":""},{"n":217,"q":"CSV（≤5MB）上傳 S3，已有 Lambda 負責 COPY 進 Redshift。還需哪個步驟串起管線？","a":"B","t":[["B","S3 事件通知→SQS→Lambda 處理"]],"s":"7.6","o":158,"w":"缺的是「新檔進 S3 時自動觸發 Lambda」這一段。S3 event notification 送進 SQS 佇列做緩衝，Lambda 輪詢佇列執行 COPY，失敗訊息可重試、不會遺失事件；檔案小於 5 MB，Lambda 足以處理。","p":["s3","sns_sqs","lambda","redshift"],"k":"s3","x":[],"d":""},{"n":218,"q":"Redshift 敏感欄位：客服只看末 4 碼、稽核看全部、其他人不可看，且不可複製資料。怎麼做？","a":"A","t":[["A","動態資料遮罩政策套到該欄"]],"s":"12.8","o":305,"w":"同一欄位要依角色顯示不同內容且不能複製資料：客服看末 4 碼、稽核看全文、其他人看不到。Redshift dynamic data masking policy 掛在敏感欄位，查詢時依角色動態回傳完整值、遮罩值或 null。","p":["redshift","users"],"k":"redshift","x":["iam"],"d":""},{"n":219,"q":"用 Lake Formation 控管 S3，Glue 爬蟲報錯「S3 location is not registered」。如何解決？","a":"B","t":[["B","在 Lake Formation 註冊該 S3 位置"]],"s":"12.1","o":267,"w":"錯誤訊息直接指出該 S3 位置未在 Lake Formation 註冊，問題不在 IAM。LF 必須先 register 該 S3 location 才能控管其存取，註冊並授權 crawler 的 role 後，crawler 就能掃描資料。","p":["s3","lf","crawler","catalog"],"k":"lf","x":["iam"],"d":""},{"n":220,"q":"已有資料湖與倉儲，要建資料目錄，每項資產能加業務中繼資料與詞彙表。最少營運負擔？","a":"C","t":[["C","DataZone 詞彙表＋中繼資料表單"]],"s":"12.2","o":273,"w":"要為每項資產加上業務中繼資料與詞彙表，且維運最少。DataZone 原生提供 business glossary 與 metadata forms，用 data portal 瀏覽；其他選項都得自建表格或索引來模擬。","p":["s3","lf","users"],"k":"lf","x":[],"d":""},{"n":221,"q":"MERGE INTO accounts t USING monthly_accounts_update s ON 同客戶 WHEN MATCHED THEN DELETE，結果？","a":"A","t":[["A","兩表都有的客戶從 accounts 刪除"]],"s":"9.8","o":231,"w":"MERGE INTO 的 target 是 accounts，以 customer 比對 source monthly_accounts_update；WHEN MATCHED THEN DELETE 會刪掉 accounts 中比對得到的列，即兩表都有的客戶，source 表不受影響。","p":["glue","table_fmt"],"k":"table_fmt","x":[],"d":"⚠ 社群多選 D"},{"n":222,"q":"CSV（100–300KB）每 40–60 分鐘進 S3，每檔內容要載入 Redshift。最少營運負擔？","a":"A","t":[["A","S3 上傳觸發 EB→Lambda 跑 COPY"]],"s":"7.5","o":154,"w":"檔案小（100–300 KB）且約每小時才一個，不值得用常駐服務。S3 上傳事件經 EventBridge 觸發 Lambda 執行 Redshift COPY，COPY 是從 S3 載入 Redshift 的標準方式，全程 serverless。","p":["s3","eventbridge","lambda","redshift"],"k":"lambda","x":[],"d":""},{"n":223,"q":"S3 維度表有 1000 萬筆、1TB，每天最多更新 1 萬筆變更。執行時間最短？","a":"D","t":[["D","EMR＋Apache Hudi 只讀變更 upsert"]],"s":"1.6","o":21,"w":"1 TB 歷史資料每天只改最多 1 萬筆，關鍵是增量更新而非整份重寫。Apache Hudi 在 S3 上支援 record-level upsert，EMR Spark 只讀當日變更再更新 base table，執行時間最短。","p":["emr","table_fmt","s3"],"k":"table_fmt","x":[],"d":""},{"n":224,"q":"Glue Spark 作業出現「No space left on device」，要找出原因並解決。最具成本效益？（選2）","a":"BD","t":[["B","Spark UI＋Glue 指標看資料偏斜"],["D","shuffle 寫 S3 參數＋salting"]],"s":"6.5","o":122,"w":"B 找原因：用 Spark UI 與 Glue metrics 看各 executor 的 shuffle 量，確認是資料偏斜塞爆本機磁碟。D 給解法：--write-shuffle-files-to-s3 把 shuffle 檔寫到 S3，salting 打散熱 key。","p":["glue","s3"],"k":"glue","x":["cloudwatch"],"d":""},{"n":225,"q":"RDS 與 Glue 在同私有子網、同安全群組；SG 被改成只剩特定 IP 的 SSH 入站，Glue 連不上 RDS。如何修？","a":"A","t":[["A","入站全 TCP 埠，來源為本 SG"]],"s":"13.2","o":311,"w":"Glue 與 RDS 用同一個 security group，SG 只剩單一 IP 的 SSH，成員間無法互連。加一條來源為 SG 自己、開放所有 TCP 埠的 inbound 規則（self-referencing），正是 Glue 連線所需設定。","p":["glue","vpc","rds"],"k":"vpc","x":[],"d":""},{"n":226,"q":"BI 報表缺資料，要在存入前檢查欄位空值與參照完整性。最少營運負擔？","a":"B","t":[["B","Glue DQ 轉換＋IsComplete＋RefInteg"]],"s":"5.5","o":104,"w":"要在寫入 storage 前檢查空值與參照完整性。Glue ETL 內建 Data Quality evaluation transform：IsComplete 檢查欄位無 null，ReferentialIntegrity 檢查每個 join 的參照值都存在，維運最少。","p":["glue","gdq","s3"],"k":"gdq","x":[],"d":""},{"n":227,"q":"管線從 S3 擷取、做品質檢查與轉換，結果存關聯式資料庫供日後查詢。最具成本效益？","a":"A","t":[["A","Glue ETL＋Glue DQ，全載入 RDS"]],"s":"5.5","o":105,"w":"擷取、品質檢查、轉換到載入全在 Glue 一條 pipeline 完成：Glue ETL 讀 S3 並轉換，Glue Data Quality 套用 suggested rules，再把資料與檢查結果載入 RDS for MySQL，不必多疊 DataBrew。","p":["s3","glue","gdq","rds"],"k":"gdq","x":[],"d":""},{"n":228,"q":"Redshift 中某供應商資料，需每週轉存到供應商的 S3 桶。怎麼做？","a":"B","t":[["B","Glue 排程用 UNLOAD 寫到 S3"]],"s":"9.2","o":205,"w":"要把 Redshift 的供應商資料每週匯出到對方 S3 bucket。UNLOAD 是把查詢結果匯出到 S3 的標準指令，交給排程 Glue job 執行；COPY 是載入方向，data sharing、Spectrum 也不會寫出檔案。","p":["glue","redshift","s3"],"k":"redshift","x":[],"d":""},{"n":229,"q":"Redshift 由兩部門共用，各部門僅能存取自己的表與檢視，且常在單一查詢中跨部門使用物件。最少營運負擔？","a":"A","t":[["A","各部門獨立 schema，schema 層級授權"]],"s":"12.4","o":284,"w":"部門權限要隔離又常跨部門查詢：各部門 tables/views 放進專屬 schema，用 schema 層級 GRANT 一次管好，同 cluster 仍能跨 schema join。拆多個 database 或逐表授權都更麻煩。","p":["redshift","users"],"k":"redshift","x":["iam"],"d":""},{"n":230,"q":"將 MSK 串流資料匯入 Redshift，需低資料存取延遲並最佳化儲存成本。最少營運負擔？","a":"A","t":[["A","外部 schema 對應 MSK+物化檢視"]],"s":"9.3","o":209,"w":"Redshift streaming ingestion 直接讀 MSK：external schema 對應 MSK，materialized view 消費 topic，資料直進 Redshift、延遲低，免經 Firehose 或 S3 中繼的維運與儲存成本。","p":["msk","redshift"],"k":"redshift","x":[],"d":"⚠ 社群答案有分歧"},{"n":231,"q":"Glue 處理 44,000 個 200–300KB 小檔（最小 worker）效能很差。最具成本效益的改善？","a":"C","t":[["C","使用 DynamicFrame grouping"]],"s":"6.4","o":121,"w":"44,000 個 200–300 KB 小檔是典型 small files 問題，慢在大量 task 與開檔 overhead，不是運算力。DynamicFrame grouping 把小檔合成一組讀、減少 task 數，不必加大 worker，最省錢。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":232,"q":"整合多個 SaaS 應用程式資料供 QS 分析與建儀表板，最具營運效率？","a":"C","t":[["C","AppFlow 排程抽到 S3+Glue+QS"]],"s":"2.4","o":40,"w":"AppFlow 是免寫程式的 SaaS 整合服務：每個 app 建排程 flow 寫入 S3，Glue 建 catalog，QuickSight 建 data source 與 dataset 就能分析。比自寫 Lambda 呼叫 SaaS API 省維運。","p":["src_saas","appflow","s3","catalog","quicksight"],"k":"appflow","x":[],"d":""},{"n":233,"q":"多個應用程式輸出日誌，需近即時查詢並視覺化日誌？","a":"B","t":[["B","CW Logs 訂閱篩選串流至 OpenSearch"]],"s":"14.3","o":331,"w":"各 app 把 log 寫進 CloudWatch Logs，以 subscription filter 近即時串流到 OpenSearch Service，再於 OpenSearch 建查詢與 dashboard 視覺化。先匯出 S3 再用 Athena 查不夠即時。","p":["src_stream","cloudwatch","opensearch"],"k":"cloudwatch","x":[],"d":""},{"n":234,"q":"Glue 每日將百萬筆訂單以 CSV 存 S3 Standard 並每日分析，要最佳化儲存與檢索成本？","a":"C","t":[["C","Glue ETL 轉為 Parquet 格式"]],"s":"8.2","o":174,"w":"每日都要分析，不能移到 Glacier 這類取回慢又貴的層級，可省的是格式：Glue ETL 把 CSV 轉成欄式 Parquet，壓縮後儲存量變小，查詢只讀需要的欄位，掃描成本一起降。","p":["glue","s3"],"k":"glue","x":[],"d":""},{"n":235,"q":"Athena Spark 筆記本查詢 S3 已分區大資料集（crawler 更新分區），要最小化掃描資料量？","a":"A","t":[["A","查詢中加入分區篩選條件"]],"s":"8.3","o":177,"w":"資料已分區、crawler 也會更新，缺的是查詢條件：WHERE 加上 partition 欄位篩選，Athena 才會 partition pruning 跳過無關分區、少掃資料。提高 crawler 頻率或改 Spark 快取都沒用。","p":["s3","athena"],"k":"athena","x":[],"d":""},{"n":236,"q":"Redshift 在帳號1公有子網，SG 只允許自身流量；QS Enterprise 在帳號2公有子網，SG 可出站至 Redshift。如何讓 QS 查詢 Redshift？","a":"A","t":[["A","Redshift SG 允許 QS SG 入站該埠"]],"s":"13.2","o":312,"w":"QuickSight 端 SG 已允許出站，卡在 Redshift SG 只放行自己：在 Redshift SG 加 inbound rule，來源設 QuickSight SG、埠號用 Redshift port。Elastic IP、改 CIDR 都不對題。","p":["quicksight","vpc","redshift"],"k":"vpc","x":[],"d":""},{"n":237,"q":"大型檔案每天不定時上傳 S3 一次，Glue workflow 處理後載入 Redshift，要盡快開始處理？","a":"B","t":[["B","CloudTrail+EventBridge 事件觸發"]],"s":"7.5","o":155,"w":"檔案到達時間不定又要盡快處理，排程輪詢一定空等。S3 data events 記到 CloudTrail，EventBridge rule 攔 PutObject 觸發 Glue event-based trigger，一上傳就啟動 workflow。","p":["s3","cloudtrail","eventbridge","glue_wf","glue","redshift"],"k":"glue_wf","x":[],"d":""},{"n":238,"q":"使用者每小時上傳一檔到 S3 即需轉換（<1分鐘），結果以 email 寄給工程師。最具營運效率？","a":"C","t":[["C","S3 事件觸發 Lambda，SNS 寄 email"]],"s":"7.5","o":156,"w":"每小時一檔、轉換不到 1 分鐘，最適合 Lambda：S3 Event Notifications 在物件建立時觸發 Lambda 轉換，結果發布到 SNS topic，工程師以 email 訂閱收信。全 serverless 免管主機。","p":["s3","lambda","sns_sqs","users"],"k":"lambda","x":[],"d":""},{"n":239,"q":"Glue PySpark 以 DynamicFrame 處理資料湖，郵遞區號含多餘數字或無效字元導致錯誤，如何修正？","a":"A","t":[["A","定義 schema 傳給 DynamicFrame"]],"s":"5.2","o":91,"w":"postal code 混入多餘數字與無效字元才出錯。依流程要求的格式定義 PySpark schema，處理時傳給 DynamicFrame，欄位就照正確格式解析。push-down predicate 等設定都與欄位格式無關。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":240,"q":"Glue workflow 偶因資料品質問題失敗，業務團隊需在每次失敗時收到 email 通知？","a":"B","t":[["B","SNS 標準主題+EventBridge 規則"]],"s":"14.2","o":325,"w":"Glue job 狀態變更會送到 EventBridge：rule 篩 FAILED，target 設 SNS standard topic，團隊信箱訂閱，每次失敗都收到 email。SNS FIFO topic 不支援 email，SQS 也不會寄信。","p":["glue","eventbridge","sns_sqs","users"],"k":"eventbridge","x":[],"d":""},{"n":241,"q":"多條關鍵 Glue 管線，失敗時需通知利害關係人。最少營運負擔？","a":"C","t":[["C","EventBridge→CW 指標→警示→SNS"]],"s":"14.2","o":326,"w":"EventBridge rule 比對 Glue job failure 事件，以 rule 觸發數建 CloudWatch metric，再設 alarm 通知 SNS，所有 pipeline 統一告警。全靠設定，不必寫 Lambda 或讀 log 判斷失敗。","p":["glue","eventbridge","cloudwatch","sns_sqs","users"],"k":"cloudwatch","x":[],"d":"⚠ 社群答案有分歧"},{"n":242,"q":"Glue Spark 作業失敗（已啟用日誌與監控），要查看作業內各 stage 的指標，該去哪看？","a":"A","t":[["A","Spark UI 查看 job 與 stage"]],"s":"6.5","o":123,"w":"要看 job 內各 stage 的指標，正是 Spark UI 的用途：可逐一看 stages、tasks、executors 的耗時與 shuffle 讀寫。CloudWatch metrics 多是 job 層級的聚合值，細不到單一 stage。","p":["glue","s3"],"k":"glue","x":[],"d":""},{"n":243,"q":"Athena 表依日期分區、含5年每日資料，查詢慢。要提升效能並自動化分區管理？","a":"B","t":[["B","Athena 分區投影，設5年日期範圍"]],"s":"8.4","o":182,"w":"5 年每日分區很多，慢在向 Glue Catalog 取大量 partition metadata。partition projection 在 table properties 設 5 年前到現在的日期範圍，Athena 直接推算分區，又免手動加分區。","p":["s3","catalog","athena"],"k":"catalog","x":[],"d":""},{"n":244,"q":"以 Iceberg 建 100TB 資料湖，要在 Glue Spark 作業中使用 Iceberg？（選2）","a":"BC","t":[["B","--extra-jars 指定版本+設 formats"],["C","--datalake-formats 設為 iceberg"]],"s":"1.6","o":22,"w":"Glue 原生支援 Iceberg，關鍵是 job parameter --datalake-formats 設為 iceberg；要用特定 Iceberg 版本，再以 --extra-jars 指定該版 JAR。auto scaling、job bookmark 都無關。","p":["glue","table_fmt","s3"],"k":"glue","x":[],"d":""},{"n":245,"q":"Glue Spark 作業對兩個同樣大的 DataFrame 做 sort-merge join，報錯 No space left on device，如何解決？","a":"A","t":[["A","使用 Glue Spark shuffle manager"]],"s":"6.5","o":124,"w":"兩個大 DataFrame 做 sort-merge join 會產生大量 shuffle，No space left on device 是 worker 本機磁碟被塞滿。Glue Spark shuffle manager 把 shuffle 寫到 S3，不再受本機磁碟限制。","p":["glue","s3"],"k":"glue","x":[],"d":""},{"n":246,"q":"交易需多層依序驗證，每筆須24小時內處理或拒絕，總執行<24小時。最低營運成本？","a":"A","t":[["A","Step Functions 標準+Callback"]],"s":"7.3","o":142,"w":"驗證須逐層依序、總時長可能近 24 小時。Step Functions Standard 支援長時間執行，Wait for Callback 以 task token 暫停到驗證完成再續跑，等待不計費；Express 最多只跑 5 分鐘。","p":["app","sfn"],"k":"sfn","x":[],"d":""},{"n":247,"q":"大量 Glue 作業同時啟動於同 VPC 同一子網，偶報「子網沒有足夠可用位址」。可能根因？","a":"A","t":[["A","子網的 IP 位址不足"]],"s":"13.3","o":314,"w":"錯誤訊息已直說 subnet 可用位址不足。Glue job 連 VPC 會在指定 subnet 建 ENI 占用 private IP，大量 job 同時在同一 subnet 啟動就把 IP 用光，與 worker type、IAM 無關。","p":["glue","vpc"],"k":"vpc","x":[],"d":""},{"n":248,"q":"EMR（EC2）每晚以 cluster mode 跑 Spark 出錯，錯誤在 driver stderr 日誌。去哪找？","a":"C","t":[["C","EMR 主控台看存於 S3 的 step 日誌"]],"s":"6.2","o":117,"w":"EMR 會把 step logs 歸檔到 S3，事後仍查得到；從 EMR console 開該 step 的 logs 即可看 Spark driver stderr。live cluster 的 YARN UI 或 SSH 到 primary node 都不利事後追查。","p":["emr","s3"],"k":"emr","x":[],"d":""},{"n":249,"q":"每日500GB CSV（已註冊 Glue Catalog）轉 Parquet，需15GiB記憶體長時間並行處理，前兩程序完成後才跑第三個。最少營運負擔？","a":"C","t":[["C","Glue workflow 前兩平行再接第三"]],"s":"7.1","o":131,"w":"資料在 S3、schema 在 Glue Catalog，轉 Parquet 用 Glue job 最直接。Glue workflows 讓前兩個 process 平行跑，trigger 等兩者完成才啟動第三個，比 MWAA 或 Step Functions 省維運。","p":["glue_wf","glue","s3"],"k":"glue_wf","x":["catalog"],"d":""},{"n":250,"q":"KDS（增強扇出）在帳號A，帳號B 的 Lambda 要處理資料，B 已建有權限的執行角色。還需做什麼？","a":"B","t":[["B","KDS 加資源型政策允許該角色"]],"s":"12.3","o":278,"w":"跨帳號需兩端授權：Account B 的 Lambda role 已有權限，還缺 Account A 資源端的允許，在 data stream 加 resource-based policy 開放該 role 讀取即可。SCP 只能限制、不能授權。","p":["kds","lambda"],"k":"iam","x":["iam"],"d":""},{"n":251,"q":"Athena 查 S3，Glue 表需年/月/日分區，且需每天建立分區以因應 schema 變更？","a":"C","t":[["C","Glue 表設定分區投影屬性"]],"s":"8.4","o":183,"w":"year/month/day 分區要每天新增，改用 partition projection：在 Glue table properties 定義分區範圍與 S3 路徑樣板，Athena 查詢時自動推算分區，不必每天跑 crawler 或 Lambda。","p":["s3","catalog","athena"],"k":"catalog","x":[],"d":""},{"n":252,"q":"飯店每日檔案由地端程式送至全託管擷取服務，以 Athena 查詢，需防誤刪。最少營運負擔？","a":"B","t":[["B","Kinesis Agent→Firehose→S3 版控"]],"s":"3.1","o":47,"w":"地端裝 Kinesis Agent，自動把檔案送到全託管的 Data Firehose，再交付到 S3 供 Athena 查詢。S3 開 versioning 後，誤刪只會加上 delete marker，舊版本仍救得回來。","p":["src_file","firehose","s3","athena"],"k":"firehose","x":[],"d":""},{"n":253,"q":"EMR Spark 處理串流資料存 S3，以 Athena 分析，要最佳化格式使查詢時間最短？（選2）","a":"BD","t":[["B","ORC 格式+Glue Catalog 追 schema"],["D","Parquet+Glue Catalog 追 schema"]],"s":"8.2","o":175,"w":"Athena 要查得快就用欄式格式：ORC 與 Parquet 都支援欄位裁剪、壓縮與 predicate pushdown，只讀需要的欄位，掃描量遠小於 CSV、JSON。再用 Glue Data Catalog 追蹤 schema 變更。","p":["src_stream","emr","s3","catalog","athena"],"k":"s3","x":[],"d":""},{"n":254,"q":"S3 大型 CSV 每日追加，含5年銷售資料，Athena 需查特定期間資料。最具成本效益？","a":"B","t":[["B","依 SALE_DATE 以前綴每日分區"]],"s":"8.3","o":178,"w":"查詢都撈特定期間，依 SALE_DATE 用 S3 prefix 建每日分區並加進 Glue Catalog，Athena 帶日期條件就只掃相關日期，按掃描量計費的成本跟著降。轉 JSON 或搬到 RDS 都更貴更麻煩。","p":["s3","catalog","athena"],"k":"s3","x":[],"d":""},{"n":255,"q":"需實作資料目錄方案，追蹤 Redshift 資料表的 schema 變更？","a":"A","t":[["A","Glue crawler 每日 JDBC 更新 Catalog"]],"s":"4.2","o":73,"w":"要建資料目錄並追蹤 schema 變更：Glue crawler 透過 JDBC 連 Redshift 讀 table metadata，排程每天跑，欄位一變就更新 Glue Data Catalog。DataSync、SCT 都不做 cataloging。","p":["redshift","crawler","catalog"],"k":"crawler","x":[],"d":""},{"n":256,"q":"偵測跨多個 S3 bucket 資料湖中專有格式的 PII。最少營運負擔？","a":"A","t":[["A","Glue Detect PII 轉換+自訂模式"]],"s":"12.7","o":301,"w":"PII 藏在專有格式，Macie 的 managed identifiers 只認標準格式；Glue Detect PII transform 可設 specific patterns，在 ETL 中直接掃多個 S3 bucket，比自寫 Lambda regex 省維運。","p":["s3","glue"],"k":"glue","x":[],"d":""},{"n":257,"q":"DynamoDB 表每日須移除超過指定年限的項目。最少設定工作？","a":"A","t":[["A","啟用 TTL，程式設定 TTL 屬性"]],"s":"10.4","o":248,"w":"DynamoDB TTL 是原生過期刪除：啟用後由應用程式在 item 寫入過期時間（epoch 秒）屬性，到期自動刪除、不耗 WCU。只開功能加一個屬性，比 EventBridge 加 Lambda 每日掃表刪除省設定。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":258,"q":"DynamoDB 數十億筆，PK=RideID、SK=TripStartTime。要讓司機依 RideStatus 查自己的行程且不掃全表？","a":"C","t":[["C","GSI：PK=DriverID、SK=RideStatus"]],"s":"10.2","o":241,"w":"原表 key 是 RideID＋TripStartTime，依司機查只能 scan 全表。建 GSI，以 DriverID 為 partition key、RideStatus 為 sort key 即可直接 Query。LSI 須沿用原表 partition key，不可行。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":259,"q":"S3 事件觸發的 Lambda（128MB 記憶體、15秒逾時）CPU 常近100%而變慢，要提升效能並縮短總執行時間？","a":"A","t":[["A","記憶體提高到 512MB"]],"s":"7.7","o":164,"w":"Lambda 的 CPU 依記憶體按比例配置，128 MB 分到的 CPU 太少才常卡 100%。記憶體調到 512 MB 會一併拿到更多 CPU，執行變快、pipeline 縮短；加長 timeout 解不了 CPU 瓶頸。","p":["s3","lambda"],"k":"lambda","x":[],"d":""},{"n":260,"q":"KDS→Glue ETL 偵測異常後通知 SNS，高流量時通知延遲且 diskSpaceUsed_MB 很高。最少工作量？","a":"D","t":[["D","啟用 Glue ETL auto scaling"]],"s":"6.6","o":127,"w":"高流量時 diskSpaceUsed_MB 飆高、SNS 通知延遲，代表 Glue 固定資源在尖峰不夠。啟用 Glue auto scaling 讓 worker 隨負載自動增減，尖峰加、平時不浪費，不必手動調 DPU 或搬到 EMR。","p":["kds","glue","sns_sqs"],"k":"glue","x":["cloudwatch"],"d":""},{"n":261,"q":"Redshift 查詢改為 join S1（100億筆）與 S2（9億筆）後變慢，如何提升效能？（選2）","a":"BE","t":[["B","兩表 KEY 分布，用高基數欄 join"],["E","用 Redshift Advisor 檢視建議"]],"s":"9.5","o":219,"w":"兩張大表 join 慢在跨節點重分佈資料。兩表都用 KEY distribution、以高基數 join 欄為 key，同 key 落同節點就地 join、不傾斜；Redshift Advisor 再依 workload 給出最佳化建議。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":262,"q":"Glue 讀寫即時串流的 Iceberg 表（Parquet），查詢效能變慢，如何改善？（選2）","a":"BD","t":[["B","Catalog 自動壓縮 Iceberg 表"],["D","Catalog 啟用 copy-on-write"]],"s":"1.6","o":23,"w":"串流寫入 Iceberg 會累積大量小檔與 delete files，查詢要開很多檔。Glue Catalog 自動 compaction 合併小檔；copy-on-write 在寫入時就重寫資料檔，查詢不必再合併 delete files。","p":["src_stream","glue","table_fmt"],"k":"table_fmt","x":["catalog"],"d":""},{"n":263,"q":"現用 EMR Spark+Glue 做 ETL 寫入 S3，要改全託管無伺服器、續用 Spark，並以最少人工自動編排多個作業？","a":"A","t":[["A","全遷到 Glue，用 Glue workflows"]],"s":"6.1","o":116,"w":"要全託管 serverless 又得用 Spark：Glue 本身就是 serverless Spark ETL，把 EMR 的轉換一併遷過來就不用管 cluster，再用 Glue workflows 編排多個 job 的順序與 trigger，自動執行。","p":["glue_wf","glue","s3"],"k":"glue","x":[],"d":""},{"n":264,"q":"法規要求資料僅限所在區域存取；以 AD+自訂身分代理呼叫 AssumeRole 取臨時憑證。最少管理負擔的區域限制？","a":"A","t":[["A","單一角色+各區政策作 session policy"]],"s":"12.3","o":279,"w":"身分代理本就呼叫 AssumeRole，可順勢傳 session policy：只建一個能建資源的 IAM role，每個 Region 一份限該區的 policy，依員工所在地傳入，權限取交集。不必每區各建 role 或 group。","p":["users","app","iam"],"k":"iam","x":[],"d":""},{"n":265,"q":"每日自動將 S3 資料載入 Redshift，敏感資料須遮蔽、使用者不可見明文。最少營運負擔？","a":"D","t":[["D","Glue 載入，Redshift 動態遮罩"]],"s":"12.8","o":306,"w":"要讓使用者看不到明文，就在 Redshift 用 dynamic data masking：Glue job 每日把 S3 資料載入 Redshift，建 masking policy 套到敏感欄位，查詢時依角色遮罩，原始資料不必改寫。","p":["s3","glue","redshift","users"],"k":"redshift","x":[],"d":""},{"n":266,"q":"需低延遲即時彙總、過濾大量串流資料，並存入 S3 供分析。最具營運效率？","a":"C","t":[["C","KDS+Managed Flink 處理寫 S3"]],"s":"3.5","o":62,"w":"串流資料的低延遲彙總、過濾是有狀態串流運算，正是 Managed Service for Apache Flink 的強項。Kinesis Data Streams 當來源，Flink 處理後寫入 S3；Lambda、Firehose 不適合複雜聚合。","p":["src_stream","kds","flink","s3"],"k":"flink","x":[],"d":""},{"n":267,"q":"ML 訓練資料存於 S3，需套用資料品質規則，最少營運負擔？","a":"B","t":[["B","DataBrew 規則集+Profile job+EB"]],"s":"5.7","o":110,"w":"最少營運負擔就是不自寫檢查程式：DataBrew ruleset 定義品質規則、profile job 執行檢查，EventBridge 在 S3 新增資料時自動觸發。Lambda 或 EMR 自寫檢查都要維護程式碼與資源。","p":["s3","eventbridge","databrew"],"k":"databrew","x":[],"d":""},{"n":268,"q":"用 Glue Data Catalog 查 S3 銷售資料，發現部分記錄遺失或過時，最可能原因？","a":"A","t":[["A","Catalog 未同步最新 S3 分割區"]],"s":"4.4","o":79,"w":"資料在 S3 卻查不到或是舊的，代表查詢依據的 metadata 落後：新的 S3 partition 沒同步進 Glue Data Catalog，查詢就只看得到舊分區。IAM 錯誤會直接拒絕存取，versioning 也不影響查詢結果。","p":["s3","catalog","users"],"k":"catalog","x":[],"d":""},{"n":269,"q":"POS 交易在 RDS MySQL，歷史在 Redshift，需每日合併報表、近即時，且傳輸成本與維護最低？","a":"A","t":[["A","DMS 持續複寫到 Redshift 再查"]],"s":"2.2","o":34,"w":"要近即時把當日交易併入歷史資料：DMS 持續複寫（CDC）把 RDS MySQL 變更同步進 Redshift，報表直接在 Redshift 內 join。每小時 Glue ETL 或 S3 匯出再 COPY 不夠即時，還多一條批次管線。","p":["rds","dms","redshift","users"],"k":"dms","x":[],"d":""},{"n":270,"q":"資料分析師需在進階轉換前準備、標準化資料湖資料，不能寫新程式碼，最少工作量？","a":"C","t":[["C","Glue Studio 資料準備 recipe 轉換"]],"s":"5.1","o":87,"w":"分析師不能寫程式：Glue Studio 的 data preparation recipe 以視覺化步驟清理、標準化資料，工程師再於同一 Glue pipeline 加進階轉換。Pandas notebook 要寫程式，寫文件則仍靠工程師實作。","p":["s3","databrew","glue"],"k":"databrew","x":[],"d":""},{"n":271,"q":"RDS Oracle 全表需供未來分析，customer_complaints 表須近即時經 REST API 處理，最具成本效益？","a":"C","t":[["C","DMS→KDS(該表)+DMS→S3+Lambda"]],"s":"2.3","o":36,"w":"分兩路最省：一個 DMS task 只把 customer_complaints 以 CDC 串到 Kinesis，Lambda 消費後呼叫 REST API；另一個 DMS task 把全部資料表送到 S3 供分析。不必多養 PostgreSQL 或 Redshift。","p":["rds","dms","kds","lambda","app"],"k":"dms","x":[],"d":""},{"n":272,"q":"Redshift 複雜轉換查詢要跑數小時，要盡可能縮短查詢時間？","a":"D","t":[["D","對常用查詢建物化檢視(MV)"]],"s":"9.6","o":222,"w":"慢在重複執行的複雜轉換：materialized view 把常用 join、聚合結果預先算好存起來，查詢直接讀結果不必重算。concurrency scaling 只解決排隊，改用 Athena 或 Spectrum 也不會更快。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":273,"q":"S3 資料湖需轉換清理後，讓多個夥伴在上班時間跑 SQL，最具成本效益？","a":"B","t":[["B","下班後 Glue Flex→Redshift Serverless"]],"s":"9.1","o":202,"w":"資料可下班後批次處理：Glue Flex 用閒置運算資源跑 ETL，比標準 job 便宜；Redshift Serverless 讓夥伴上班時間用 SQL 查、依用量計費。EMR 或 provisioned Redshift 閒置也要付費。","p":["s3","glue","redshift","users"],"k":"glue","x":[],"d":""},{"n":274,"q":"批次 ETL 分擷取、轉換、儲存階段，存 S3，每階段自動重試、可見各階段成敗，最少營運負擔？","a":"B","t":[["B","Step Functions 編排 Lambda+Glue"]],"s":"7.2","o":137,"w":"要每階段自動重試、看得到各階段成敗：Step Functions 每個 state 都能設 Retry，並視覺化執行狀態；Lambda 擷取、Glue job 轉換寫入 S3。Glue trigger 設 MaxRetries 0 等於不重試。","p":["sfn","lambda","glue","s3"],"k":"sfn","x":[],"d":""},{"n":275,"q":"資料網格：3 團隊各擁資料，Glue Catalog 千張表，用 Athena/Redshift，需跨域分析、稽核、限制 PII，可擴展？","a":"C","t":[["C","Lake Formation 跨域存取+細粒度"]],"s":"12.1","o":268,"w":"千張表跨 domain 共享又要限制 PII：Lake Formation 直接在 Glue Data Catalog 上做跨 domain 授權與欄、列級細粒度控制，Athena、Redshift 都適用，存取可由 CloudTrail 稽核。","p":["catalog","lf","athena","users"],"k":"lf","x":["cloudtrail"],"d":""},{"n":276,"q":"S3 與 RDS 需備份並依期限保留，且保留期間防意外或惡意刪除，最少營運負擔？","a":"C","t":[["C","AWS Backup 計畫+Vault Lock 合規"]],"s":"1.4","o":15,"w":"一次管 S3 與 RDS 的備份與保留期：AWS Backup plan 集中設排程與 lifecycle，Vault Lock compliance mode 讓保留期內連 root 都刪不掉。各服務分設 versioning、snapshot 維運多且仍可被刪。","p":["s3","s3_tier"],"k":"s3_tier","x":["rds"],"d":""},{"n":277,"q":"每天上傳機密文件到 S3，需獨立驗證所有上傳資料完整性，確認傳輸未損毀？","a":"C","t":[["C","上傳前算 SHA-256 傳給 SDK"]],"s":"1.5","o":18,"w":"要獨立驗證傳輸沒損毀：上傳前在本地算 SHA-256 checksum，隨上傳請求交給 AWS SDK，S3 收到後比對、不符就拒絕寫入。下載抽樣或全量比對效率差，SSE-C 加密與完整性驗證無關。","p":["src_file","s3"],"k":"s3","x":[],"d":""},{"n":278,"q":"S3 物件超過 1 年須 5 小時內可取，所有版本 WORM 不可變保留 7 年？","a":"C","t":[["C","Object Lock+1年轉 Glacier Flexible"]],"s":"1.4","o":16,"w":"WORM 且所有版本 7 年不可變，只能靠 S3 Object Lock（versioning 仍可刪）；1 年後轉 Glacier Flexible Retrieval，standard 取回 3～5 小時符合需求。Deep Archive 取回約 12 小時，太慢。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":279,"q":"部署複雜管線，各階段要能執行腳本，只能用全託管、無伺服器服務？","a":"B","t":[["B","MWAA 建置並排程管線"]],"s":"7.4","o":148,"w":"複雜多階段、每階段都要跑腳本：MWAA 是全託管 Apache Airflow，用 DAG 編排與排程任意 script 任務，不用自管伺服器。EC2 要自己維運主機，DataBrew 只做資料準備、不能跑自訂腳本。","p":["users","mwaa"],"k":"mwaa","x":[],"d":""},{"n":280,"q":"S3 每天千萬小物件：前60天即時取、61–180天偶爾取、181–365天1小時內可取、365天後刪，最佳化成本？","a":"B","t":[["B","生命週期：60天IA→180天GFR→刪"]],"s":"1.2","o":6,"w":"存取頻率隨天數下降，用 lifecycle 自動轉換：60 天後轉 Standard-IA 仍可即時取用，180 天後轉 Glacier Flexible Retrieval（expedited 數分鐘可取回），365 天 expire，不必自建 Lambda。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":281,"q":"Glue PySpark 需從 DynamoDB 讀已知分割鍵的資料，需 DynamicFrame，RCU 最少？","a":"D","t":[["D","用分割鍵做 query 再轉 DF"]],"s":"10.2","o":242,"w":"已知 partition key，就用 DynamoDB Query 放進 key condition expression，只讀符合的 items、RCU 最少，再轉 DynamicFrame。Scan 或 connector filter 會先讀整張表再篩，浪費 RCU。","p":["dynamodb","glue"],"k":"dynamodb","x":[],"d":""},{"n":282,"q":"多租戶 EMR，團隊用 EMR Step 跑 Spark 讀 DynamoDB 機密表，只允許特定團隊存取？","a":"A","t":[["A","為 EMR Step 設 runtime role"]],"s":"12.3","o":280,"w":"多租戶要讓各團隊 step 權限不同：EMR runtime role 讓每個 step 以自己的 IAM role 執行，只有該團隊的 role 能讀 DynamoDB 機密表。EMRFS role 只管 S3，Lake Formation 不管 DynamoDB。","p":["users","emr","dynamodb"],"k":"emr","x":["iam"],"d":""},{"n":283,"q":"S3 每小時進數千個 50–100KB Parquet，評估 Iceberg+Glue Catalog，需確保檔案增多效能不下降？","a":"C","t":[["C","Iceberg 依檔案大小/數量自動壓縮"]],"s":"1.6","o":24,"w":"每小時數千個 50～100KB 小檔，檔案越多 Iceberg 要讀的 metadata 越多、查詢越慢：設定依檔案大小與數量門檻自動 compaction，持續把小檔合併。每天跑一次 Glue job 壓縮，中間仍會退化。","p":["s3","table_fmt"],"k":"table_fmt","x":["catalog"],"d":""},{"n":284,"q":"IoT 管線用 KDS→Firehose→S3，需監控管線健康，最少營運工作？","a":"B","t":[["B","CW 警報監控 IncomingBytes 等指標"]],"s":"14.1","o":322,"w":"KDS 與 Firehose 原生把 metrics 送進 CloudWatch，直接對 IncomingBytes、OutgoingBytes、DeliveryToS3.Success 設 alarm 即可告警、不用寫程式。人工看 logs、Lambda 每日檢查都更費工。","p":["src_stream","kds","firehose","s3"],"k":"cloudwatch","x":["cloudwatch"],"d":""},{"n":285,"q":"產品屬性可變，需高量突發查詢、個位數毫秒延遲，以 Product ID 取值並可依 Category、Brand 查？","a":"A","t":[["A","DynamoDB 隨需容量+主鍵+GSI"]],"s":"10.2","o":243,"w":"可變屬性、突發流量、個位數毫秒延遲，正是 DynamoDB on-demand：自動吸收尖峰、免規劃容量；Product ID 當 primary key，Category、Brand 用 GSI 查詢。Aurora 需固定 schema、難應付突發。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":286,"q":"地端日誌上傳 S3，需驗證 S3 上的日誌與地端一致？","a":"A","t":[["A","SDK 上傳自動算 CRC32 存中繼資料"]],"s":"1.5","o":19,"w":"要確認 S3 上的 log 與地端一致：AWS SDK 上傳時自動算 CRC32 checksum 讓 S3 比對，checksum 也存進物件中繼資料供日後再驗。Object Lock 是防刪改、不是驗證內容一致。","p":["src_file","s3"],"k":"s3","x":[],"d":""},{"n":287,"q":"EventBridge Scheduler 呼叫 Glue workflow，取消訂單 FailedInvocations 很高，須找出失敗原因？","a":"A","t":[["A","Scheduler 設 DLQ 存失敗事件分析"]],"s":"7.6","o":159,"w":"FailedInvocations 只看得出失敗多、看不到原因：EventBridge Scheduler 設 DLQ，失敗事件連同錯誤資訊存進 SQS，就能分析取消訂單為何呼叫 Glue 失敗。調整 retry 只改重試行為，查不出根因。","p":["eventbridge","sns_sqs"],"k":"sns_sqs","x":["glue_wf"],"d":""},{"n":288,"q":"處理 S3 1TB 檔產生 3 個 DataFrame 平行存另一 S3，管線為 EventBridge 規則目標，最少維護？","a":"C","t":[["C","Glue workflow 平行跑 3 個 job"]],"s":"7.1","o":132,"w":"1 TB 檔要用 Spark、Lambda 跑不動：Glue workflow 平行啟動三個 Glue job，各寫一個 DataFrame 到第二個 bucket，workflow 也能直接當 EventBridge 的 target，不必再套 Step Functions。","p":["s3","eventbridge","glue_wf","glue","s3"],"k":"glue_wf","x":[],"d":""},{"n":289,"q":"KDS 的 IoT 資料需近即時做複雜、有狀態轉換後存 S3，最少營運負擔？","a":"B","t":[["B","Managed Service for Apache Flink"]],"s":"3.5","o":63,"w":"近即時、複雜且有狀態的轉換正是 Flink 強項：Managed Service for Apache Flink 直接讀 Kinesis 處理後寫 S3，全託管免管叢集。Glue、EMR 偏批次或要管叢集，Lambda 不適合有狀態處理。","p":["src_stream","kds","flink","s3"],"k":"flink","x":[],"d":""},{"n":290,"q":"S3 時序資料只允許部署在公司 VPC 內的工作負載存取？","a":"A","t":[["A","Bucket policy 條件限定來源 VPC"]],"s":"13.1","o":309,"w":"只讓公司 VPC 內的 workload 存取，就用 S3 bucket policy 的 condition（如 aws:SourceVpc）擋掉其他來源。S3 bucket 無法套 security group，NACL 是 subnet 層級、管不到 bucket。","p":["app","vpc","s3"],"k":"iam","x":["iam"],"d":""},{"n":291,"q":"Glue 平台需資料品質驗證：含已知問題規則，且能自動偵測未預期問題，最少營運負擔？","a":"A","t":[["A","Glue Data Quality+異常偵測"]],"s":"5.7","o":111,"w":"已在用 Glue，就在 Glue job 加 Glue Data Quality：rules 檢查已知問題，anomaly detection 自動學習資料統計、抓出沒寫成規則的未預期問題。開源框架或手寫 SQL 要自己維護、也不會自動偵測。","p":["glue","gdq"],"k":"gdq","x":[],"d":""},{"n":292,"q":"自管 Iceberg 資料湖，即時表由大量小檔組成導致查詢慢，需提升效能？","a":"D","t":[["D","執行壓縮(compaction)"]],"s":"1.6","o":25,"w":"即時寫入產生大量小檔，查詢要開更多檔案、讀更多 metadata 而變慢：compaction 把小檔合併成大檔，直接改善效能。expire、archive snapshots 或刪孤兒檔只省空間，不減少要讀的檔案數。","p":["src_stream","table_fmt","s3"],"k":"table_fmt","x":[],"d":""},{"n":293,"q":"每日 CSV 交易日誌存 S3，Athena 當天查部分欄位，量增變慢，要查詢時間最短？","a":"D","t":[["D","每日單一 Parquet+日期分割+下推"]],"s":"8.3","o":179,"w":"只查當天、部分欄位：Parquet 欄式儲存只讀需要的欄位，依日期分區讓 Athena 只掃當天，predicate pushdown 再略過不符的資料區塊，每天單一檔也避免小檔開銷。JSON、Avro 是列式，掃描量大。","p":["s3","athena","users"],"k":"s3","x":[],"d":""},{"n":294,"q":"S3 客戶資料超過 7 年必須永久刪除？","a":"A","t":[["A","生命週期政策刪除超過7年物件"]],"s":"1.3","o":11,"w":"超過固定年限就永久刪除，S3 Lifecycle expiration 依物件年齡自動執行、不用寫程式。Athena 只能查詢不能刪 S3 物件，轉 Deep Archive 或加 Object Lock 都沒有把資料刪掉。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":295,"q":"兩團隊各在不同帳號，要存取第三帳號 Redshift 的 datashare salesshare，用 SQL 授權？","a":"D","t":[["D","兩條 GRANT … TO NAMESPACE"]],"s":"9.9","o":235,"w":"兩個團隊是兩個 consumer，各要一條授權：GRANT USAGE ON DATASHARE salesshare TO NAMESPACE 每次只指定一個 namespace，所以分兩條執行。TO NAMESPACES 或用 AND 列多個對象都不是有效語法。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":296,"q":"DynamoDB 資料保留 1 年，之後封存 5 年再刪除，最具作業效率？","a":"D","t":[["D","Streams+TTL+Lambda→DA+生命週期刪"]],"s":"10.4","o":249,"w":"全用託管功能自動化：TTL 1 年後自動刪 item，Streams 把被刪的 item 交給 Lambda 直接寫入 Glacier Deep Archive（封存最便宜），S3 Lifecycle 5 年後刪除。自建 timestamp 掃描較費工。","p":["dynamodb","lambda","s3","s3_tier"],"k":"dynamodb","x":[],"d":""},{"n":297,"q":"已啟用版本控制的 S3，設 365 天過期規則後物件數反而加倍，須如何永久刪除舊物件？","a":"D","t":[["D","加規則刪除現行與非現行版本"]],"s":"1.3","o":12,"w":"有 versioning 時 expire current 只加 delete marker、舊版仍在，物件數才翻倍：要再加 lifecycle rule 刪除超過 365 天的 current 與 noncurrent versions 才會永久刪除。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":298,"q":"Glue 處理 IoT 資料，需自動標記溫度超出 -50~150°C 及缺時間戳記錄，極少寫程式？","a":"A","t":[["A","DataBrew：完整性+數值範圍規則"]],"s":"5.7","o":112,"w":"規則明確已知：timestamp 不可缺、溫度在 -50～150°C。DataBrew 以視覺化定義 completeness rule 與 numeric range 規則，profile 時自動標記、幾乎不寫程式；ML 異常偵測是找未知問題。","p":["src_stream","databrew"],"k":"databrew","x":[],"d":""},{"n":299,"q":"推薦系統需整合第三方資料集到既有分析平台，最少營運負擔與時間？","a":"A","t":[["A","API 從 AWS Data Exchange 取用"]],"s":"2.4","o":41,"w":"AWS Data Exchange 是 AWS 上尋找、訂閱第三方資料集的服務，用 API 直接把訂閱的資料整合進既有分析平台，省去自找來源與維護整合。DataSync 是搬移資料的工具、不提供第三方資料集。","p":["src_saas","appflow","s3"],"k":"appflow","x":[],"d":""},{"n":300,"q":"年度報表存 S3，1 週後少存取，需保留 7 年且隨時可存取，最具成本效益？","a":"C","t":[["C","7天後轉 Glacier IR，7年過期"]],"s":"1.2","o":7,"w":"1 週後很少讀但仍要立即可讀：lifecycle 7 天後轉 Glacier Instant Retrieval，毫秒級取回、儲存費遠低於 Standard，7 年後 expire。Deep Archive 取回要數小時，不符合隨時可讀。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":301,"q":"Glue ETL 處理 PII 並寫入 CW Logs 日誌群組，需在日誌群組遮罩 PII？","a":"B","t":[["B","日誌群組套用資料保護政策"]],"s":"14.5","o":339,"w":"PII 已寫進 CloudWatch Logs，要在 log group 端遮罩：data protection policy 掛到 log group 後自動偵測並遮罩敏感資料。Glue security configuration 管加密，Macie 只掃 S3，都不遮罩 log。","p":["glue","cloudwatch"],"k":"cloudwatch","x":[],"d":""},{"n":302,"q":"EC2 與 RDS 同子網，EC2 應用需以 JDBC 連 RDS？","a":"C","t":[["C","DB 安全群組允許 EC2 連入"]],"s":"13.2","o":313,"w":"同 subnet 不代表能互連，RDS 連入由 security group 控制：DB security group 加 inbound rule 允許來自 EC2（或其 SG）的 DB port，JDBC 才連得上。IAM role 不控制網路連線。","p":["ec2","vpc","rds"],"k":"vpc","x":[],"d":""},{"n":303,"q":"電商需收集網站與 App 點擊流做即時分析並儲存，最少持續維護？","a":"C","t":[["C","KDS 收集+Firehose 送 S3"]],"s":"3.1","o":48,"w":"即時收點擊流又要最少維護：Kinesis Data Streams 承接網站與 App 事件，Data Firehose 全託管、自動批次寫入 S3 供分析。EC2 agent 要管主機、MSK 要管 broker，RDS 不適合存串流。","p":["src_stream","kds","firehose","s3"],"k":"kds","x":[],"d":""},{"n":304,"q":"Glue ETL 需檢查出貨日>訂單日、送達日>出貨日，不合格存另一 S3，最具成本效益？","a":"C","t":[["C","Glue DQ 自訂規則用三日期欄"]],"s":"5.5","o":106,"w":"已在用 Glue ETL，直接加 Glue Data Quality custom rule，一條規則比較三個日期欄位（出貨日>訂單日、送達日>出貨日），不合格記錄再分流到第二個 bucket。DataBrew 或 Athena 多一個服務。","p":["glue","gdq","s3"],"k":"gdq","x":[],"d":""},{"n":305,"q":"日誌表需持續寫入，供其他應用以 API 可靠查特定記錄；每秒>4,000 寫入、6,500 讀取。哪個方案？","a":"D","t":[["D","DynamoDB 佈建容量＋API 讀寫"]],"s":"10.1","o":240,"w":"每秒 4,000 寫、6,500 讀的持續寫入，還要讓其他應用以 API 依 key 查特定記錄，正是 DynamoDB 的強項，用 provisioned capacity 配足容量即可。Redshift 是分析倉儲，不適合高頻 API 讀寫。","p":["src_stream","dynamodb","app"],"k":"dynamodb","x":[],"d":""},{"n":306,"q":"大量 IoT 資料需無限期保留，在 Redshift 分析。最具成本效益？","a":"B","t":[["B","S3 存 Parquet＋Redshift Spectrum"]],"s":"9.4","o":214,"w":"資料要無限期保留，最省錢是放在低成本的 S3 並存成欄式 Parquet，再用 Redshift Spectrum 直接查外部資料。auto-copy 進 cluster 會讓儲存成本無限增長，JSON 掃描量也大。","p":["src_stream","s3","redshift"],"k":"redshift","x":[],"d":""},{"n":307,"q":"S3 資料湖含多部門資料，每天匯入百萬筆；各部門只能存取所需子集，最小權限。最少營運工作？","a":"C","t":[["C","Lake Formation＋LF-Tags(TBAC)"]],"s":"12.1","o":269,"w":"多部門共用資料湖又要最小權限，最省力是 Lake Formation：在 Glue Data Catalog 資源貼 LF-Tags（如部門），以 LF-TBAC 依標籤授權。比替每個部門各寫 IAM policy 和 S3 路徑好維護。","p":["s3","catalog","lf","users"],"k":"lf","x":[],"d":""},{"n":308,"q":"地端 MySQL 存病歷，每 30 天輪換憑證，不想每次輪換都改程式碼。最低營運負擔？","a":"C","t":[["C","Secrets Manager 自動輪換＋API 取"]],"s":"12.6","o":293,"w":"要定期輪換 DB 憑證又不改程式碼，就交給 Secrets Manager 自動輪換，應用程式每次以 API 取最新 secret，密碼不再寫死。KMS key rotation 換的是金鑰，不是 DB 密碼。","p":["src_db","secrets","app"],"k":"secrets","x":[],"d":""},{"n":309,"q":"擷取多個 Aurora MySQL 更新，近即時供分析；需無伺服器、維護最少。最低營運負擔？","a":"D","t":[["D","Aurora zero-ETL→Redshift SL"]],"s":"2.5","o":43,"w":"要近即時擷取多個 Aurora MySQL 的變更且 serverless、少維護：Aurora zero-ETL integration 直接把變更複寫進 Redshift Serverless，每個 DB 建一個即可，不必自建 DMS 或 Debezium。","p":["rds","redshift","users"],"k":"rds","x":[],"d":""},{"n":310,"q":"Athena 聯結兩表，要選正確聯結順序以優化效能。哪個做法？","a":"A","t":[["A","小表放左、大表放右"]],"s":"8.6","o":195,"w":"考點是 Athena join 的表順序：Athena 會依 SQL 撰寫的左右位置分配表來執行 join，所以順序會影響效能。依本題官方答案，應把較小的表寫在 join 左側、較大的表寫在右側。","p":["s3","athena"],"k":"athena","x":[],"d":"⚠ 官方：小表左大表右；AWS 文件建議大表左小表右"},{"n":311,"q":"Redshift 報表用 30 表，來源 Aurora MySQL 有 100 表；每小時全量刷新造成延遲。最低營運負擔？（選2）","a":"BC","t":[["B","Redshift 建立使用整合的 DB"],["C","Aurora 建 zero-ETL 只選所需表"]],"s":"2.5","o":44,"w":"全量刷新 100 張表才拖慢報表：在 Aurora 建 zero-ETL integration 並只選報表要的 30 張表（C），再於 Redshift 建立使用該 integration 的 database（B），即可近即時同步、免維護 ETL。","p":["rds","redshift","users"],"k":"rds","x":[],"d":""},{"n":312,"q":"每小時自動檢查 RDS、DynamoDB、OpenSearch 新資料並處理，單次≤10MB；成本與營運最佳、錯誤處理穩健。哪個方案？","a":"A","t":[["A","EventBridge→Step Functions＋Lambda"]],"s":"7.2","o":138,"w":"EventBridge 每小時觸發 Step Functions，由 Lambda 檢查 RDS、DynamoDB、OpenSearch 新資料再交給後續 state 處理，各 state 設 Retry/Catch 做錯誤處理，比 EMR、MWAA 省錢省事。","p":["eventbridge","sfn","lambda"],"k":"sfn","x":[],"d":""},{"n":313,"q":"Glue job 排程將 Redshift 供應商資料寫入 S3，已設好私有網路連線。下一步？","a":"A","t":[["A","建可寫 S3 的 IAM 角色掛 Redshift"]],"s":"13.5","o":319,"w":"私有網路已通，缺的是授權：Redshift 要把資料寫到 S3（如 UNLOAD），需要有 S3 寫入權限的 IAM role 並關聯到 Redshift cluster。data sharing、Spectrum 都不是寫出到 S3 的機制。","p":["glue","redshift","iam","s3"],"k":"iam","x":["vpc"],"d":""},{"n":314,"q":"S3 中 100MB Parquet 資料，需在資料準備前先做剖析(profile)。最具營運效率？","a":"A","t":[["A","Glue DataBrew 建 profile job"]],"s":"5.7","o":113,"w":"只是要在資料準備前剖析 100 MB 的 Parquet；Glue DataBrew profile job 直接產出欄位統計、分佈、缺失值等報告，免寫程式。Flink、Spectrum、QuickSight topic 都不是剖析工具。","p":["s3","databrew"],"k":"databrew","x":[],"d":""},{"n":315,"q":"零售點擊流即時分析載入 Redshift，每秒數百 MB。分析查詢延遲最低？","a":"C","t":[["C","KDS＋Redshift 串流擷取到 MV"]],"s":"9.3","o":210,"w":"數百 MB/s 的 clickstream 由 Kinesis Data Streams 承接，Redshift streaming ingestion 直接寫進 materialized view，資料一到就能查，省去 Firehose 先落地 S3 再 COPY 的延遲。","p":["src_stream","kds","redshift"],"k":"redshift","x":[],"d":""},{"n":316,"q":"即時交易管線依錯誤類型（安全/驗證/系統）立即通知不同團隊，不得延遲。最低營運負擔？","a":"B","t":[["B","EventBridge 規則分類→各 SNS 主題"]],"s":"14.2","o":327,"w":"要依錯誤類型立即通知不同團隊：EventBridge rule 用不同 event pattern 比對錯誤類型，各自路由到專屬 SNS topic，團隊即時收到。不必寫 Lambda 判斷，也不用讓團隊輪詢 SQS。","p":["eventbridge","sns_sqs","users"],"k":"eventbridge","x":[],"d":""},{"n":317,"q":"需可擴展、全託管、事件驅動編排複雜 ETL（Glue、EMR→Redshift、S3），支援相依管理、自動重試、監控。哪個方案？","a":"C","t":[["C","MWAA 以 Airflow DAG 管理 ETL"]],"s":"7.4","o":149,"w":"要協調 Glue、EMR、Redshift、S3 的複雜 ETL，並需相依管理、自動重試與監控；Airflow DAG 原生支援 task 相依、retries 與監控，MWAA 又是全託管，不必自己維運 Airflow。","p":["mwaa","glue","emr","redshift"],"k":"mwaa","x":[],"d":""},{"n":318,"q":"Redshift＋QuickSight 報表，部分分析師不會 SQL，想用自然語言建儀表板與報表。最低營運工作？","a":"B","t":[["B","QS 啟用 Amazon Q 產生報表"]],"s":"11.4","o":258,"w":"分析師不一定會 SQL 卻要常建報表；既然已用 Redshift 加 Quick Suite，直接啟用 Amazon Q in Quick Suite，就能用自然語言產生視覺化、dashboard 與報表，不必另導入 Tableau 等工具。","p":["redshift","quicksight","users"],"k":"quicksight","x":[],"d":""},{"n":319,"q":"SageMaker Unified Studio：各業務單位隔離管理資產/專案/中繼資料，核准後可跨單位共享，需集中驗證與身分對應。哪個方案？","a":"D","t":[["D","domain unit＋IdC＋存取申請核准"]],"s":"12.2","o":274,"w":"每個業務單位設成獨立 domain unit，自管 assets、projects、metadata 權限；IAM Identity Center 集中驗證並把使用者對應到各 domain unit；跨單位共享走 access request，由 owner 核准。","p":["iam","lf","users"],"k":"lf","x":[],"d":""},{"n":320,"q":"集中資料集供多個跨帳號下游團隊（各自 RA3 Redshift）存取，需立即存取且維持 Redshift 效能。哪個方案？","a":"C","t":[["C","Redshift data sharing 生產/消費"]],"s":"9.9","o":236,"w":"下游各帳號有自己的 RA3 Redshift，Redshift data sharing 讓 producer 把集中資料集分享給跨帳號 consumer，免複製、即時可查，且各用自己的運算資源。UNLOAD/COPY、DataSync 都有延遲。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":321,"q":"三區域交易資料近即時同步，傳輸加密、保順序一致、跨區 DR，延遲<500ms。最低營運工作？","a":"B","t":[["B","MSK Replicator 三區互連＋TLS"]],"s":"3.6","o":66,"w":"MSK Replicator 是全託管的跨 Region Kafka 複寫，三區互連即可近即時同步並保有 Kafka 的順序性；TLS 加密傳輸、IAM 驗證存取，加上跨區備援支援 DR。自建 MirrorMaker 維運較重。","p":["src_stream","msk"],"k":"msk","x":["kms","iam"],"d":""},{"n":322,"q":"需近即時搜尋分析，每秒 1,000 請求低延遲；各資料團隊可自行擁有並調整成本/效能。哪個方案？","a":"C","t":[["C","OpenSearch 索引，各隊一叢集"]],"s":"11.3","o":256,"w":"近即時搜尋、每秒 1,000 請求低延遲，是 OpenSearch 索引查詢的強項；再讓每個團隊擁有獨立 cluster，自行調整節點、儲存與索引來平衡成本與效能。Athena 查 S3 延遲太高。","p":["app","opensearch","users"],"k":"opensearch","x":[],"d":""},{"n":323,"q":"Redshift 表 orders.complete_orders_history 有 100 欄，要查全部欄位但排除 companyId、unique_system_id。哪個 SQL？","a":"A","t":[["A","SELECT * EXCLUDE 兩欄 FROM 表"]],"s":"9.8","o":232,"w":"Redshift 支援 SELECT * EXCLUDE 語法，可在選取全部欄位時直接排除指定欄位，寫 SELECT * EXCLUDE companyId, unique_system_id FROM 該表 即可，不必手動列出其餘 98 個欄名。","p":["redshift","users"],"k":"redshift","x":[],"d":"※ 原題選項為 SQL 圖片，選項文字為依題意重建"},{"n":324,"q":"S3 存敏感交易資料，需防止意外刪除。哪個方案？","a":"A","t":[["A","啟用版本控制＋MFA Delete"]],"s":"1.3","o":13,"w":"防誤刪最直接的是 S3 Versioning：刪除只會加上 delete marker，舊版本仍可復原；再啟用 MFA Delete，永久刪除版本或關閉 versioning 都要 MFA，大幅降低誤刪風險。","p":["users","s3"],"k":"s3","x":["iam"],"d":""},{"n":325,"q":"Redshift Email 欄含 null 與非 email 值；需 Glue Data Quality 規則在有效 email 比例<90% 時失敗。哪個？","a":"C","t":[["C","ColumnValues matches，門檻>0.9"]],"s":"5.5","o":107,"w":"要量的是有效 email 的比例：ColumnValues 搭配 matches 逐值比對 email pattern，threshold > 0.9 代表符合列須超過 90%，否則失敗。Uniqueness 量的是唯一性，0.1 門檻也不對。","p":["redshift","gdq"],"k":"gdq","x":[],"d":""},{"n":326,"q":"Glue job 存取 S3，需依分類只能存取特定前綴，且限營業時間 9–17 點。自訂 IAM 政策需含哪些元素？","a":"B","t":[["B","Resource 前綴＋aws:CurrentTime Date"]],"s":"12.3","o":281,"w":"兩個限制對應 policy 兩個元素：Resource 用帶 wildcard 的 S3 object ARN 限定分類前綴；Condition 用 aws:CurrentTime 搭配 DateGreaterThan、DateLessThan 限定 9 點到 17 點。","p":["glue","iam","s3"],"k":"iam","x":[],"d":""},{"n":327,"q":"RDS MySQL 日誌供稽核，須追蹤每位修改資料或變更 DB 執行個體的使用者。哪個方案？","a":"D","t":[["D","RDS 原生稽核日誌＋CW＋CloudTrail"]],"s":"14.4","o":336,"w":"要追兩種人：改資料的靠 RDS 原生 audit logging 記錄資料庫活動，送進 CloudWatch Logs 並設 metric filter、alarm；改 DB instance 屬於 API 操作，要靠 CloudTrail 記錄。缺一都不完整。","p":["users","rds","cloudwatch"],"k":"rds","x":["cloudtrail"],"d":""},{"n":328,"q":"S3 每日百萬筆交易 CSV，需平行驗證後更新 DB，失敗>15% 就停止全部。最低營運負擔？","a":"B","t":[["B","Step Functions 分散式 Map 容忍15%"]],"s":"7.3","o":143,"w":"百萬筆交易要平行驗證，Step Functions Distributed Map 可直接讀 S3 CSV 平行處理；ToleratedFailurePercentage 設為 15，失敗比例一超過就讓整個 Map Run 失敗停止，免自建失敗統計。","p":["s3","sfn","rds"],"k":"sfn","x":[],"d":""},{"n":329,"q":"一次性報告需聯結 DynamoDB、RDS、Redshift、S3 資料，避免不必要搬移並縮短查詢時間。哪個方案？","a":"D","t":[["D","Athena Federated Query 跨源聯結"]],"s":"8.1","o":169,"w":"一次性跨 DynamoDB、RDS、Redshift、S3 的 join，用 Athena Federated Query 透過 connector 就地查詢各來源，不必先搬資料或建 ETL。為一次報告建 DMS、Glue 或 EMR 流程又慢又不划算。","p":["dynamodb","athena","users"],"k":"athena","x":["rds","redshift","s3"],"d":""},{"n":330,"q":"無伺服器多步驟 ETL：S3 資料湖→Glue ETL→Redshift，需編排工作流程。哪些方案？（選2）","a":"AB","t":[["A","Step Functions 協調 Glue＋重試"],["B","Glue workflows 建相依與觸發圖"]],"s":"7.2","o":139,"w":"兩者都能編排 serverless 的 Glue ETL：Step Functions 依序協調多個 Glue job 並自動重試處理錯誤（A）；Glue workflows 是 Glue 原生編排，以圖形呈現 job 與 trigger 相依（B）。","p":["s3","glue","redshift"],"k":"sfn","x":["sfn","glue_wf"],"d":""},{"n":331,"q":"S3 原始影片處理後保留 90 天以備重處理，之後可刪除。原始檔最具成本效益的 Lifecycle？","a":"C","t":[["C","Standard 90 天後 Lifecycle 到期刪"]],"s":"1.2","o":8,"w":"原始檔 90 天內可能要重新處理，需即時存取，S3 Standard 最合適；90 天後即可刪除，直接用 Lifecycle expiration 到期刪除最省。轉 Glacier 反而多了轉換與最低保存天數費用。","p":["s3","s3_tier"],"k":"s3_tier","x":[],"d":""},{"n":332,"q":"大學 App 分析多語論文，回饋需精準引用教科書章節並用學生所選語言。最低營運負擔？","a":"B","t":[["B","Bedrock Knowledge Bases＋多語模型"]],"s":"11.4","o":259,"w":"要依教科書給回饋、引用章節並用學生所選語言：Bedrock Knowledge Bases 是託管 RAG，以教材為來源並附 source citations，搭配多語模型輸出指定語言，不必自建向量庫或微調模型。","p":["s3","ml","app"],"k":"ml","x":[],"d":""},{"n":333,"q":"限制 S3 存取並用 AWS 託管金鑰加密；需管理 Lambda 用的 DB 憑證並自動輪換。哪個方案？","a":"B","t":[["B","IAM＋SSE-KMS＋Secrets Manager 輪換"]],"s":"12.5","o":290,"w":"IAM policies 控管 S3 存取；SSE-KMS 以 KMS 金鑰做伺服器端加密；Secrets Manager 儲存 Lambda 用的 DB 憑證並以 rotation Lambda 自動輪換。環境變數、Parameter Store 沒有原生輪換。","p":["secrets","lambda","s3"],"k":"secrets","x":["iam","kms"],"d":""},{"n":334,"q":"半結構化交易資料存無伺服器 DB，少寫多讀，需毫秒內取回。最低營運負擔？","a":"D","t":[["D","DynamoDB＋DAX 快取"]],"s":"10.3","o":245,"w":"要 serverless、存半結構化資料、毫秒內讀取，DynamoDB 正好符合；讀多寫少再加上 DAX 記憶體快取，熱門讀取延遲更低，且兩者都全託管。S3 Transfer Acceleration 只加速傳輸，不是資料庫。","p":["app","dynamodb"],"k":"dynamodb","x":[],"d":""},{"n":335,"q":"Redshift 分析查詢與更新維度表的 ETL 同時跑，造成表鎖、逾時與死結。哪個方案能修正？","a":"D","t":[["D","ETL/分析分叢集＋data sharing"]],"s":"9.9","o":237,"w":"根源是 ETL 寫入與分析查詢在同一叢集搶鎖；把 ETL 與分析拆到不同 Redshift cluster 隔離工作負載，再用 data sharing 與跨資料庫查詢讓分析端讀到一致資料，鎖表、逾時與死結就消失。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":336,"q":"S3 資料湖每天數百萬筆感測資料，每天依感測器類別做複雜查詢。查詢最快？","a":"C","t":[["C","Parquet，依類別分區，依日期排序"]],"s":"8.3","o":180,"w":"查詢都針對特定 sensor category，依類別分區可讓查詢只掃相關分區；Parquet 欄式格式減少讀取量，分區內再依日期排序利於時間範圍跳讀。依日期分區則查單一類別仍要掃所有分區。","p":["src_stream","s3"],"k":"s3","x":[],"d":""},{"n":337,"q":"Redshift orders 表需刪除過時記錄並從 staging 表插入最新資料，下游需即時最新。哪個方案？","a":"D","t":[["D","Redshift 預存程序刪除後插入"]],"s":"9.8","o":233,"w":"資料都已在 Redshift 內，最直接是寫 stored procedure：先刪除 orders 的過時記錄，再從 staging 表插入最新記錄，在庫內一次完成更新。Spectrum、Athena 都不適合拿來改 Redshift 表。","p":["redshift","users"],"k":"redshift","x":[],"d":""},{"n":338,"q":"Firehose 將 CW Logs 送到 S3 供稽核，只送相關日誌且轉成相容格式，需穩定效能。哪個方案？","a":"B","t":[["B","訂閱篩選目的地為 Firehose＋Lambda"]],"s":"14.3","o":332,"w":"在 log group 建 subscription filter，只把相關日誌送往目的地 Firehose，再由 Firehose 呼叫 Lambda 轉成分析要的格式後交付 S3。filter 沒把 Firehose 設成目的地，日誌就送不過去。","p":["cloudwatch","firehose","lambda","s3"],"k":"cloudwatch","x":[],"d":""},{"n":339,"q":"網站與 App 即時分析，以最低延遲擷取百萬事件，需可擴展、耐久不遺失。最具成本效益？","a":"A","t":[["A","KDS＋Lambda 處理＋Redshift"]],"s":"3.1","o":49,"w":"Kinesis
