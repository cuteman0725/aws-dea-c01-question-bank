<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="AWS DEA-C01 題庫 342 題動態圖解：題目、正確答案、各選項的資料流程與卡住的地方。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DEA 題庫動態圖解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone = one column with a sticky question bar and a slide-over question list; >=1100px = list sidebar + question column. The live flow diagram is the one loud element; everything else stays quiet. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#E3EAE6; --line:#C6D2CC;
  --fg:#14201C; --muted:#55665F;
  --accent:#08866A; --accent-ink:#065443; --accent-soft:#D8F0E7; --on-accent:#FFFFFF;
  --red:#C8322F; --red-ink:#8E1B19; --red-soft:#FBE3E1;
  --amber:#C98A00; --amber-ink:#6B4700; --amber-soft:#FBF0D2;
  --off:#A9B6B0;
  --tk1:#2A68D1; --tk2:#7A55D6; --tk3:#6B7886; --tk4:#C2417F; --on-tk:#FFFFFF;
  --lv-debug:#6B7886; --lv-info:#2A68D1; --lv-warn:#E2A008; --lv-error:#D23838; --lv-fatal:#8F1630;
  --on-warn:#241800;
  --font-display:"Barlow Condensed","Arial Narrow","Noto Sans TC",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --line:#2C3934;
    --fg:#E2EBE7; --muted:#93A49D;
    --accent:#38D0A3; --accent-ink:#9DEFD4; --accent-soft:#12352B; --on-accent:#04261C;
    --red:#FF6A6A; --red-ink:#FFB8B4; --red-soft:#3A1718;
    --amber:#F3B92E; --amber-ink:#F8D78E; --amber-soft:#382B0C;
    --off:#4A5853;
    --tk1:#5E9BFF; --tk2:#A98BFF; --tk3:#8E9CAA; --tk4:#F07AB5; --on-tk:#08111C;
    --lv-debug:#8E9CAA; --lv-info:#5E9BFF; --lv-warn:#F3B92E; --lv-error:#FF6A6A; --lv-fatal:#E0577A;
    --on-warn:#241800;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --line:#2C3934;
  --fg:#E2EBE7; --muted:#93A49D;
  --accent:#38D0A3; --accent-ink:#9DEFD4; --accent-soft:#12352B; --on-accent:#04261C;
  --red:#FF6A6A; --red-ink:#FFB8B4; --red-soft:#3A1718;
  --amber:#F3B92E; --amber-ink:#F8D78E; --amber-soft:#382B0C;
  --off:#4A5853;
  --tk1:#5E9BFF; --tk2:#A98BFF; --tk3:#8E9CAA; --tk4:#F07AB5; --on-tk:#08111C;
  --lv-debug:#8E9CAA; --lv-info:#5E9BFF; --lv-warn:#F3B92E; --lv-error:#FF6A6A; --lv-fatal:#E0577A;
  --on-warn:#241800;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.75 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--font-mono)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand .tag{flex:none;white-space:nowrap;font:700 .95rem/1.2 var(--font-display);letter-spacing:.08em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
.brand b{font-weight:900;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.brand b{display:none}}
.nav{display:flex;align-items:center;gap:6px}
.nbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.nbtn:hover{border-color:var(--fg)}
.nbtn svg{width:16px;height:16px}
.nbtn .qn{font:700 1.05rem/1 var(--font-display);letter-spacing:.04em}
.nbtn .of{font-size:.75rem;color:var(--muted)}
@media (min-width:600px){.bar-in{padding-inline:24px}}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
@media (min-width:600px){.wrap{padding-inline:24px}}
.cols{display:block}
.side{display:none}
@media (min-width:1100px){
  .cols{display:grid;grid-template-columns:320px minmax(0,1fr);gap:36px;align-items:start}
  .side{display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);min-height:0}
  .lst-btn{display:none}
}
.main{min-width:0;max-width:880px}

/* list (sidebar + drawer share it) */
.finder{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.search{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:400 .95rem var(--font-body)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:.8rem;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.count{font-size:.78rem;color:var(--muted)}
.qlist{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;flex:1;border-top:1px solid var(--line)}
.qitem{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.qitem:hover{background:var(--surface)}
.qitem[aria-current="true"]{background:var(--accent-soft)}
.qitem .n{font:700 1rem/1.4 var(--font-display);letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.qitem .n i{width:7px;height:7px;border-radius:50%;background:var(--dot,var(--off))}
.qitem .t{font-size:.86rem;line-height:1.5;min-width:0}
.qitem .t small{display:block;color:var(--muted);font-size:.74rem}
.ly-Data{--dot:#2A68D1}.ly-Workload{--dot:#7A55D6}.ly-Security{--dot:#C8322F}.ly-Network{--dot:#08866A}.ly-Governance{--dot:#C98A00}.ly-Other{--dot:#8A97A3}

/* jump panel */
.jbtn{gap:6px}
.jbtn svg{color:var(--muted)}
.jump{position:fixed;inset:0;z-index:50}
.jump-bg{position:absolute;inset:0;background:rgba(10,16,14,.5)}
.jump-box{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--surface);border-radius:18px 18px 0 0;outline:none;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.jump-box{left:50%;right:auto;bottom:auto;top:7vh;width:min(440px,calc(100% - 32px));max-height:86vh;margin-left:calc(min(440px,calc(100% - 32px)) / -2);border-radius:18px}}
.jump-top{display:flex;justify-content:space-between;align-items:center}
.jump-top b{font-weight:900}
.jump-disp{display:flex;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:4px 0;background:var(--bg);border:1px solid var(--line);border-radius:14px;font:700 2.5rem/1 var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.jump-disp .jq{color:var(--muted)}
.jump-disp .caret{width:2px;height:.85em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.jump-pv{margin:0;min-height:3.3em;text-align:center;font-size:.92rem;line-height:1.55}
.jump-pv b{font-family:var(--font-display);letter-spacing:.04em;margin-right:4px}
.jump-pv small{display:block;color:var(--muted);font-size:.78rem}
.jump-pv[data-s="err"]{color:var(--red-ink)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:700 1.45rem/1 var(--font-display);cursor:pointer;touch-action:manipulation}
.pad button:hover{border-color:var(--fg)}
.pad button:active{background:var(--surface-2)}
.pad .go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font:700 1.05rem/1 var(--font-body)}
.pad .go:disabled{opacity:.4;cursor:default}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.rchip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:700 .92rem/1.4 var(--font-display);letter-spacing:.04em;cursor:pointer}
.rchip:hover{border-color:var(--fg)}
.grid-h{margin:4px 0 0;font-size:.82rem;font-weight:700}
.grid-h span{font-weight:400;color:var(--muted);font-size:.74rem}
.rtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.rtabs button{flex:none;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:600 .8rem/1.3 var(--font-display);letter-spacing:.03em;white-space:nowrap;cursor:pointer}
.rtabs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ngrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.ngrid button{position:relative;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:600 .88rem/1 var(--font-display);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation}
.ngrid button:hover{border-color:var(--fg)}
.ngrid button::after{content:"";position:absolute;left:50%;bottom:3px;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:var(--dot,var(--off))}
.ngrid button.fl::before{content:"";position:absolute;top:-1px;right:-1px;border-top:8px solid var(--amber);border-left:8px solid transparent;border-top-right-radius:8px}
.ngrid button[aria-current="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ngrid button.typed{outline:2px solid var(--accent);outline-offset:1px}
.jump-tip{margin:0;font-size:.74rem;color:var(--muted)}
@media (hover:none){.jump-tip{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-inline:16px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer-h b{font-weight:900}

/* question */
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px;font-size:.82rem;color:var(--muted)}
.kicker .qn{font:700 1.1rem/1.2 var(--font-display);letter-spacing:.06em;color:var(--fg)}
.kicker .ly{display:inline-flex;align-items:center;gap:5px}
.kicker .ly i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
h1{margin:0 0 8px;font-weight:900;font-size:clamp(1.45rem,1.05rem + 2vw,2.1rem);line-height:1.3;text-wrap:balance}
h2{margin:0 0 6px;font-size:1.12rem;line-height:1.45;text-wrap:balance}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.76rem;font-weight:700;letter-spacing:.14em;color:var(--accent-ink)}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--accent)}
.sec{margin-top:26px}
.flag{display:grid;gap:2px;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber-ink);font-size:.88rem;line-height:1.6}
.flag b{font-size:.78rem}
.scene{margin:0}
.ask{margin:8px 0 0;font-weight:700}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.need{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.82rem;line-height:1.5}
.need svg{width:13px;height:13px;flex:none}
.need[data-s="ok"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.need[data-s="red"]{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.need[data-s="amber"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
.opts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.opt{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;font-size:.93rem;line-height:1.5;cursor:pointer}
.opt:hover{background:var(--surface);border-color:var(--fg)}
.opt-k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font:700 17px/1 var(--font-display)}
.opt-go{font-size:.74rem;color:var(--accent-ink);white-space:nowrap}
.fine{margin:8px 0 0;font-size:.76rem;color:var(--muted)}
.ans{padding:14px 16px;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px}
.ans-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.ans-k{min-width:58px;height:68px;padding:0 10px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 2.9rem/1 var(--font-display);letter-spacing:.02em}
.ans-k.multi{font-size:2.2rem}
.ans h2{margin:0 0 4px}
.ans p{margin:0;color:var(--muted);font-size:.93rem}

/* diagram section */
.ctl{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:5;background:var(--bg);padding-block:8px}
@media (min-width:1100px){.ctl{position:static}}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px}
.seg button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:0;border-radius:10px;background:transparent;cursor:pointer}
.seg b{font:700 1.15rem/1 var(--font-display);letter-spacing:.04em;white-space:nowrap}
.seg span{font-size:.68rem;line-height:1.2;color:var(--muted);white-space:nowrap}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.85}
.seg .ok b::after{content:"";display:inline-block;width:6px;height:6px;margin-left:3px;border-radius:50%;background:var(--accent);vertical-align:.32em}
.tourbar{height:3px;margin-top:6px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.tourbar i{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.banner{display:grid;gap:4px;margin:6px 0 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.93rem;line-height:1.6}
.banner-tag{justify-self:start;padding:1px 9px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:.78rem;font-weight:700}
.banner-opt{color:var(--muted);font-size:.84rem}
.banner[data-kind="ok"]{background:var(--accent-soft);border-color:var(--accent)}
.banner[data-kind="ok"] .banner-tag{background:var(--accent);color:var(--on-accent)}
.banner[data-kind="no"] .banner-tag{background:var(--red);color:var(--surface)}
.dneeds{margin:0 0 10px}
.fig{margin:0;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;margin-inline:auto}
.fig.is-portrait svg{max-width:460px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font:600 .86rem/1.3 var(--font-body);cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn svg{width:14px;height:14px;flex:none}
.points{margin:8px 0 0;padding-left:1.3em;display:grid;gap:4px}
.memo{margin:14px 0 0;padding:14px 16px;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:14px;font-weight:700;line-height:1.65}
.memo small{display:block;font-size:.74rem;letter-spacing:.12em;color:var(--accent-ink);margin-bottom:2px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pager .btn{max-width:48%}
.pager .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:28px;font-size:.78rem;color:var(--muted)}

/* SVG */
.dg{font-family:var(--font-body)}
.dg .nd{fill:var(--surface);stroke:var(--fg);stroke-opacity:.42;stroke-width:1.4}
.dg .nd.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2.6}
.dg .nd.b-red{stroke:var(--red);stroke-opacity:1;stroke-width:2.2}
.dg .nd.b-amber{stroke:var(--amber);stroke-opacity:1;stroke-width:2.2;stroke-dasharray:5 3}
.dg .nd.end-ok{stroke:var(--accent);stroke-opacity:1;stroke-width:2.2}
.dg .ico{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .ico .f{fill:var(--fg);stroke:none}
.dg .ibg{fill:var(--surface-2)}
.dg .nl{fill:var(--fg);font-size:12px;font-weight:700}
.dg .ns{fill:var(--muted);font-size:10px}
.dg .eg{stroke:var(--muted);stroke-width:2;stroke-opacity:.7;fill:none}
.dg .arw{fill:var(--muted)}
.dg .el-bg{fill:var(--bg);stroke:var(--line);stroke-width:1}
.dg .el{fill:var(--muted);font-size:9.5px}
.dg .dim{opacity:.3}
.dg .bdg-c{stroke:var(--surface);stroke-width:2}
.dg .bdg-red{fill:var(--red)}
.dg .bdg-amber{fill:var(--amber)}
.dg .bdg-ok{fill:var(--accent)}
.dg .bdg-g{fill:none;stroke:var(--surface);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg .bdg-gf{fill:var(--surface);stroke:none}
.dg .tg-red rect{fill:var(--red-soft);stroke:var(--red)}
.dg .tg-red text{fill:var(--red-ink)}
.dg .tg-amber rect{fill:var(--amber-soft);stroke:var(--amber)}
.dg .tg-amber text{fill:var(--amber-ink)}
.dg .tg-hl rect{fill:var(--accent-soft);stroke:var(--accent)}
.dg .tg-hl text{fill:var(--accent-ink)}
.dg .tg rect{stroke-width:1.2}
.dg .tg text{font-size:10.5px;font-weight:700}
.dg .cnt{fill:var(--muted);font-size:9.5px}
.dg .pt-r{fill:var(--c)}
.dg .pt-t{fill:var(--on);font:700 9.5px var(--font-body);letter-spacing:.02em}
.dg .pt.rej .pt-r{fill:var(--off)}
.dg .pt.rej .pt-t{opacity:.35}
.dg .pt-x{stroke:var(--fg);stroke-width:2;stroke-linecap:round;opacity:0}
.dg .pt.rej .pt-x{opacity:1}
.dg .pt.bad .pt-r{stroke:var(--red);stroke-width:2}
.dg .coin{fill:var(--amber-ink);font:700 12px var(--font-display)}
.c-tk1{--c:var(--tk1);--on:var(--on-tk)}.c-tk2{--c:var(--tk2);--on:var(--on-tk)}.c-tk3{--c:var(--tk3);--on:var(--on-tk)}.c-tk4{--c:var(--tk4);--on:var(--on-tk)}
.c-ok{--c:var(--accent);--on:var(--on-accent)}

function cw(ch, f) {

    if (cur.trim()) lines.push(cur.trimEnd());
    cur = '';
    t = t.trimStart();
    if (fits(t)) { cur = t; continue; }
    let part = '';
    for (const ch of t) {

    while (last.length && !fits(last + '…')) last = last.slice(0, -1);
    keep[maxLines - 1] = last + '…';

  }

}

function matches(q) {
  if (F.layer !== 'all' && q.layer !== F.layer) return false;
  if (F.flag && !q.flag) return false;
  const t = F.text.trim().toLowerCase();
  if (!t) return true;
  if (/^q?\d+$/.test(t)) return String(q.n).startsWith(t.replace('q', ''));
  return hay.get(q.n).includes(t);
}
function renderLists() {
  const list = Q.filter(matches);
  const html = list.map((q) => `<li><button type="button" class="qitem ly-${q.layer}" data-n="${q.n}" aria-current="${cur && cur.n === q.n}"><span class="n"><i></i>${q.n}</span><span class="t">${esc(q.title)}<small>${esc(q.topic)}</small></span></button></li>`).join('');
  for (const id of ['side', 'drawer']) {
    const ol = $('#' + id + '-list');
    if (!ol) continue;
    ol.innerHTML = html || '<li class="count" style="padding:12px 4px">沒有符合的題目</li>';
    $('#' + id + '-count').textContent = `${list.length} 題`;
    for (const b of $$('.fchip', $('#finder-' + id))) {
      b.setAttribute('aria-pressed', String(b.dataset.flag ? F.flag : F.layer === b.dataset.layer));
    }
  }
}
function wireFinder(id) {
  const box = $('#finder-' + id);
  box.innerHTML = finderHTML(id);
  const inp = $('#' + id + '-q');
  inp.addEventListener('input', () => {
    F.text = inp.value;
    for (const other of ['side', 'drawer']) { const o = $('#' + other + '-q'); if (o && o !== inp) o.value = inp.value; }
    renderLists();
  });
  inp.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const t = inp.value.trim().toLowerCase().replace(/^q/, '');
    let n = /^\d+$/.test(t) && byN.has(Number(t)) ? Number(t) : null;
    if (n === null) { const first = Q.find(matches); if (first) n = first.n; }
    if (n !== null) { openQ(n); closeDrawer(); window.scrollTo(0, 0); }
  });
  box.addEventListener('click', (ev) => {
    const chip = ev.target.closest('.fchip');
    if (chip) {
      if (chip.dataset.flag) F.flag = !F.flag; else F.layer = chip.dataset.layer;
      renderLists();
      return;
    }
    const it = ev.target.closest('.qitem');
    if (it) { openQ(Number(it.dataset.n)); closeDrawer(); }
  });
}
function openDrawer() { $('#drawer').hidden = false; const i = $('#drawer-q'); if (i) i.focus(); const c = $('#drawer-list [aria-current="true"]'); if (c) c.scrollIntoView({ block: 'center' }); }
function closeDrawer() { $('#drawer').hidden = true; }

/* question page */
function needChips(q, s) {
  return q.needs.map((nd, i) => {
    let st = '', ico = ICO_BTN.dot;
    if (s && s.ok) { st = 'ok'; ico = ICO_BTN.ok; }
    else if (s) {
      const hit = (s.view.bad || []).filter((b) => b.need === i);
      if (hit.length) {
        const tone = hit.some((b) => TONE[effOf(b, q.needs)] === 'red') ? 'red' : 'amber';
        st = tone; ico = ICO_BTN.x;
      }
    }
    return `<span class="need"${st ? ` data-s="${st}"` : ''}>${ico}${esc(nd.t)}</span>`;
  }).join('');
}
function buildStates(q) {
  const out = [];
  const letters = Object.keys(q.opts).sort();
  if (q.sol) out.push({ key: 'sol', label: q.ans.join('+'), sub: '正解', ok: true, t: q.sol.t, why: q.sol.why, view: { lanes: q.sol.lanes, bad: [], ok: true, hlTag: '', needs: q.needs } });
  for (const k of letters) {
    const o = q.opts[k], ok = q.ans.includes(k);
    const b0 = (o.bad || [])[0];
    out.push({ key: k, label: k, sub: ok ? '正解' : (b0 ? EFFECT_WORD[effOf(b0, q.needs)] : '不行'), ok, t: o.t, why: o.why, view: { lanes: o.lanes, bad: o.bad || [], ok, hlTag: ok && q.sol ? k : null, needs: q.needs } });
  }
  return out;
}
function renderQ(q) {
  const letters = Object.keys(q.opts).sort();
  const multi = q.ans.length > 1;
  const idx = Q.indexOf(q), prev = Q[idx - 1], next = Q[idx + 1];
  const ansWhy = q.sol ? q.sol.why : q.ans.map((k) => q.opts[k].why).join(' ');
  const flagLabel = q.flag ? ({ dispute: '爭議題', version: '版本差異', note: '補充說明' }[q.flag.k] || '註記') : '';
  $('#main').innerHTML = `<article>
    <p class="kicker"><span class="qn">Q${q.n}</span><span class="ly ly-${q.layer}"><i></i>${esc(LAYER_ZH[q.layer] || q.layer)}</span><span>${esc(q.topic)}</span></p>
    <h1>${esc(q.title)}</h1>
    ${q.flag ? `<p class="flag"><b>${flagLabel}</b>${esc(q.flag.t)}</p>` : ''}
    <section class="sec">
      <p class="eyebrow">題目</p>
      <p class="scene">${esc(q.scene)}</p>
      <p class="ask">${esc(q.ask)}</p>
      <div class="needs">${needChips(q, null)}</div>
      <ol class="opts">${letters.map((k) => `<li><button type="button" class="opt" data-go="${k}"><span class="opt-k">${k}</span><span>${esc(q.opts[k].t)}</span><span class="opt-go" aria-hidden="true">看圖 →</span></button></li>`).join('')}</ol>
      <p class="fine">題目與選項依 Notion 題庫筆記的題意整理，不是英文原文。正確答案字母以題庫為準；筆記沒標字母的錯誤選項依筆記順序排列，字母可能和原題不同。</p>
    </section>
    <section class="sec ans">
      <p class="eyebrow">正確答案</p>
      <div class="ans-main"><span class="ans-k${multi ? ' multi' : ''}">${q.ans.join('+')}</span>
        <div><h2>${q.ans.map((k) => esc(q.opts[k].t)).join('<br>')}</h2><p>${esc(ansWhy)}</p></div></div>
    </section>
    <section class="sec" id="dsec">
      <p class="eyebrow">動態架構圖</p>
      <h2>切換選項，看資料怎麼流</h2>
      <div class="ctl"><div class="seg" id="seg" role="group" aria-label="選擇要看的選項"></div><div class="tourbar" id="tourbar" hidden><i id="tourfill"></i></div></div>
      <div class="banner" id="banner" aria-live="polite"><span class="banner-tag" id="b-tag"></span><span id="b-txt"></span><span class="banner-opt" id="b-opt"></span></div>
      <div class="needs dneeds" id="dneeds"></div>
      <figure class="fig" id="fig"></figure>
      <div class="legend" id="legend"></div>
      <div class="actions"><button type="button" class="btn" id="btn-play"></button><button type="button" class="btn" id="btn-tour"></button></div>
    </section>
    <section class="sec">
      <p class="eyebrow">理由</p>
      <h2>為什麼是 ${q.ans.join(' + ')}</h2>
      <ul class="points">${q.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
      <p class="memo"><small>一句話記住</small>${esc(q.memo)}</p>
    </section>
    <nav class="pager" aria-label="上一題與下一題">
      ${prev ? `<button type="button" class="btn" data-open="${prev.n}"><span>← Q${prev.n} ${esc(prev.title)}</span></button>` : '<span></span>'}
      ${next ? `<button type="button" class="btn" data-open="${next.n}"><span>Q${next.n} ${esc(next.title)} →</span></button>` : '<span></span>'}
    </nav>
    <p class="foot">內容依據：Notion「DEA 刷題｜AI 解題紀錄」題庫筆記。${q.n === 342 ? '這題另有<a href="Flow_Q342_ZH.html" target="_blank" rel="noopener">精緻版動態圖</a>。' : ''}</p>
  </article>`;
  states = buildStates(q);
  $('#seg').innerHTML = states.map((s) => `<button type="button" data-state="${s.key}" class="${s.ok ? 'ok' : ''}" aria-pressed="false"><b>${esc(s.label)}</b><span>${esc(s.sub)}</span></button>`).join('');
  $('#seg').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-state]'); if (b) setState(b.dataset.state); });
  for (const b of $$('.opt', $('#main'))) b.addEventListener('click', () => { setState(b.dataset.go); revealDiagram(); });
  for (const b of $$('[data-open]', $('#main'))) b.addEventListener('click', () => { openQ(Number(b.dataset.open)); window.scrollTo(0, 0); });
  $('#btn-play').addEventListener('click', () => { E.paused = !E.paused; updateButtons(); eRun(); });
  $('#btn-tour').addEventListener('click', () => { if (tour.on) stopTour(); else startTour(); });
  watchFig();
  const def = states.find((s) => s.key === 'sol') || states.find((s) => s.ok);
  setState(def.key);
  updateButtons();
}
function setState(key, fromTour) {
  if (!fromTour) stopTour();
  const s = states.find((x) => x.key === key);
  if (!s) return;
  stateKey = key;
  for (const b of $$('#seg button')) b.setAttribute('aria-pressed', String(b.dataset.state === key));
  const ban = $('#banner');
  ban.dataset.kind = s.ok ? 'ok' : 'no';
  $('#b-tag').textContent = s.ok ? (key === 'sol' ? `✓ 正解 ${cur.ans.join(' + ')}` : `✓ ${key} 正解`) : `✕ ${key} 不行`;
  $('#b-txt').textContent = s.why;
  $('#b-opt').textContent = key === 'sol' ? s.t : `${key}：${s.t}`;
  $('#dneeds').innerHTML = needChips(cur, s);
  mountDiagram();
  renderLegend(s);
}
function renderLegend(s) {
  const seen = new Map();
  s.view.lanes.forEach((lane) => {
    for (const tok of laneTokens(lane)) if (!seen.has(tok)) seen.set(tok, tokenClass(lane, tok));
    for (const st of lane.steps) if (st.to && !seen.has(st.to)) seen.set(st.to, 'c-ok');
  });
  let h = [...seen].map(([tok, c]) => `<span class="${c}"><i></i>${esc(tok)}</span>`).join('');
  h += '<span>小方塊＝流動的資料，打叉彈回＝被篩掉或擋下</span>';
  if (!s.ok) h += '<span>紅框：做不到或結果錯</span><span>琥珀框：可行但太慢、維運重或太貴</span>';
  $('#legend').innerHTML = h;
}
let figRO = null, figIO = null, curMode = null;
function figMode() { const w = $('#fig').clientWidth || 360; return w < 620 ? 'port' : 'land'; }
function mountDiagram() {
  const s = states.find((x) => x.key === stateKey);
  const fig = $('#fig');
  curMode = figMode();
  const view = Object.assign({ title: `Q${cur.n} ${s.ok ? '正確' : '錯誤'}選項 ${s.label} 的架構流程：${s.why}` }, s.view);
  eSetup(fig, view, curMode);
  eRun();
}
function watchFig() {
  if (figRO) figRO.disconnect();
  if (figIO) figIO.disconnect();
  const fig = $('#fig');
  if ('ResizeObserver' in window) {
    figRO = new ResizeObserver(() => { if (figMode() !== curMode && stateKey) mountDiagram(); });
    figRO.observe(fig);
  }
  if ('IntersectionObserver' in window) {
    figIO = new IntersectionObserver((es) => { for (const e of es) E.visible = e.isIntersecting; eRun(); }, { threshold: [0, 0.2] });
    figIO.observe(fig);
  }
}
function revealDiagram() {
  const d = $('#dsec');
  const r = d.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  if (r.top < 0 || r.top > vh * 0.45) d.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
}
function updateButtons() {
  const bp = $('#btn-play'), bt = $('#btn-tour');
  if (!bp) return;
  bp.innerHTML = E.paused ? ICO_BTN.play + '<span>播放動畫</span>' : ICO_BTN.pause + '<span>暫停動畫</span>';
  bt.innerHTML = tour.on ? ICO_BTN.stop + `<span>停止導覽（${tour.i + 1}/${tour.list.length}）</span>` : ICO_BTN.tour + '<span>依序看：錯的選項 → 正解</span>';
}
function startTour() {
  const wrong = states.filter((s) => !s.ok).map((s) => s.key);
  const right = (states.find((s) => s.key === 'sol') || states.find((s) => s.ok)).key;
  tour.list = [...wrong, right];
  tour.on = true; tour.i = 0; tour.t = 0;
  E.paused = false;
  setState(tour.list[0], true);
  $('#tourbar').hidden = false;
  updateButtons();
  eRun();
}
function stopTour() {
  if (!tour.on) return;
  tour.on = false;
  const tb = $('#tourbar');
  if (tb) tb.hidden = true;
  updateButtons();
}
E.onTick = (dt) => {
  if (!tour.on) return;
  tour.t += dt;
  const f = $('#tourfill');
  if (f) f.style.transform = `scaleX(${Math.min(1, tour.t / TOUR_DUR).toFixed(3)})`;
  if (tour.t >= TOUR_DUR) {
    tour.t = 0; tour.i += 1;
    setState(tour.list[tour.i], true);
    if (tour.i >= tour.list.length - 1) stopTour(); else updateButtons();
  }
};
function openQ(n) {
  const q = byN.get(n) || Q[0];
  if (!q) return;
  stopTour();
  cur = q;
  $('#bar-qn').textContent = 'Q' + q.n;
  $('#bar-of').textContent = '/ ' + Q[Q.length - 1].n;
  $('#open-jump').setAttribute('aria-label', `輸入題號跳題，目前第 ${q.n} 題`);
  document.title = `Q${q.n} ${q.title}｜DEA 題庫動態圖解`;
  store.set('dea-flow-last', String(q.n));
  recent = [q.n, ...recent.filter((x) => x !== q.n)].slice(0, 8);
  store.set('dea-flow-recent', JSON.stringify(recent));
  if (location.hash !== '#q' + q.n) { try { history.replaceState(null, '', '#q' + q.n); } catch (e) { /* ignore */ } }
  renderQ(q);
  renderLists();
}
function step(d) { const i = Q.indexOf(cur); const q = Q[i + d]; if (q) { openQ(q.n); window.scrollTo(0, 0); } }

/* jump panel */
if (!Q.length) { $('#main').innerHTML = '<p>沒有題目資料。</p>'; return; }
const MAXN = Q[Q.length - 1].n, MINN = Q[0].n;
const RANGES = [];
for (let a = 1; a <= MAXN; a += 50) RANGES.push([a, Math.min(a + 49, MAXN)]);
const J = { val: '', range: 0, ret: null };
const rangeOf = (n) => Math.max(0, RANGES.findIndex(([a, b]) => n >= a && n <= b));
function renderJump() {
  const q = J.val ? byN.get(Number(J.val)) : null;
  $('#jump-num').textContent = J.val;
  const pv = $('#jump-pv');
  if (!J.val) { pv.dataset.s = ''; pv.innerHTML = `用數字鍵輸入題號（${MINN}–${MAXN}）<small>也可以直接點下面的最近看過或題號表</small>`; }
  else if (q) { pv.dataset.s = ''; pv.innerHTML = `<b>Q${q.n}</b>${esc(q.title)}<small>${esc(LAYER_ZH[q.layer] || q.layer)} · ${esc(q.topic)}${q.flag ? ' · 有註記' : ''}</small>`; }
  else { pv.dataset.s = 'err'; pv.innerHTML = `沒有第 ${esc(J.val)} 題<small>題號範圍是 ${MINN}–${MAXN}</small>`; }
  $('#jump-go').disabled = !q;
  const rc = recent.filter((x) => !cur || x !== cur.n).slice(0, 7);
  $('#recent').innerHTML = rc.length ? '<span>最近看過</span>' + rc.map((x) => `<button type="button" class="rchip" data-n="${x}" title="${esc(byN.get(x).title)}">Q${x}</button>`).join('') : '';
  $('#rtabs').innerHTML = RANGES.map(([a, b], i) => `<button type="button" data-r="${i}" aria-pressed="${i === J.range}">${a}–${b}</button>`).join('');
  const [a, b] = RANGES[J.range];
  let g = '';
  for (let k = a; k <= b; k++) {
    const qq = byN.get(k);
    if (!qq) { g += `<button type="button" disabled style="opacity:.3">${k}</button>`; continue; }
    g += `<button type="button" class="ly-${qq.layer}${qq.flag ? ' fl' : ''}${q && q.n === k ? ' typed' : ''}" data-n="${k}" aria-current="${!!cur && cur.n === k}" aria-label="第 ${k} 題：${esc(qq.title)}">${k}</button>`;
  }
  $('#ngrid').innerHTML = g;
}
function pressDigit(d) {
  if (J.val.length >= 3) J.val = '';
  J.val = (J.val + d).replace(/^0+/, '');
  if (J.val && byN.has(Number(J.val))) J.range = rangeOf(Number(J.val));
  renderJump();
}
function openJump(first) {
  J.ret = document.activeElement;
  J.val = '';
  J.range = rangeOf(cur ? cur.n : MINN);
  closeDrawer();
  $('#jump').hidden = false;
  document.documentElement.style.overflow = 'hidden';
  if (first) pressDigit(first); else renderJump();
  $('#jump-box').focus();
}
function closeJump() {
  if ($('#jump').hidden) return;
  $('#jump').hidden = true;
  document.documentElement.style.overflow = '';
  const r = J.ret && J.ret.isConnected && J.ret.focus ? J.ret : $('#open-jump');
  try { r.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}
function jumpGo(n) {
  const target = n || Number(J.val);
  if (!byN.has(target)) { renderJump(); return; }
  closeJump();
  openQ(target);
  window.scrollTo(0, 0);
}
$('#open-jump').addEventListener('click', () => openJump());
$('#jump').addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('[data-close]')) { closeJump(); return; }
  const d = t.closest('[data-d]');
  if (d) { pressDigit(d.dataset.d); return; }
  const k = t.closest('[data-k]');
  if (k) { if (k.dataset.k === 'back') { J.val = J.val.slice(0, -1); renderJump(); } else jumpGo(); return; }
  const r = t.closest('[data-r]');
  if (r) { J.range = Number(r.dataset.r); renderJump(); return; }
  const nb = t.closest('[data-n]');
  if (nb) jumpGo(Number(nb.dataset.n));
});

/* boot */
wireFinder('side');
wireFinder('drawer');
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#open-list').addEventListener('click', openDrawer);
$('#close-list').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (ev) => {
  if (!$('#jump').hidden) {
    if (/^[0-9]$/.test(ev.key)) { pressDigit(ev.key); ev.preventDefault(); }
    else if (ev.key === 'Backspace') { J.val = J.val.slice(0, -1); renderJump(); ev.preventDefault(); }
    else if (ev.key === 'Enter' && J.val) { jumpGo(); ev.preventDefault(); }
    else if (ev.key === 'Escape') { closeJump(); ev.preventDefault(); }
    return;
  }
  if (ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable]')) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^[0-9]$/.test(ev.key) && $('#drawer').hidden) { ev.preventDefault(); openJump(ev.key); return; }
  if (ev.key === '/') { const s = $('#side-q'); if (s && s.offsetParent) { ev.preventDefault(); s.focus(); } return; }
  if (ev.key === 'ArrowLeft') step(-1);
  else if (ev.key === 'ArrowRight') step(1);
  else if (ev.key === 'Escape') closeDrawer();
});
document.addEventListener('visibilitychange', eRun);
window.addEventListener('hashchange', () => { const m = /^#q(\d+)$/.exec(location.hash); if (m && byN.has(Number(m[1])) && (!cur || cur.n !== Number(m[1]))) openQ(Number(m[1])); });
const m0 = /^#q(\d+)$/.exec(location.hash);
const start = (m0 && byN.has(Number(m0[1]))) ? Number(m0[1]) : (byN.has(Number(store.get('dea-flow-last'))) ? Number(store.get('dea-flow-last')) : Q[0].n);
openQ(start);
})();
</script>
